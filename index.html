 AO) và AO ⊥ MN.","giu":"∠ANM = ∠ABC (ý b), nên ∆AMN ∽ ∆ACB.","noi":"Tỉ số đồng dạng k = AN/AB = AH²/(AB.AC) = AH/(2R). Đường cao từ A của ∆AMN bằng k.AH = AH²/(2R).","nhin":"Nếu AH ≠ R√2 thì M, O, N còn thẳng hàng không? Điều kiện đó dùng ở bước nào?","nhinDap":"Không: khoảng cách từ O đến MN bằng |AH²/(2R) − R|, chỉ bằng 0 khi AH = R√2. Điều kiện dùng ở bước cuối.","deep":{"huong":[{"ten":"Góc bẹt tại O","kq":"tac","y":["Cần ∠MOA + ∠AON = 180°; không có góc nào tại O tính được theo M, N."]},{"ten":"Lượng giác","kq":"duoc","y":["AP = AN.sin∠ANM = AN.sin B; AN = AH²/AC; sin B = AH/AB ⇒ AP = AH³/(AB.AC).","Kẻ đường kính AK: AB.AC = AH.AK = 2R.AH ⇒ AP = AH²/(2R) = R khi AH = R√2."]},{"ten":"Bài toán phụ 6 mở rộng (đường cao tương ứng)","kq":"duoc","y":["Tỉ số đồng dạng k = AN/AB = AH/(2R); đường cao tương ứng AP = k.AH = AH²/(2R) = R."]}],"binh":["Hướng 2 và 3 thực chất là một; bài toán phụ 6 mở rộng cho cách nói gọn: “đường cao tương ứng tỉ lệ với tỉ số đồng dạng”. Điều kiện AH = R√2 là tín hiệu phải tính một độ dài, không phải tìm góc."]},"loai":"sector","gt":["∆ABC nhọn nội tiếp (O; R); đường cao AH","HM ⊥ AB, HN ⊥ AC","AH = R√2"],"inputs":[{"code":"G1, G6","text":"AO ⊥ MN tại P","keep":1,"why":""},{"code":"S1","text":"ý b: ∆ANM ∽ ∆ABC, tỉ số k","keep":1,"why":""},{"code":"V1","text":"k = AH²/(AB.AC)","keep":1,"why":""},{"code":"S3","text":"AB.AC = 2R.AH ⇒ k = AH/(2R)","keep":1,"why":""},{"code":"B6","text":"AP = k.AH = AH²/(2R)","keep":1,"why":""}],"steps":[{"cm":"∠OAC = 90° − ∠ABC","ld":"∆OAC cân tại O, ∠AOC = 2∠ABC","codes":["G6","G1"]},{"cm":"Gọi P = AO ∩ MN: ∠PAN + ∠ANP = (90° − ∠ABC) + ∠ABC = 90° ⇒ AO ⊥ MN tại P","ld":"Ý b: ∠ANM = ∠ABC","codes":["G7"]},{"cm":"∆ANM ∽ ∆ABC, tỉ số k = AN/AB = AH²/(AB.AC)","ld":"Ý b (g.g); AN.AC = AH²","codes":["S1","V1"]},{"cm":"AB.AC = AH.AK = 2R.AH ⇒ k = AH/(2R)","ld":"AK là đường kính: ∆ABH ∽ ∆AKC","codes":["S3"]},{"cm":"AP = k.AH = AH²/(2R)","ld":"AP, AH là hai đường cao tương ứng","codes":["B6"]},{"cm":"AH = R√2 ⇒ AP = R = AO ⇒ P trùng O ⇒ M, O, N thẳng hàng","ld":"P, O cùng nằm trên tia AO","codes":["K1"]}]},{"boost":["B6"],"id":"3.9","ch":3,"truong":"Trưng Vương","ky":"cuối HKII","de":["Cho tam giác ABC nhọn không cân (AB < AC) nội tiếp (O). Đường thẳng qua O vuông góc với BC tại M, cắt cung BC lớn, cung BC nhỏ của đường tròn (O) lần lượt tại S và K. Gọi D là giao điểm của AK và BC.","a) Chứng minh tứ giác ADMS là tứ giác nội tiếp.","b) Tia phân giác của ∠AOC cắt đường thẳng AS tại Q. Chứng minh KB² = KD.KA và tam giác AOQ đồng dạng với tam giác DBA.","c) Gọi T là trung điểm của đoạn thẳng AD. Chứng minh CT vuông góc với QK."],"yl":"c","yc":"Gọi T là trung điểm của đoạn thẳng AD. Chứng minh CT vuông góc với QK.","kl":"CT ⊥ QK","hinh":"img/b3.9.png","huong":"∠DTC = ∠AQK, rồi dùng ∆AQK vuông tại A.","giu":"∆AOQ ∽ ∆DBA nên ∠AQO = ∠DAB = ∠KAC.","noi":"∆ADC ∽ ∆QSO; T là trung điểm AD, O là trung điểm SK: chia đôi AD và nhân đôi SO được ∆DTC ∽ ∆SQK.","nhin":"Xếp bài này vào chuỗi “đổi cạnh nhờ trung điểm”: bài nào đứng trước, bài nào đứng sau?","nhinDap":"Chuỗi “đổi cạnh nhờ trung điểm”: 2.2 → 2.3 → 5.1 → 3.9 → 3.10 → 5.10. Bài đứng trước là 5.1, bài đứng sau là 3.10.","deep":{"huong":[{"ten":"Tính góc giữa CT và QK trực tiếp","kq":"tac","y":["T là trung điểm AD, không có đường tròn hay đường song song nào qua T; góc tại T không tính được trực tiếp."]},{"ten":"Nhân đôi – chia đôi","kq":"duoc","y":["∆ADC ∽ ∆QSO ⇒ DA/DC = SQ/SO.","Chia đôi DA (thành DT), nhân đôi SO (thành SK): DT/DC = SQ/SK ⇒ ∆DTC ∽ ∆SQK ⇒ ∠DTC = ∠SQK = ∠AQK ⇒ CT ⊥ QK."]}],"binh":["Hai trung điểm T (của AD) và O (của SK) nằm ở hai tam giác khác nhau là dấu hiệu rõ của dạng nhân đôi – chia đôi. Không có bài toán phụ 6, khó nghĩ ra cặp ∆DTC, ∆SQK."]},"loai":"sector","gt":["∆ABC nhọn (AB < AC) nội tiếp (O)","OM ⊥ BC tại M, cắt (O) tại S (cung lớn), K (cung nhỏ); D = AK ∩ BC","OQ là phân giác ∠AOC, Q ∈ AS; T là trung điểm AD"],"inputs":[{"code":"S1","text":"ý b: ∠AQO = ∠KAC","keep":1,"why":""},{"code":"G7, G1","text":"∠ADC = ∠ABK","keep":1,"why":""},{"code":"N3","text":"∠ABK = ∠QSO","keep":1,"why":""},{"code":"S1","text":"∆ADC ∽ ∆QSO","keep":1,"why":""},{"code":"B6","text":"chia đôi DA, nhân đôi SO: ∆DTC ∽ ∆SQK","keep":1,"why":""},{"code":"G2","text":"∆AQK vuông tại A","keep":1,"why":""},{"code":"S2","text":"ý b: KB² = KD.KA","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠SQO = ∠AQO = ∠KAC = ∠DAC","ld":"Ý b: ∆AOQ ∽ ∆DBA; AK là phân giác ∠BAC","codes":[]},{"cm":"∠ADC = ∠ABD + ∠BAD = ∠ABC + ∠CBK = ∠ABK","ld":"Góc ngoài của ∆ABD; ∠BAK = ∠CBK (chắn hai cung bằng nhau)","codes":["G7","G1"]},{"cm":"∠ABK = 180° − ∠ACK = 180° − ∠ASK = ∠QSO","ld":"ABKC nội tiếp; ∠ACK = ∠ASK; S nằm giữa A và Q","codes":["N3","G1"]},{"cm":"∆ADC ∽ ∆QSO ⇒ DA/SQ = DC/SO","ld":"Từ 1, 2, 3 (g.g)","codes":["S1"]},{"cm":"DT/DC = DA/(2DC) = SQ/(2SO) = SQ/SK","ld":"T là trung điểm AD, O là trung điểm SK","codes":[]},{"cm":"∆DTC ∽ ∆SQK ⇒ ∠DTC = ∠SQK = ∠AQK","ld":"∠TDC = ∠QSK; từ 5 (c.g.c)","codes":["S1","B6"]},{"cm":"Gọi X = CT ∩ QK: ∠XTK + ∠TKX = ∠AQK + ∠AKQ = 90° ⇒ CT ⊥ QK","ld":"∆AQK vuông tại A (∠SAK chắn nửa đường tròn)","codes":["G2","G7","K3"]}]},{"boost":[],"id":"4.1","ch":4,"truong":"Ngô Gia Tự","ky":"cuối HKI","de":["Cho đường tròn (O; R). Từ điểm A nằm ngoài đường tròn kẻ các tiếp tuyến AB, AC với đường tròn (B, C là các tiếp điểm). Gọi H là giao điểm của OA và BC.","a) Chứng minh các điểm A, B, C, O cùng thuộc một đường tròn.","b) Chứng minh OA ⊥ BC và OH.OA = R².","c) Gọi I là giao điểm của đoạn thẳng OA với đường tròn (O; R). Chứng minh OA.IH = OB.IA."],"yl":"c","yc":"Gọi I là giao điểm của đoạn thẳng OA với đường tròn (O; R). Chứng minh OA.IH = OB.IA.","kl":"OA.IH = OB.IA","hinh":"img/b4.1.png","huong":"IH/IA = OB/OA.","giu":"OA ⊥ BC tại H; OH.OA = R².","noi":"∆OBI cân tại O cho BI là tia phân giác của ∠ABH.","nhin":"Gọi I' là giao điểm thứ hai của đường thẳng OA với (O). Hệ thức tương tự với I' là gì?","nhinDap":"Với I' là giao điểm còn lại: BI' ⊥ BI nên BI' là phân giác ngoài của ∆ABH, vẫn có I'H/I'A = BH/BA = OB/OA, tức OA.I'H = OB.I'A.","deep":{"huong":[{"ten":"Tính toán bằng OH.OA = R²","kq":"duoc","y":["OH = R²/OA ⇒ IH = R − R²/OA = R(OA − R)/OA; IA = OA − R.","IH/IA = R/OA = OB/OA."]},{"ten":"Tia phân giác","kq":"duoc","y":["∆OBI cân ⇒ ∠ABI = 90° − ∠OBI = 90° − ∠OIB = ∠IBH ⇒ BI là phân giác của ∠ABH ⇒ IH/IA = BH/BA.","∆AHB ∽ ∆ABO ⇒ BH/BA = OB/OA."]}],"binh":["Ở bài này hướng tính toán (dùng ngay OH.OA = R²) ngắn hơn. Không phải lúc nào cũng cần một công cụ “đẹp”; điều quan trọng là đi ngược để biết cần gì (IH, IA theo R và OA) rồi chọn kết quả ý b đúng chỗ."]},"loai":"sector","gt":["(O; R), A nằm ngoài; AB, AC là tiếp tuyến","H = OA ∩ BC","I là giao điểm của đoạn OA với (O)"],"inputs":[{"code":"G6","text":"∠OBI = ∠OIB","keep":1,"why":""},{"code":"G4","text":"BI là phân giác ∠ABH","keep":1,"why":""},{"code":"P5","text":"IH/IA = BH/BA","keep":1,"why":""},{"code":"S3","text":"BH/BA = OB/OA","keep":1,"why":""},{"code":"V1","text":"ý b: OH.OA = R² ⇒ I nằm giữa H và A","keep":1,"why":""}],"steps":[{"cm":"OH = R²/OA < R = OI ⇒ I nằm giữa H và A","ld":"Ý b: OH.OA = R²","codes":["V1"]},{"cm":"∠OBI = ∠OIB","ld":"∆OBI cân tại O","codes":["G6"]},{"cm":"∠ABI = 90° − ∠OBI = 90° − ∠OIB = ∠IBH","ld":"∠ABO = 90°; ∆BHI vuông tại H","codes":["T1","G7","G4"]},{"cm":"IH/IA = BH/BA","ld":"BI là phân giác của ∠ABH","codes":["P5"]},{"cm":"∆AHB ∽ ∆ABO ⇒ BH/BA = OB/OA","ld":"∠AHB = ∠ABO = 90°, ∠BAO chung","codes":["S3"]},{"cm":"IH/IA = OB/OA ⇒ OA.IH = OB.IA","ld":"Từ 4 và 5","codes":["K6"]}]},{"boost":[],"id":"4.2","ch":4,"truong":"Phúc Đồng","ky":"cuối HKI","de":["Cho đường tròn (O; R) và điểm A nằm ngoài đường tròn (O). Từ A vẽ hai tiếp tuyến AB và AC của đường tròn (O) (B, C là hai tiếp điểm). Gọi H là giao điểm của OA và BC. Từ B vẽ đường kính BD của (O), đường thẳng AD cắt (O) tại E (E khác D).","a) Chứng minh bốn điểm A, B, C, O cùng thuộc một đường tròn. Xác định tâm và bán kính của đường tròn đó.","b) Chứng minh rằng OA ⊥ BC tại H và OA // CD.","c) Khi OA = ểm của OA và BC.","a) Chứng minh bốn điểm A, B, C, O cùng thuộc một đường tròn.","b) Chứng minh OA là trung trực của BC và OH.OA = R².","c) Lấy điểm D trên (O) sao cho BD = BC. Trên tia BA, lấy điểm E sao cho BE = DC. Chứng minh OA, BC và DE đồng quy."],"yl":"c","yc":"Lấy điểm D trên (O) sao cho BD = BC. Trên tia BA, lấy điểm E sao cho BE = DC. Chứng minh OA, BC và DE đồng quy.","kl":"OA, BC, DE đồng quy","hinh":"img/b4.3.png","huong":"DE đi qua H (H = OA ∩ BC).","giu":"OA là đường trung trực của BC; H là trung điểm BC.","noi":"DE cần đi qua H. BECD là hình bình hành (BE // DC, BE = DC) nên DE đi qua trung điểm H của BC.","nhin":"Tứ giác BECD là hình gì? Em đã dùng tính chất đường chéo nào?","nhinDap":"BECD là hình bình hành; dùng tính chất hai đường chéo cắt nhau tại trung điểm mỗi đường.","deep":{"huong":[{"ten":"Chứng minh D, H, E thẳng hàng bằng góc","kq":"tac","y":["Cần ∠DHB + ∠BHE = 180°; E chỉ được cho bằng độ dài BE = DC, không có góc nào tại E."]},{"ten":"Hình bình hành","kq":"duoc","y":["∆OBD = ∆OBC ⇒ BO là phân giác của ∠DBC ⇒ BO ⊥ DC ⇒ AB // DC.","BE // DC, BE = DC ⇒ BECD là hình bình hành ⇒ DE đi qua trung điểm H của BC."]}],"binh":["Đồng quy được đổi thành “đi qua một điểm đã biết” (điểm trùng), rồi lại đổi thành “trung điểm” (đường chéo hình bình hành). Hai lần đổi kết luận đưa bài khó về bài quen (Chương 0, §6)."]},"loai":"sector","gt":["(O), A nằm ngoài; AB, AC là tiếp tuyến; H = OA ∩ BC","D ∈ (O), BD = BC","E ∈ tia BA, BE = DC"],"inputs":[{"code":"S4","text":"∆OBD = ∆OBC","keep":1,"why":""},{"code":"G6","text":"BO ⊥ DC","keep":1,"why":""},{"code":"T1, P3","text":"AB // DC","keep":1,"why":""},{"code":"P4","text":"BECD là hình bình hành","keep":1,"why":""},{"code":"T2","text":"ý b: H là trung điểm BC","keep":1,"why":""},{"code":"K5","text":"DE đi qua H","keep":1,"why":""}],"steps":[{"cm":"∆OBD = ∆OBC ⇒ ∠OBD = ∠OBC","ld":"OD = OC, BD = BC, OB chung (c.c.c)","codes":["S4"]},{"cm":"BO ⊥ DC","ld":"∆BDC cân tại B, BO là phân giác","codes":["G6"]},{"cm":"AB // DC","ld":"AB ⊥ BO (tiếp tuyến)","codes":["T1","P3"]},{"cm":"BECD là hình bình hành","ld":"BE // DC, BE = DC","codes":["P4"]},{"cm":"DE đi qua trung điểm H của BC","ld":"Hai đường chéo cắt nhau tại trung điểm mỗi đường; ý b","codes":["P4","T2"]},{"cm":"OA, BC, DE cùng đi qua H","ld":"","codes":["K5"]}]},{"boost":["B7"],"id":"4.6","ch":4,"truong":"Đức Giang","ky":"cuối HKI","de":["Cho đường tròn tâm O, đường kính AB = 2R. Trên tia đối của tia AB lấy điểm H (H khác A), kẻ đường thẳng d vuông góc với AB tại H; trên d lấy điểm E sao cho HE > R; vẽ tiếp tuyến EM, EN với (O) tại M, N (N, H ở cùng một nửa mặt phẳng bờ là đường thẳng OA), dây MN cắt OH, OE thứ tự ở K, I.","a) Chứng minh năm điểm E, H, N, M, O cùng nằm trên một đường tròn.","b) Chứng minh OE ⊥ MN và OI.OE = OK.OH.","c) Chứng minh MN² = 4.OI.IE và tìm vị trí của điểm E trên đường thẳng d để diện tích của tam giác OIK đạt giá trị lớn nhất."],"yl":"c","yc":"Chứng minh MN² = 4.OI.IE và tìm vị trí của điểm E trên đường thẳng d để diện tích của tam giác OIK đạt giá trị lớn nhất.","kl":"MN² = 4.OI.IE; S(OIK) lớn nhất","hinh":"img/b4.6.png","huong":"S(OIK) = OI.IK/2 ≤ OK²/4.","giu":"OE ⊥ MN; OI.OE = OK.OH.","noi":"K cố định vì OK.OH = R² không đổi.","nhin":"Đo trên hình: khi E chạy, điểm nào đứng yên? Điều đó gợi ý gì cho bài cực trị?","nhinDap":"K đứng yên (OK = R²/OH). Gợi ý: ∆OIK vuông tại I có cạnh huyền OK cố định nên I chạy trên đường tròn đường kính OK.","deep":{"huong":[{"ten":"Bất đẳng thức đại số","kq":"duoc","y":["S = OI.IK/2 ≤ (OI² + IK²)/4 = OK²/4; dấu “=” khi OI = IK."]},{"ten":"Hình học: I nằm trên đường tròn đường kính OK","kq":"duoc","y":["∠OIK = 90° ⇒ I thuộc đường tròn đường kính OK. Khoảng cách từ I đến OK không vượt quá bán kính OK/2 ⇒ S ≤ OK.(OK/2)/2 = OK²/4.","Dấu “=” khi I là điểm chính giữa cung, tức ∆OIK vuông cân ⇒ HE = OH."]}],"binh":["Bài cực trị cần trả lời trước câu hỏi “cái gì cố định?”. Kết quả ý b chính là câu trả lời: OK.OH = R² cho K cố định. Ý bổ sung (bài toán phụ 7: ∆OIH ∽ H), kẻ tiếp tuyến MA, MB với (O) (A, B là tiếp điểm). Gọi I, K lần lượt là giao điểm của AB với OM, OH.","a) Chứng minh: 4 điểm M, H, O, A cùng thuộc một đường tròn.","b) Chứng minh: ∆OIA ∽ ∆OAM và OH.OK = R².","c) Vẽ đường thẳng đi qua điểm O, vuông góc với OM, cắt MA, MB lần lượt tại P, Q. Tìm vị trí điểm M để diện tích tam giác MPQ nhỏ nhất."],"yl":"c","yc":"Vẽ đường thẳng đi qua điểm O, vuông góc với OM, cắt MA, MB lần lượt tại P, Q. Tìm vị trí điểm M để diện tích tam giác MPQ nhỏ nhất.","kl":"Vị trí M để S(MPQ) nhỏ nhất","hinh":"img/b4.8.png","huong":"Tìm giá trị nhỏ nhất của MA + AP khi MA.AP = R² không đổi.","giu":"OI.OM = R² (∆OIA ∽ ∆OAM); OH.OK = R².","noi":"S(MPQ) = 2S(MOP) = OA.MP = R.MP = R(MA + AP), và MA.AP = OA² = R².","nhin":"So sánh với Đức Giang (Bài 4.6): yếu tố cố định trong hai bài là gì?","nhinDap":"Đức Giang: điểm K cố định (OK.OH = R²). Mai Dịch: tích MA.AP = R² không đổi. Cả hai dùng một đại lượng không đổi rồi đánh giá bằng bất đẳng thức.","deep":{"huong":[{"ten":"Tính S theo OM","kq":"dai","y":["S = OM.OP; OP liên hệ với OM qua tam giác vuông MOP ⇒ S biểu diễn bằng một phân thức chứa căn của OM, khó tìm giá trị nhỏ nhất ở lớp 9."]},{"ten":"Tổng có tích không đổi","kq":"duoc","y":["MP = MA + AP ≥ 2√(MA.AP) = 2R ⇒ S ≥ 2R²; dấu “=” khi MA = AP = R ⇔ OM = R√2."]}],"binh":["Câu hỏi then chốt của bài cực trị: “tổng nào có tích không đổi?” – hệ thức lượng trong tam giác vuông (MA.AP = OA²) trả lời câu hỏi đó."]},"loai":"sector","gt":["(O; R), H cố định ngoài (O); d ⊥ OH tại H; M ∈ d","MA, MB là tiếp tuyến; I = AB ∩ OM, K = AB ∩ OH","PQ ⊥ OM tại O; P ∈ MA, Q ∈ MB"],"inputs":[{"code":"T2, G6","text":"O là trung điểm PQ","keep":1,"why":""},{"code":"T1","text":"S(MPQ) = R.MP","keep":1,"why":""},{"code":"V1","text":"MA.AP = R²","keep":1,"why":""},{"code":"K6","text":"MP ≥ 2R (Cô-si)","keep":1,"why":""},{"code":"S2","text":"ý b: OH.OK = R²","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∆MPQ cân tại M, O là trung điểm PQ","ld":"MO là phân giác ∠AMB và MO ⊥ PQ","codes":["T2","G6"]},{"cm":"S(MPQ) = 2S(MOP) = OA.MP = R.MP","ld":"OA ⊥ MP","codes":["T1"]},{"cm":"MA.AP = OA² = R²","ld":"∆MOP vuông tại O, đường cao OA","codes":["V1"]},{"cm":"MP = MA + AP ≥ 2√(MA.AP) = 2R ⇒ S(MPQ) ≥ 2R²","ld":"Bất đẳng thức Cô-si; từ 2 và 3","codes":[]},{"cm":"Dấu “=” ⇔ MA = AP = R ⇔ OM = R√2","ld":"∆MOP vuông cân tại O","codes":[]},{"cm":"S nhỏ nhất bằng 2R² khi HM = √(2R² − OH²)","ld":"M là giao điểm của d với (O; R√2) (cần OH < R√2)","codes":[]}]},{"boost":["B6"],"id":"5.1","ch":5,"truong":"Trưng Vương","ky":"cuối HKI","de":["Cho đường tròn (O; R) đường kính AB. Từ A kẻ tiếp tuyến Ax với đường tròn (O). Trên tia Ax lấy điểm M sao cho MA > R. Từ M kẻ tiếp tuyến MC với đường tròn (O) (C là tiếp điểm).","1) Chứng minh bốn điểm A, O, C, M cùng thuộc một đường tròn.","2) Gọi E là giao điểm của MB với đường tròn tâm O. Chứng minh OM song song với BC và ∠BMO = ∠CAE.","3) Từ B kẻ tiếp tuyến By với đường tròn (O). Đường thẳng qua O và song song với AC, cắt By tại D. Gọi I là trung điểm của OB. Chứng minh MB vuông góc với ID."],"yl":"3","yc":"Từ B kẻ tiếp tuyến By với đường tròn (O). Đường thẳng qua O và song song với AC, cắt By tại D. Gọi I là trung điểm của OB. Chứng minh MB vuông góc với ID.","kl":"MB ⊥ ID","hinh":"img/b5.1.png","huong":"∠BID + ∠ABM = 90°.","giu":"OM // BC; ý c dùng OM ⊥ AC.","noi":"∠BOD = ∠AMO (cùng phụ ∠AOM) nên ∆OBD ∽ ∆MAO; thay OB = 2IB, AO = AB/2 được ∆IBD ∽ ∆MAB.","nhin":"Nếu I là điểm chia OB theo tỉ số khác thì MB còn vuông góc với ID không? Vì sao?","nhinDap":"Không còn đúng nói chung: cặp ∆IBD ∽ ∆MAB cần IB = OB/2. Thử trên phần mềm với I khác trung điểm sẽ thấy MB không vuông góc với ID.","deep":{"huong":[{"ten":"Tỉ số lượng giác","kq":"duoc","y":["∠BOD = ∠AMO ⇒ BD = OB.tan∠BOD = R.AO/MA = R²/MA.","tan∠BID = BD/IB = (R²/MA)/(R/2) = 2R/MA = AB/MA = tan∠AMB ⇒ ∠BID = ∠AMB."]},{"ten":"Nhân đôi – chia đôi","kq":"duoc","y":["∆OBD ∽ ∆MAO ⇒ BD/AO = OB/MA; thay OB = 2IB, AO = AB/2 ⇒ IB/MA = BD/AB ⇒ ∆IBD ∽ ∆MAB ⇒ ∠BID = ∠AMB."]}],"binh":["Hai hướng là một ý tưởng viết bằng hai ngôn ngữ (tỉ số lượng giác và tam giác đồng dạng). Dấu hiệu nhận ra: trung điểm I của OB và trung điểm O của AB – một cạnh bị chia đôi, cạnh tương ứng bị nhân đôi."]},"loai":"sector","gt":["(O; R) đường kính AB; Ax là tiếp tuyến; M ∈ Ax, MA > R; MC là tiếp tuyến","By là tiếp tuyến; OD // AC, D ∈ By","I là trung điểm OB"],"inputs":[{"code":"T2","text":"OD ⊥ OM","keep":1,"why":""},{"code":"G4","text":"∠BOD = ∠AMO","keep":1,"why":""},{"code":"S3","text":"∆OBD ∽ ∆MAO","keep":1,"why":""},{"code":"B6","text":"nhân đôi – chia đôi: ∆IBD ∽ ∆MAB","keep":1,"why":""},{"code":"G7","text":"∠BID + ∠ABM = 90°","keep":1,"why":""},{"code":"S1","text":"ý b","keep":0,"why":"Không phục vụ điều đang cần ở ý 3."}],"steps":[{"cm":"OD ⊥ OM ⇒ ∠AOM + ∠BOD = 90°","ld":"OM ⊥ AC (OM là trung trực của AC); OD // AC","codes":["T2"]},{"cm":"∠BOD = ∠AMO","ld":"Cùng phụ ∠AOM","codes":["G4"]},{"cm":"∆OBD ∽ ∆MAO ⇒ BD/AO = OB/MA","ld":"∠OBD = ∠MAO = 90°; từ 2 (g.g)","codes":["S3"]},{"cm":"IB/MA = BD/AB","ld":"OB = 2IB, AO = AB/2","codes":["B6"]},{"cm":"∆IBD ∽ ∆MAB ⇒ ∠BID = ∠AMB","ld":"∠IBD = ∠MAB = 90°; từ 4 (c.g.c)","codes":["S1"]},{"cm":"Gọi J = MB ∩ ID: ∠JIB + ∠JBI = ∠AMB + ∠ABM = 90° ⇒ MB ⊥ ID","ld":"","codes":["G7","K3"]}]},{"boost":[],"id":"5.2","ch":5,"truong":"Ái Mộ – Hát Môn","ky":"cuối HKI","de":["Cho đường tròn (O; R), đường kính AB. Lấy điểm C thuộc (O; R) sao cho AC > BC. Kẻ đường cao CH của ∆ABC (H ∈ AB), kéo dài CH cắt (O; R) tại điểm D (D ≠ C). Tiếp tuyến tại điểm A và tiếp tuyến tại điểm C của đường tròn (O; R) cắt nhau tại điểm M. Gọi I là giao điểm của OM và AC. Hai đường thẳng MC và AB cắt nhau tại F.","a) Chứng minh 4 điểm A, C, M, O cùng thuộc một đường tròn.","b) Chứng minh DF là tiếp tuyến của (O; R).","c) Chứng minh BC = 2.IO và AF.BH = BF.AH."],"yl":"c","yc":"Chứng minh BC = 2.IO và AF.BH = BF.AH.","kl":"AF.BH = BF.AH","hinh":"img/b5.2.png","huong":"FB/FA = HB/HA.","giu":"DF là tiếp tuyến; BC = 2.IO.","noi":"Cần AF/BF = AH/BH. ∆FCB ∽ ∆FAC cho FB/FA = (CB/CA)²; hệ thức lượng cho BH/AH = (BC/AC)².","nhin":"FB/FA và HB/HA cùng bằng biểu thức nào? Còn tỉ số nào khác bằng chúng?","nhinDap":"Cả hai bằng (CB/CA)². Tỉ số này cũng bằng FC²/FA² (vì FB.FA = FC²).","deep":{"huong":[{"ten":"Phân giác trong và phân giác ngoài","kq":"duoc","y":["∠FCB = ∠CAB = ∠BCH ⇒ CB là phân giác của ∠FCH ⇒ BF/BH = CF/CH.","CA ⊥ CB nên CA là phân giác ngoài tại C của ∆FCH ⇒ AF/AH = CF/CH ⇒ AF/AH = BF/BH."]},{"ten":"Bình phương tỉ số","kq":"duoc","y":["∆FCB ∽ ∆FAC ⇒ FB/FA = (CB/AC)²; hệ thức lượng: BH/AH = (BC/AC)² ⇒ FB/FA = BH/AH."]}],"binh":["Hướng 2 dùng mẹo “tỉ số trung gian là bình phương”: khi hai tỉ số không có đoạn chung, hãy xem chúng có cùng bằng (BC/AC)² không (Chương 0, §2)."]},"loai":"sector","gt":["(O; R) đường kính AB; C ∈ (O), AC > BC; CH ⊥ AB, CH cắt (O) tại D","Tiếp tuyến tại A, C cắt nhau tại M; I = OM ∩ AC","F = MC ∩ AB"],"inputs":[{"code":"T2, P2","text":"BC = 2.IO","keep":1,"why":""},{"code":"G3","text":"∠FCB = ∠FAC","keep":1,"why":""},{"code":"S1","text":"FB/FA = (CB/CA)²","keep":1,"why":""},{"code":"V1","text":"BH/AH = (BC/AC)²","keep":1,"why":""},{"code":"T1","text":"ý b: DF là tiếp tuyến","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"I là trung điểm AC ⇒ OI là đường trung bình ⇒ BC = 2.IO","ld":"MA = MC, OA = OC: OM là trung trực của AC","codes":["T2","P2"]},{"cm":"∠FCB = 90° − ∠OCB = 90° − ∠ABC = ∠CAB","ld":"∠OCF = 90°; ∆OBC cân; ∠ACB = 90°","codes":["T1","G6"]},{"cm":"∆FCB ∽ ∆FAC ⇒ FB/FC = FC/FA = CB/AC","ld":"∠F chung; từ 2 (g.g)","codes":["S1"]},{"cm":"FB/FA = (FB/FC).(FC/FA) = (CB/AC)²","ld":"Từ 3","codes":[]},{"cm":"BH/AH = (BC/AC)²","ld":"BC² = BH.AB, AC² = AH.AB","codes":["V1"]},{"cm":"FB/FA = BH/AH ⇒ AF.BH = BF.AH","ld":"Từ 4 và 5","codes":["K6"]}]},{"boost":["B6"],"id":"5.3","ch":5,"truong":"Lý Sơn","ky":"cuối HKI","de":["Cho đường tròn (O), đường kính AB. Kẻ tiếp tuyến Ax với đường tròn (O). Lấy điểm C thuộc đường tròn (O) (AC < CB). Kẻ tiếp tuyến tại C của đường tròn (O) cắt Ax tại điểm M.","a) Chứng minh bốn điểm M, A, C, O cùng thuộc một đường tròn.","b) Qua điểm O kẻ đường thẳng vuông góc với BC tại H, cắt đường thẳng MC tại K. Đường thẳng AH cắt đường tròn (O) tại N (N khác A), đường thẳng BN cắt OK tại điểm I. Chứng minh KB là tiếp tuyến của đường tròn (O) và ∠IBK = ∠HAB.","c) Chứng minh BC.KI = BH.KH."],"yl":"c","yc":"Chứng minh BC.KI = BH.KH.","kl":"BC.KI = BH.KH","hinh":"img/b5.3.png","huong":"I là trung điểm của KH.","giu":"KB là tiếp tuyến; ∠IBK = ∠HAB.","noi":"BC = 2BH nên hệ thức là KI = KH/2: I là trung điểm KH. ∆KHB ∽ ∆BCA có KH ứng với BC.","nhin":"Cặp tam giác nào cho KI, cặp nào cho KH? Chúng có chung tỉ số nào?","nhinDap":"∆KBI ∽ ∆BAH cho KI/BH = KB/BA; ∆KHB ∽ ∆BCA cho KH/BC = KB/BA. Chung tỉ số KB/BA.","deep":{"huong":[{"ten":"Tỉ số trung gian","kq":"duoc","y":["∆KBI ∽ ∆BAH ⇒ KI/BH = KB/BA; ∆KHB ∽ ∆BCA ⇒ KH/BC = KB/BA ⇒ KI/BH = KH/BC."]},{"ten":"Bài toán phụ 6, đảo dạng 2","kq":"duoc","y":["∆KHB ∽ ∆BCA (KH ↔ BC). H là trung điểm BC; gọi I' là trung điểm KH ⇒ ∆KBI' ∽ ∆BAH ⇒ ∠KBI' = ∠BAH = ∠KBI ⇒ I' trùng I."]}],"binh":["Nhận ra BC = 2BH biến một đẳng thức tích thành một kết luận trung điểm – rõ ràng hơn và gợi ra bài toán phụ 6."]},"loai":"sector","gt":["(O) đường kính AB; Ax là tiếp tuyến; C ∈ (O), AC < CB; tiếp tuyến tại C cắt Ax tại M","OH ⊥ BC tại H, OH cắt MC tại K","AH cắt (O) tại N; BN cắt OK tại I"],"inputs":[{"code":"G4","text":"∠BKH = ∠ABC","keep":1,"why":""},{"code":"S1","text":"ý b: ∆KBI ∽ ∆BAH","keep":1,"why":""},{"code":"S3","text":"∆KHB ∽ ∆BCA","keep":1,"why":""},{"code":"K6","text":"KI/BH = KH/BC","keep":1,"why":""},{"code":"B6","text":"nhận xét: I là trung điểm KH","keep":1,"why":""}],"steps":[{"cm":"∠BKH = 90° − ∠BOK = ∠OBH = ∠ABC","ld":"∆OBK vuông tại B, BH ⊥ OK","codes":["G4"]},{"cm":"∆KBI ∽ ∆BAH ⇒ KI/BH = KB/BA","ld":"∠KBI = ∠BAH (ý b); ∠BKI = ∠ABH (dòng 1) (g.g)","codes":["S1"]},{"cm":"∆KHB ∽ ∆BCA ⇒ KH/BC = KB/BA","ld":"∠KHB = ∠BCA = 90°; ∠HKB = ∠CBA (g.g)","codes":["S3"]},{"cm":"KI/BH = KH/BC ⇒ BC.KI = BH.KH","ld":"Từ 2 và 3","codes":["K6"]},{"cm":"Nhận xét: BC = 2BH nên KI = KH/2, I là trung điểm KH","ld":"OH ⊥ BC ⇒ H là trung điểm BC","codes":["N4","B6"]}]},{"boost":["B1","B4"],"id":"5.4","ch":5,"truong":"Cầu Diễn","ky":"cuối HKI","de":["Cho đường tròn (O; R), đường kính AB. Trên đường tròn (O) lấy điểm M (MA < MB). Tiếp tuyến tại M cắt tiếp tuyến tại A và B lần lượt là C và D.","a) Chứng minh: CD = AC + BD.","b) Vẽ đường thẳng BM cắt tia AC tại E và vẽ MH ⊥ AB. Chứng minh: OC // MB và ME.MB = AH.AB.","c) Chứng minh: HM là tia phân giác của ∠CHD."],"yl":"c","yc":"Chứng minh: HM là tia phân giác của ∠CHD.","kl":"HM là tia phân giác ∠CHD","hinh":"img/b5.4.png","huong":"∠CHA = ∠DHB (∆CAH ∽ ∆DBH).","giu":"OC // MB; ME.MB = AH.AB; CD = AC + BD.","noi":"AH/HB = CM/MD = CA/DB (ba đường song song chắn hai cát tuyến, CM = CA, DM = DB).","nhin":"Giải lại ý c bằng bài toán phụ 4. Cách nào ngắn hơn?","nhinDap":"Bài toán phụ 4 cho BC, AD, MH đồng quy tại trung điểm I của MH; từ đó vẫn phải chứng minh thêm. Cách dùng tỉ số (∆CAH ∽ ∆DBH) ngắn hơn.","deep":{"huong":[{"ten":"Tính góc trực tiếp","kq":"dai","y":["∠CHM = ∠ACH (so le, AC // MH); cần ∠ACH = ∠BDH – lại quy về so sánh hai tam giác CAH và DBH."]},{"ten":"Ba đường song song (bổ đề hình thang)","kq":"duoc","y":["G = AD ∩ MH: AH/AB = AG/AD = CM/CD ⇒ AH/HB = CM/MD = CA/DB.","∆CAH ∽ ∆DBH (c.g.c) ⇒ ∠CHA = ∠DHB ⇒ ∠CHM = ∠DHM."]}],"binh":["Hình thang ACDB với MH song song hai đáy: tỉ số trên hai cạnh bên bằng nhau – đúng tinh thần của bổ đề hình thang (bài toán phụ 1). Bài toán phụ 4 cũng có trong hình: AD đi qua trung điểm G của MH."]},"loai":"sector","gt":["(O; R) đường kính AB; M ∈ (O), MA < MB","Tiếp tuyến tại M cắt tiếp tuyến tại A, B ở C, D","MH ⊥ AB"],"inputs":[{"code":"T3, P3","text":"AC // MH // BD","keep":1,"why":""},{"code":"P1","text":"AH/HB = CM/MD","keep":1,"why":""},{"code":"T2","text":"CA/DB = AH/BH","keep":1,"why":""},{"code":"S1","text":"∆CAH ∽ ∆DBH","keep":1,"why":""},{"code":"G4","text":"∠CHM = ∠DHM","keep":1,"why":""},{"code":"B4","text":"BC, AD qua trung điểm MH","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"AC // MH // BD","ld":"Cùng vuông góc với AB","codes":["T3","P3"]},{"cm":"Gọi G = AD ∩ MH: AH/AB = AG/AD = CM/CD ⇒ AH/HB = CM/MD","ld":"Hệ quả định lí Thales trong ∆ABD, ∆DAC","codes":["P1"]},{"cm":"AH/HB = CA/DB","ld":"CM = CA, MD = DB","codes":["T2"]},{"cm":"∆CAH ∽ ∆DBH ⇒ ∠CHA = ∠DHB","ld":"∠CAH = ∠DBH = 90°; từ 3 (c.g.c)","codes":["S1"]},{"cm":"∠CHM = 90° − ∠CHA = 90° − ∠DHB = ∠DHM","ld":"Phụ với hai góc bằng nhau","codes":["G4"]}]},{"boost":["B4","B2","B6"],"id":"5.6","ch":5,"truong":"Nguyễn Bỉnh Khiêm","ky":"cuối HKI","de":["Cho nửa đường tròn (O; R) đường kính BC. Trên nửa đường tròn (O) vẽ tiếp tuyến Bx của đường tròn (O), A là điểm bất kì thuộc nửa đường tròn sao cho AB < AC (A khác B, A khác C). Tiếp tuyến tại A của nửa đường tròn (O) cắt tia Bx tại D.","a) Chứng minh 4 điểm A, D, B, O cùng thuộc một đường tròn.","b) Tia CA cắt Bx tại E. Chứng minh rằng OD ⊥ AB và CA.CE = 4R².","c) Gọi H là hình chiếu của A trên BC và I là trung điểm của AC, OD cắt AB tại điểm K. Chứng minh ba đường thẳng AH, KI, CD đồng quy."],"yl":"c","yc":"Gọi H là hình chiếu của A trên BC và I là trung điểm của AC, OD cắt AB tại điểm K. Chứng minh ba đường thẳng AH, KI, CD đồng quy.","kl":"AH, KI, CD đồng quy","hinh":"img/b5.6.png","huong":"AH, KI, CD cùng đi qua trung điểm J của AH.","giu":"OD ⊥ AB tại K (K là trung điểm AB); CA.CE = 4R².","noi":"D là trung điểm của BE (giống bài toán phụ 4); AH // BE (cùng ⊥ BC).","nhin":"Nếu chưa biết bài toán phụ, em phải vẽ thêm điểm nào để giải?","nhinDap":"Phải gọi E = CA ∩ Bx rồi tự chứng minh D là trung điểm BE (DA = DB = DE), sau đó dùng Thales trong ∆CBE.","deep":{"huong":[{"ten":"Gọi J là giao điểm của AH và CD, chứng minh KI đi qua J bằng góc","kq":"tac","y":["Không có góc nào tại J tính được."]},{"ten":"Trung điểm chung","kq":"duoc","y":["DA = DB ⇒ DE = DA ⇒ D là trung điểm BE; AH // BE ⇒ CD đi qua trung điểm J của AH.","KI là đường trung bình của ∆ABC ⇒ KI // BC ⇒ KI đi qua trung điểm của AH."]}],"binh":["Ba đường đồng quy được đổi thành “cùng đi qua một trung điểm”. Dự đoán điểm đồng quy (bằng hình vẽ chính xác hoặc GeoGebra) là bước quan trọng."]},"loai":"sector","gt":["Nửa (O; R) đường kính BC; Bx là tiếp tuyến; A thuộc nửa đường tròn (AB < AC)","Tiếp tuyến tại A cắt Bx tại D; E = CA ∩ Bx","AH ⊥ BC; I là trung điểm AC; K = OD ∩ AB"],"inputs":[{"code":"T2, G6","text":"DA = DB","keep":1,"why":""},{"code":"G2, G7","text":"DE = DA: D là trung điểm BE","keep":1,"why":""},{"code":"P3","text":"AH // BE","keep":1,"why":""},{"code":"B2","text":"CD chia đôi AH tại J","keep":1,"why":""},{"code":"P2","text":"KI // BC qua trung điểm AH","keep":1,"why":""},{"code":"V1","text":"ý b: CA.CE = 4R²","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"DA = DB ⇒ ∠DBA = ∠DAB","ld":"Hai tiếp tuyến cắt nhau","codes":["T2","G6"]},{"cm":"∠DEA = 90° − ∠DBA = 90° − ∠DAB = ∠DAE ⇒ DE = DA","ld":"∠BAE = 90° (∠BAC chắn nửa đường tròn)","codes":["G2","G7"]},{"cm":"DB = DE: D là trung điểm BE","ld":"Từ 1 và 2","codes":[]},{"cm":"AH // BE","ld":"AH ⊥ BC, BE ⊥ BC","codes":["P3"]},{"cm":"Gọi J = CD ∩ AH: HJ/BD = CJ/CD = JA/DE ⇒ HJ = JA","ld":"Thales trong ∆CBD, ∆CDE; từ 3","codes":["P1","B2"]},{"cm":"KI // BC và KI đi qua trung điểm J của AH","ld":"K, I là trung điểm AB, AC","codes":["P2"]},{"cm":"AH, KI, CD đồng quy tại J","ld":"","codes":["K5"]}]},{"boost":["B6"],"id":"5.7","ch":5,"truong":"Nam Từ Liêm","ky":"giữa HKII","de":["Cho đường tròn tâm (O) và một điểm A nằm ngoài đường tròn. Từ điểm A kẻ tiếp tuyến AB với đường tròn (O) (B là tiếp điểm) và kẻ đường kính BC. Trên đoạn thẳng CO lấy điểm I (I khác O, I khác C). Đường thẳng IA cắt (O) tại hai điểm D và E (D nằm giữa A và E). Gọi H là trung điểm của đoạn thẳng DE.","a) Chứng minh tứ giác ABOH nội tiếp.","b) Từ điểm E kẻ đường thẳng song song với AO và cắt BC tại điểm K. Chứng minh IB.IK = IH.IE.","c) Tia CD cắt AO tại điểm P, tia EO cắt BP tại điểm F. Chứng minh ∆EHB ∽ ∆COP và điểm F nằm trên đường tròn (O)."],"yl":"c","yc":"Tia CD cắt AO tại điểm P, tia EO cắt BP tại điểm F. Chứng minh ∆EHB ∽ ∆COP và điểm F nằm trên đường tròn (O).","kl":"∆EHB ∽ ∆COP; F nằm trên (O)","hinh":"img/b5.7.png","huong":"∠EBP = 90°, rồi suy ra OF = OB.","giu":"ABOH nội tiếp; IB.IK = IH.IE.","noi":"H là trung điểm ED (cạnh của ∆BED), O là trung điểm CB (cạnh của ∆PCB); ∆EHB ∽ ∆COP với hai trung tuyến BH, PO.","nhin":"F nằm trên (O) suy ra từ góc nào bằng 90°?","nhinDap":"Từ ∠EBF = 90° và OB = OE (O nằm trên EF) suy ra OF = OB = R.","deep":{"huong":[{"ten":"Chứng minh OF = R trực tiếp","kq":"tac","y":["F là giao của EO với BP; độ dài OF không tính được từ các dữ kiện."]},{"ten":"Bài toán phụ 6, chiều đảo dạng 1","kq":"duoc","y":["∆EHB ∽ ∆COP; BH, PO là hai trung tuyến tương ứng ⇒ ∆BED ∽ ∆PCB ⇒ ∠BDE = ∠PBC.","∠EBP = ∠EDC + ∠BDE = ∠BDC = 90° ⇒ OF = OB."]}],"binh":["Chiều đảo dạng 1 của bài toán phụ 6 ít gặp nhưng rất mạnh: từ cặp “nửa tam giác” (chứa trung tuyến) suy ra cặp tam giác lớn."]},"loai":"sector","gt":["(O), A ngoài; AB là tiếp tuyến; BC là đường kính; I ∈ CO","IA cắt (O) tại D, E (D nằm giữa A, E); H là trung điểm DE","EK // AO, K ∈ BC; tia CD cắt AO tại P; tia EO cắt BP tại F"],"inputs":[{"code":"G1","text":"∠HEB = ∠OCP","keep":1,"why":""},{"code":"N3","text":"∠EHB = ∠COP","keep":1,"why":""},{"code":"S1","text":"∆EHB ∽ ∆COP","keep":1,"why":""},{"code":"B6","text":"đảo dạng 1: ∠BDE = ∠PBC","keep":1,"why":""},{"code":"G2","text":"∠EBP = 90°","keep":1,"why":""},{"code":"G6","text":"OF = OB","keep":1,"why":""},{"code":"S2","text":"ý b","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠HEB = ∠DEB = ∠DCB = ∠PCO","ld":"Cùng chắn cung DB; P ∈ tia CD","codes":["G1"]},{"cm":"∠EHB = 180° − ∠AHB = 180° − ∠AOB = ∠COP","ld":"ABOH nội tiếp (ý a)","codes":["N3"]},{"cm":"∆EHB ∽ ∆COP","ld":"Từ 1 và 2 (g.g)","codes":["S1"]},{"cm":"∆BED ∽ ∆PCB ⇒ ∠BDE = ∠PBC","ld":"BH, PO là trung tuyến tương ứng (H, O là trung điểm ED, CB) – chiều đảo dạng 1","codes":["B6"]},{"cm":"∠EBP = ∠EBC + ∠CBP = ∠EDC + ∠BDE = ∠BDC = 90°","ld":"Cùng chắn cung EC; ∠BDC chắn nửa đường tròn","codes":["G1","G2"]},{"cm":"∠OBF = 90° − ∠OBE = 90° − ∠OEB = ∠OFB ⇒ OF = OB: F ∈ (O)","ld":"∆EBF vuông tại B; OB = OE","codes":["G6","G7"]}]},{"boost":[],"id":"5.8","ch":5,"truong":"Đức Giang","ky":"giữa HKII","de":["Cho (O) đường kính AB, gọi I là trung điểm của OA, dây CD vuông góc với AB tại I. Lấy K tùy ý trên cung BC nhỏ, AK cắt CD tại H.","a) Chứng minh tứ giác BIHK là tứ giác nội tiếp.","b) Chứng minh AH.AK = R².","c) Kẻ DN vuông góc với CB tại N, DM vuông góc với AC tại M. Chứng minh các đường thẳng MN, AB, CD đồng quy."],"yl":"c","yc":"Kẻ DN vuông góc với CB tại N, DM vuông góc với AC tại M. Chứng minh các đường thẳng MN, AB, CD đồng quy.","kl":"MN, AB, CD đồng quy","hinh":"img/b5.8.png","huong":"MN đi qua I.","giu":"AH.AK = R². Ý c chỉ cần CD ⊥ AB tại I.","noi":"I là trung điểm CD. MCND là hình chữ nhật (∠MCN = ∠CMD = ∠CND = 90°).","nhin":"I là tâm của hình nào? Điểm “nhiều vai” này giống bài nào ở Chương 4?","nhinDap":"I là tâm của hình chữ nhật MCND. Giống Bài 4.7 (Nghĩa Tân: hình bình hành IJMB) và Bài 4.3 (hình bình hành BECD).","deep":{"huong":[{"ten":"Gọi I' = MN ∩ CD, chứng minh I' nằm trên AB","kq":"dai","y":["Cần góc hoặc tỉ số tại I'; vòng vèo."]},{"ten":"Hình chữ nhật MCND","kq":"duoc","y":["∠MCN = ∠CMD = ∠CND = 90° ⇒ MCND là hình chữ nhật ⇒ MN đi qua trung điểm I của CD."]}],"binh":["“Đồng quy với hai đường đã cắt nhau” luôn được đổi thành “đi qua giao điểm đã biết”. Ở đây giao điểm đó lại là trung điểm – rất thuận lợi."]},"loai":"sector","gt":["(O) đường kính AB; I là trung điểm OA; dây CD ⊥ AB tại I","K ∈ cung BC nhỏ; H = AK ∩ CD","DN ⊥ CB, DM ⊥ AC"],"inputs":[{"code":"G2","text":"∠MCN = 90°","keep":1,"why":""},{"code":"V5","text":"MCND là hình chữ nhật","keep":1,"why":""},{"code":"N4","text":"I là trung điểm CD","keep":1,"why":""},{"code":"K5","text":"MN đi qua I","keep":1,"why":""},{"code":"S2","text":"ý b: AH.AK = R²","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠MCN = 90°","ld":"∠ACB chắn nửa đường tròn","codes":["G2"]},{"cm":"MCND là hình chữ nhật ⇒ MN, CD cắt nhau tại trung điểm mỗi đường","ld":"∠MCN = ∠CMD = ∠CND = 90°","codes":["V5"]},{"cm":"I là trung điểm CD","ld":"Đường kính AB vuông góc với dây CD tại I","codes":["N4"]},{"cm":"MN đi qua I ⇒ MN, AB, CD đồng quy tại I","ld":"Từ 2 và 3","codes":["K5"]}]},{"boost":[],"id":"5.9","ch":5,"truong":"Ngô Gia Tự – đề 1","ky":"cuối HKII","de":["Cho nửa đường tròn (O), đường kính AB. Lấy điểm D thuộc nửa đường tròn, điểm C thuộc cung AD; AC cắt BD tại E, AD cắt BC tại H.","a) Chứng minh tứ giác CHDE nội tiếp.","b) Chứng minh ∠DAB = ∠DEH.","c) Vẽ tiếp tuyến của (O) tại D, cắt EH tại I. Chứng minh I là trung điểm của EH."],"yl":"c","yc":"Vẽ tiếp tuyến của (O) tại D, cắt EH tại I. Chứng minh I là trung điểm của EH.","kl":"I là trung điểm EH","hinh":"img/b5.9.png","huong":"ID = IE và ID = IH.","giu":"∠DAB = ∠DEH (ý b); CHDE nội tiếp.","noi":"H là trực tâm của ∆ABE (AD, BC là hai đường cao). EH là đường kính của đường tròn qua C, D; I có thể là tâm đường tròn đó.","nhin":"Đường tròn nào có tâm I? Từ đó còn suy ra được tiếp tuyến nào khác?","nhinDap":"Đường tròn tâm I đường kính EH đi qua C, D. Tương tự, tiếp tuyến tại C của (O) cũng đi qua I.","deep":{"huong":[{"ten":"Điểm trùng","kq":"duoc","y":["Gọi I' là trung điểm EH ⇒ I'D = I'E (∆EDH vuông tại D) ⇒ ∠I'DE = ∠I'ED = ∠DAB = ∠ODA.","Suy ra ∠I'DO = ∠I'DE + ∠EDO = ∠ODA + ∠EDO = ∠EDA = 90° ⇒ I'D là tiếp tuyến ⇒ I' trùng I."]},{"ten":"Hai tam giác cân","kq":"duoc","y":["∠IDE = ∠HDO = ∠DAB = ∠IED ⇒ IE = ID; ∠IDH = ∠IHD ⇒ ID = IH."]}],"binh":["Hai hướng đi ngược chiều nhau: một hướng đi từ I (giao điểm) tới trung điểm, một hướng đi từ trung điểm tới tiếp tuyến. Kỹ thuật điểm trùng thường cho lời giải gọn khi điểm cần chứng minh được cho bằng giao điểm."]},"loai":"sector","gt":["Nửa (O) đường kính AB; D ∈ nửa đường tròn, C ∈ cung AD","E = AC ∩ BD, H = AD ∩ BC","Tiếp tuyến tại D cắt EH tại I"],"inputs":[{"code":"T1, G4","text":"∠IDE = ∠HDO","keep":1,"why":""},{"code":"G6","text":"∠HDO = ∠OAD","keep":1,"why":""},{"code":"S1","text":"ý b: ∠DAB = ∠DEH ⇒ IE = ID","keep":1,"why":""},{"code":"G7, G6","text":"ID = IH","keep":1,"why":""},{"code":"K2","text":"IE = ID = IH","keep":1,"why":""},{"code":"Q1","text":"H là trực tâm ∆ABE","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠IDE = ∠HDO","ld":"∠IDO = 90° (tiếp tuyến), ∠EDH = 90°","codes":["T1","G2","G4"]},{"cm":"∠HDO = ∠OAD = ∠DAB = ∠DEH ⇒ ∠IDE = ∠IED ⇒ IE = ID","ld":"∆OAD cân tại O; ý b","codes":["G6","G6"]},{"cm":"∠IDH = 90° − ∠IDE = 90° − ∠IED = ∠IHD ⇒ ID = IH","ld":"∆EDH vuông tại D","codes":["G7","G6"]},{"cm":"IE = IH, I ∈ EH ⇒ I là trung điểm EH","ld":"Từ 2 và 3","codes":["K2"]}]},{"boost":["B6"],"id":"5.10","ch":5,"truong":"Nguyễn Du","ky":"cuối HKII","de":["Cho đường tròn tâm O đường kính AB. Lấy điểm C thuộc (O) sao cho AC < BC. Kẻ đường thẳng d là tiếp tuyến của (O) tại A. Tiếp tuyến của (O) tại C cắt đường thẳng d tại D.","a) Chứng minh tứ giác ADCO nội tiếp.","b) Kẻ đường kính CF của (O). Gọi E là giao của DF với (O) (E khác F). Gọi H là giao điểm của DO và AC. Chứng minh DE.DF = DC² và ∠HEF = ∠DOC.","c) Gọi M là trung điểm của DH; gọi K là giao của CM và FH. Chứng minh K thuộc (O)."],"yl":"c","yc":"Gọi M là trung điểm của DH; gọi K là giao của CM và FH. Chứng minh K thuộc (O).","kl":"K thuộc (O)","hinh":"img/b5.10.png","huong":"∠CKF = 90°.","giu":"DE.DF = DC²; ∠HEF = ∠DOC; DO ⊥ AC tại H.","noi":"∆OCD ∽ ∆CHD; nhân đôi OC thành CF, chia đôi HD thành DM được ∆CDM ∽ ∆FCH (c.g.c).","nhin":"Đặt bài cạnh Trưng Vương cuối HKI (Bài 5.1): cách “nhân đôi – chia đôi” cạnh giống nhau ra sao?","nhinDap":"Cả hai đi từ một cặp tam giác vuông đồng dạng, nhân đôi một cạnh và chia đôi cạnh kề còn lại ở tam giác kia (bài toán phụ 6, dạng nhân đôi – chia đôi) để có cặp mới.","deep":{"huo  trung điểm, trung tuyến","mota":"∆ABC vuông tại A, M là trung điểm của BC hoặc của một cạnh góc vuông; có đường vuông góc hạ xuống trung tuyến.","y":["Trung tuyến AM ứng với cạnh huyền: MA = MB = MC, các tam giác MAB, MAC cân tại M.","Hạ BI ⊥ AM: ∆BIM và ∆AHM là hai tam giác vuông có chung góc M nên đồng dạng.","Khi M là trung điểm của cạnh góc vuông AC và AI ⊥ BM: AM² = MI.MB, mà MA = MC nên MC² = MI.MB, suy ra ∆MIC ∽ ∆MCB.","Cặp tam giác đồng dạng có trung điểm ở hai cạnh tương ứng thì dùng bài toán phụ 6."],"bai":["2.1","2.2","2.3","2.4","2.5","2.6"]},{"so":3,"ten":"Tam giác nhọn nội tiếp đường tròn và các đường cao","mota":"∆ABC nhọn nội tiếp (O); các đường cao AD, BE, CF cắt nhau tại H; AK là đường kính; M là trung điểm của BC.","y":["B, C, E, F cùng thuộc đường tròn đường kính BC; A, E, H, F cùng thuộc đường tròn đường kính AH.","∆AEF ∽ ∆ABC; ∆ABD ∽ ∆AKC nên AB.AC = AD.AK = 2R.AD.","BHCK là hình bình hành nên H, M, K thẳng hàng và AH = 2OM.","AO ⊥ EF."],"bai":["3.1","3.2","3.3","3.4","3.5","3.6","3.7","3.8","3.9","3.10"]},{"so":4,"ten":"Hai tiếp tuyến cắt nhau","mota":"Từ A nằm ngoài (O) kẻ hai tiếp tuyến AB, AC; H là giao điểm của OA và BC; BD là đường kính.","y":["AB = AC; OA là đường trung trực của BC, OA ⊥ BC tại trung điểm H của BC.","OH.OA = R²; AB² = AH.AO; BH² = AH.OH.","CD // OA và CD = 2OH.","Đường thẳng DC cắt BA tại P thì A là trung điểm của BP (bài toán phụ 5)."],"bai":["4.1","4.2","4.3","4.4","4.5","4.6","4.7","4.8","4.9"]},{"so":5,"ten":"Đường kính, tiếp tuyến và dây vuông góc với đường kính","mota":"Đường tròn (O) đường kính AB; tiếp tuyến tại M cắt các tiếp tuyến tại A, B ở C, D; MH ⊥ AB.","y":["CD = AC + BD; ∠COD = 90°; OC // MB, OD // MA.","BM cắt AC tại E thì C là trung điểm của AE.","BC, AD, MH đồng quy tại trung điểm của MH (bài toán phụ 4).","Dây CD vuông góc với đường kính AB tại I thì I là trung điểm của CD; AB là trục đối xứng của hình."],"bai":["5.1","5.2","5.3","5.4","5.5","5.6","5.7","5.8","5.9","5.10"]}],"vdOrder":["4.9","1.2","4 <script>
// Tinh hạm Orthos 3D – three.js; mỗi bộ phận là một khoang bấm được
window.SHIP3D = (function () {
  if (!window.THREE) return null;
  const T = THREE;
  const NAME = { train: 'Mô phỏng', lab: 'Tách lớp', ch1: 'K1 · Động cơ', ch2: 'K2 · Trung tuyến', ch3: 'K3 · Quan sát', ch4: 'K4 · Tiếp tuyến', ch5: 'K5 · Đường kính', tk: 'Xưởng Thiết Kế' };
  const SHORT = { train: 'MP', lab: 'TL', ch1: 'K1', ch2: 'K2', ch3: 'K3', ch4: 'K4', ch5: 'K5', tk: 'TK' };
  const COL = { train: 0xff4f9a, ch1: 0xff8a3d, ch2: 0x3fe0c5, ch3: 0xffc24d, ch4: 0x4fb4ff, ch5: 0xb26bff, lab: 0x7dffb0, tk: 0x6fe3f5 };
  const RED = 0xff2a4a, DIM = 0x3c4258;
  // vị trí nhãn so với điểm neo (px trên khung rộng 980)
  const OFF = { train: [80, -90], ch1: [-120, 40], ch2: [-20, 140], ch3: [90, -120], ch4: [-110, 70], ch5: [-40, -150], lab: [150, 100], tk: [-250, -10] };
  let R = null, scene, cam, ship, Z = {}, flames = [], spin = [], stars;
  let host = null, labs = {}, lines = {}, svg, onPick = null, hover = null, raf = 0, failed = false;
  let rotY = -0.62, rotX = 0.2, tY = -0.62, tX = 0.2, drag = null, lastTouch = -99;
  const t0 = performance.now(), now = () => (performance.now() - t0) / 1000;
  const ray = new T.Raycaster(), mv = new T.Vector2(); ray.params.Line.threshold = 0.06;

  // ---------- vật liệu
  let M;
  function mats() {
    const S = (c, m, r, o) => new T.MeshStandardMaterial(Object.assign({ color: c, metalness: m, roughness: r, flatShading: true, side: T.DoubleSide }, o || {}));
    M = {
      hull: S(0x2b3244, 0.85, 0.3), plate: S(0x4b5672, 0.8, 0.36), light: S(0xaeb9d2, 0.75, 0.28), dark: S(0x0f121a, 0.6, 0.55),
      glass: S(0x0b1830, 1, 0.04, { emissive: 0x0c3a5c, emissiveIntensity: 1 }), stripe: new T.MeshBasicMaterial({ color: 0x39e6ff, toneMapped: false }),
    };
  }
  const acc = k => { const m = new T.MeshBasicMaterial({ color: COL[k], toneMapped: false }); Z[k].acc.push(m); return m; };
  const mesh = (g, m, p, r, s) => { const o = new T.Mesh(g, m); if (p) o.position.set(p[0], p[1], p[2]); if (r) o.rotation.set(r[0], r[1], r[2]); if (s) o.scale.set(s[0], s[1], s[2]); return o; };
  const box = (x, y, z) => new T.BoxGeometry(x, y, z);

  // thân tàu: nối các mặt cắt bát giác vát cạnh
  const oct = (w, h) => [[0, h], [0.6 * w, 0.8 * h], [w, 0.14 * h], [0.8 * w, -0.5 * h], [0, -0.74 * h], [-0.8 * w, -0.5 * h], [-w, 0.14 * h], [-0.6 * w, 0.8 * h]];
  function loft(S, mat) {
    const P = [], rings = S.map(s => oct(s.w, s.h).map(([z, y]) => new T.Vector3(s.x, y + (s.y || 0), z))), n = 8;
    const push = (...v) => v.forEach(q => P.push(q.x, q.y, q.z));
    for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < n; j++) { const a = rings[i][j], b = rings[i][(j + 1) % n], c = rings[i + 1][(j + 1) % n], d = rings[i + 1][j]; push(a, d, c); push(a, c, b); }
    [rings[0], rings[rings.length - 1]].forEach(r => { const c = r.reduce((m, v) => m.add(v), new T.Vector3()).multiplyScalar(1 / n); for (let j = 0; j < n; j++) push(c, r[j], r[(j + 1) % n]); });
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(P, 3)); g.computeVertexNormals();
    return new T.Mesh(g, mat);
  }
  const strip = (a, b, y, th, m) => { // thanh đèn nối 2 điểm (x,z)
    const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz);
    return mesh(box(L, th, th), m, [(a[0] + b[0]) / 2, y, (a[1] + b[1]) / 2], [0, -Math.atan2(dz, dx), 0]);
  };

  function build() {
    mats();
    ship = new T.Group();
    ['train', 'ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'lab', 'tk'].forEach(k => { Z[k] = { g: new T.Group(), acc: [], anchor: new T.Vector3(), st: 'off' }; ship.add(Z[k].g); });
    // --- thân chính (không phải khoang)
    const H = new T.Group(); ship.add(H);
    H.add(loft([{ x: -4.0, w: 0.95, h: 0.62 }, { x: -3.4, w: 1.25, h: 0.88 }, { x: -1.5, w: 1.32, h: 0.92 }, { x: 0.6, w: 1.12, h: 0.82 }, { x: 2.0, w: 0.8, h: 0.6 }], M.hull));
    // giáp lưng
    H.add(loft([{ x: -3.3, w: 0.5, h: 0.12, y: 0.86 }, { x: -2.6, w: 0.62, h: 0.2, y: 0.9 }, { x: 0.4, w: 0.5, h: 0.18, y: 0.8 }, { x: 1.2, w: 0.2, h: 0.06, y: 0.68 }], M.plate));
    // dải đèn hai bên
    [1, -1].forEach(s => { H.add(strip([-3.6, s * 1.27], [0.4, s * 1.16], 0.12, 0.05, M.stripe)); H.add(strip([0.4, s * 1.16], [1.95, s * 0.84], 0.1, 0.05, M.stripe)); });
    // cửa hút gió
    [1, -1].forEach(s => { H.add(mesh(box(1.1, 0.34, 0.3), M.plate, [0.7, -0.22, s * 1.06], [0, s * 0.1, 0])); H.add(mesh(box(0.08, 0.24, 0.22), M.dark, [1.26, -0.22, s * 1.09])); });
    // vây đuôi xiên
    const fin = new T.Shape(); fin.moveTo(-4.1, 0); fin.lineTo(-2.8, 0); fin.lineTo(-3.5, 1.25); fin.lineTo(-4.35, 1.35); fin.closePath();
    const fg = new T.ExtrudeGeometry(fin, { depth: 0.07, bevelEnabled: false });
    [1, -1].forEach(s => { const f = mesh(fg, M.plate, [0, 0.55, s * 0.42], [s * -0.42, 0, 0]); H.add(f); });
    // nòng pháo lưng
    H.add(mesh(box(0.6, 0.22, 0.62), M.plate, [-0.6, 1.0, 0]));
    [0.16, -0.16].forEach(z => { H.add(mesh(new T.CylinderGeometry(0.055, 0.07, 1.4, 8), M.light, [0.15, 1.06, z], [0, 0, -Math.PI / 2])); });

    // --- K4: cánh xuôi + pháo đầu cánh
    {
      const W = Z.ch4.g, a = acc('ch4');
      const sh = new T.Shape(); sh.moveTo(1.0, 0.8); sh.lineTo(-1.5, 3.8); sh.lineTo(-2.6, 4.0); sh.lineTo(-3.0, 3.5); sh.lineTo(-2.7, 0.8); sh.closePath();
      const wg = new T.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1 });
      [1, -1].forEach(s => {
        const side = new T.Group(); side.scale.z = s; side.rotation.x = s * 0.1; W.add(side);
        side.add(mesh(wg, M.hull, [0, -0.05, 0], [Math.PI / 2, 0, 0]));
        side.add(strip([1.0, 0.8], [-1.5, 3.8], 0.0, 0.06, a));
        side.add(strip([-0.6, 1.3], [-2.2, 3.3], -0.02, 0.035, a));
        side.add(mesh(box(1.6, 0.04, 0.5), M.plate, [-1.3, 0.04, 2.0], [0, 0.7, 0]));
        side.add(mesh(new T.CylinderGeometry(0.1, 0.12, 2.2, 10), M.light, [-2.0, -0.02, 3.92], [0, 0, -Math.PI / 2]));
        side.add(mesh(new T.CylinderGeometry(0.06, 0.06, 0.7, 8), M.dark, [-0.6, -0.02, 3.92], [0, 0, -Math.PI / 2]));
        side.add(mesh(new T.TorusGeometry(0.12, 0.03, 6, 16), a, [-0.92, -0.02, 3.92], [0, Math.PI / 2, 0]));
      });
      Z.ch4.anchor.set(-1.6, 0, 3.4);
    }
    // --- K1: ba động cơ + lửa
    {
      const E = Z.ch1.g, a = acc('ch1');
      [[0.02, 0.66, 0.42], [0.02, -0.66, 0.42], [0.66, 0, 0.3]].forEach(([y, z, r]) => {
        E.add(mesh(new T.CylinderGeometry(r, r * 1.12, 1.3, 12), M.plate, [-4.1, y, z], [0, 0, Math.PI / 2]));
        E.add(mesh(new T.CylinderGeometry(r * 1.18, r * 1.18, 0.16, 12), M.dark, [-3.6, y, z], [0, 0, Math.PI / 2]));
        E.add(mesh(new T.TorusGeometry(r * 1.05, 0.05, 8, 20), a, [-4.76, y, z], [0, Math.PI / 2, 0]));
        E.add(mesh(new T.CircleGeometry(r * 0.9, 20), a, [-4.77, y, z], [0, -Math.PI / 2, 0]));
        const fl = new T.Group(); fl.position.set(-4.78, y, z); E.add(fl); addFlame(fl, r);
      });
      Z.ch1.anchor.set(-4.4, 0.9, 0.3);
    }
    // --- Mô phỏng: mũi tàu + buồng lái
    {
      const N = Z.train.g, a = acc('train');
      N.add(loft([{ x: 2.0, w: 0.8, h: 0.6 }, { x: 3.2, w: 0.44, h: 0.36, y: -0.05 }, { x: 4.5, w: 0.06, h: 0.05, y: -0.12 }], M.light));
      N.add(loft([{ x: 1.15, w: 0.02, h: 0.02, y: 0.6 }, { x: 1.8, w: 0.4, h: 0.26, y: 0.6 }, { x: 2.7, w: 0.3, h: 0.17, y: 0.44 }, { x: 3.2, w: 0.02, h: 0.02, y: 0.3 }], M.glass));
      [1, -1].forEach(s => N.add(strip([2.05, s * 0.81], [4.2, s * 0.1], -0.02, 0.045, a)));
      N.add(mesh(new T.CylinderGeometry(0.015, 0.03, 0.9, 6), M.light, [4.85, -0.12, 0], [0, 0, -Math.PI / 2]));
      N.add(mesh(new T.SphereGeometry(0.05, 8, 6), a, [5.3, -0.12, 0]));
      Z.train.anchor.set(3.4, 0.35, 0);
    }
    // --- K2: vòng xoay quanh thân
    {
      const G = Z.ch2.g, a = acc('ch2'), ring = new T.Group(); ring.position.x = -0.25; G.add(ring);
      ring.add(mesh(new T.TorusGeometry(1.5, 0.09, 8, 48), M.light, null, [0, Math.PI / 2, 0]));
      ring.add(mesh(new T.TorusGeometry(1.5, 0.035, 6, 48), a, [0.1, 0, 0], [0, Math.PI / 2, 0]));
      ring.add(mesh(new T.TorusGeometry(1.5, 0.035, 6, 48), a, [-0.1, 0, 0], [0, Math.PI / 2, 0]));
      for (let i = 0; i < 6; i++) { const t = i * Math.PI / 3; ring.add(mesh(box(0.3, 0.2, 0.2), M.plate, [0, 1.5 * Math.cos(t), 1.5 * Math.sin(t)], [t, 0, 0])); }
      spin.push({ o: ring, ax: 'x', v: 0.5 });
      Z.ch2.anchor.set(-0.25, -1.5, 0.2);
    }
    // --- K3: đài radar
    {
      const G = Z.ch3.g, a = acc('ch3');
      G.add(mesh(new T.CylinderGeometry(0.26, 0.34, 0.24, 8), M.plate, [1.0, 0.78, 0]));
      const rad = new T.Group(); rad.position.set(1.0, 0.92, 0); G.add(rad);
      rad.add(mesh(new T.CylinderGeometry(0.04, 0.05, 0.4, 6), M.light, [0, 0.2, 0]));
      const dish = mesh(new T.SphereGeometry(0.46, 18, 8, 0, Math.PI * 2, 0, 0.95), M.light, [0.1, 0.48, 0], [0, 0, -1.2]); rad.add(dish);
      rad.add(mesh(new T.SphereGeometry(0.47, 18, 1, 0, Math.PI * 2, 0.9, 0.06), a, [0.1, 0.48, 0], [0, 0, -1.2]));
      rad.add(mesh(new T.CylinderGeometry(0.015, 0.015, 0.5, 6), M.light, [0.32, 0.58, 0], [0, 0, -1.2]));
      rad.add(mesh(new T.SphereGeometry(0.06, 8, 6), a, [0.52, 0.68, 0]));
      spin.push({ o: rad, ax: 'y', v: 0.8 });
      Z.ch3.anchor.set(1.1, 1.6, 0);
    }
    // --- K5: lõi phản ứng (đường kính)
    {
      const G = Z.ch5.g, a = acc('ch5');
      G.add(mesh(new T.CylinderGeometry(0.58, 0.7, 0.3, 6), M.plate, [-2.2, 0.98, 0]));
      G.add(mesh(new T.SphereGeometry(0.32, 20, 14), a, [-2.2, 1.36, 0]));
      const rg = new T.Group(); rg.position.set(-2.2, 1.36, 0); G.add(rg);
      rg.add(mesh(new T.TorusGeometry(0.5, 0.04, 8, 32), a, null, [Math.PI / 2.4, 0, 0]));
      rg.add(mesh(box(1.12, 0.05, 0.05), M.light));
      spin.push({ o: rg, ax: 'y', v: 1.2 });
      Z.ch5.anchor.set(-2.2, 1.75, 0);
    }
    // --- Tách lớp: khoang thí nghiệm dưới bụng
    {
      const G = Z.lab.g, a = acc('lab');
      [-1.9, -0.5].forEach(x => G.add(mesh(box(0.18, 0.4, 0.3), M.plate, [x, -0.8, 0])));
      G.add(mesh(new T.CapsuleGeometry(0.38, 1.9, 6, 12), M.light, [-1.2, -1.12, 0], [0, 0, Math.PI / 2]));
      [-1.8, -1.2, -0.6].forEach(x => [1, -1].forEach(s => G.add(mesh(box(0.22, 0.12, 0.04), a, [x, -1.08, s * 0.38]))));
      G.add(mesh(new T.TorusGeometry(0.38, 0.03, 6, 20), a, [-2.1, -1.12, 0], [0, Math.PI / 2, 0]));
      Z.lab.anchor.set(-1.0, -1.55, 0.3);
    }
    // --- Xưởng Thiết Kế: máy chiếu hologram bản vẽ ở đuôi tàu
    {
      const G = Z.tk.g, a = acc('tk');
      G.add(mesh(new T.CylinderGeometry(0.2, 0.28, 0.16, 10), M.plate, [-3.2, 1.06, 0]));
      G.add(mesh(new T.TorusGeometry(0.2, 0.035, 6, 20), a, [-3.2, 1.15, 0], [Math.PI / 2, 0, 0]));
      const hm = holoMat();
      const beam = mesh(new T.ConeGeometry(0.62, 0.75, 20, 1, true), hm, [-3.2, 1.55, 0], [Math.PI, 0, 0]); beam.raycast = () => {}; G.add(beam);
      const hp = new T.Group(); hp.position.set(-3.2, 1.98, 0); G.add(hp); addHolo(hp, hm);
      Z.tk.anchor.set(-3.75, 1.98, 0);
    }
    finish();
  }

  // ---------- phần dùng chung cho tàu vẽ bằng code và tàu từ Blender
  const holoMat = () => new T.MeshBasicMaterial({ color: 0x6fe3f5, transparent: true, opacity: 0.12, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, toneMapped: false });
  // lửa động cơ: gắn vào điểm par (miệng ống phụt), phun về phía -x
  function addFlame(par, r) {
    const f1 = new T.MeshBasicMaterial({ color: 0xff8a3d, transparent: true, opacity: 0.75, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false });
    const f2 = new T.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false });
    const c1 = mesh(new T.ConeGeometry(r * 0.85, 2.4, 16, 1, true), f1, [-1.2, 0, 0], [0, 0, Math.PI / 2]);
    const c2 = mesh(new T.ConeGeometry(r * 0.45, 1.2, 12, 1, true), f2, [-0.6, 0, 0], [0, 0, Math.PI / 2]);
    [c1, c2].forEach(c => { c.userData.flame = 1; c.raycast = () => {}; });
    par.add(c1, c2); flames.push({ c1, c2, f1 });
  }
  // bản vẽ hologram (đường tròn, tam giác, đường cao) quay trên máy chiếu Xưởng Thiết Kế
  function addHolo(par, hm) {
    const a = acc('tk'), holo = new T.Group(); holo.scale.setScalar(1.25); par.add(holo);
    const lm = new T.LineBasicMaterial({ color: 0x6fe3f5, transparent: true, opacity: 0.95, toneMapped: false });
    const circ = []; for (let i = 0; i <= 48; i++) { const t = i / 48 * Math.PI * 2; circ.push(new T.Vector3(Math.cos(t) * 0.42, Math.sin(t) * 0.42, 0)); }

<script>

// ---------------- hình học
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y), sub=(a,b)=>P(a.x-b.x,a.y-b.y), mul=(a,k)=>P(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x, len=a=>Math.hypot(a.x,a.y);
const mid=(a,b)=>mul(add(a,b),.5);
const unit=a=>{const l=len(a);return l?mul(a,1/l):P(0,0)};
const foot=(p,a,b)=>{const d=sub(b,a);return add(a,mul(d,dot(sub(p,a),d)/dot(d,d)))};
const inter=(p1,p2,p3,p4)=>{const d1=sub(p2,p1),d2=sub(p4,p3),den=cross(d1,d2);if(Math.abs(den)<1e-9)return null;const t=cross(sub(p3,p1),d2)/den;return add(p1,mul(d1,t))};
const onc=(c,r,deg)=>P(c.x+r*Math.cos(deg*Math.PI/180),c.y+r*Math.sin(deg*Math.PI/180));
const lineAng=(a,b,c,d)=>{const u=sub(b,a),v=sub(d,c);let g=Math.acos(Math.min(1,Math.abs(dot(u,v))/(len(u)*len(v))))*180/Math.PI;return g};
const dev=(a,b,c)=>{const g=Math.acos(Math.max(-1,Math.min(1,dot(sub(a,b),sub(c,b))/(len(sub(a,b))*len(sub(c,b))))))*180/Math.PI;return Math.min(g,180-g)};
const tangentPts=(O,R,A)=>{const d=len(sub(A,O)),a=Math.acos(R/d),b=Math.atan2(A.y-O.y,A.x-O.x);return [P(O.x+R*Math.cos(b+a),O.y+R*Math.sin(b+a)),P(O.x+R*Math.cos(b-a),O.y+R*Math.sin(b-a))]};
const area=(a,b,c)=>Math.abs(cross(sub(b,a),sub(c,a)))/2;
const fmt=(x,d=2)=>x.toFixed(d).replace('.',',');

{ id:'1.1', ten:'Trưng Vương', sk:'Dựng đúng, kéo và kiểm tra', view:[-3.6,10.6,-1.9,6.2],

  steps:[

     ggm:[`Hiện trục toạ độ: chuột phải vào chỗ trống → Axes (Trục).`,`Chọn ${T('Point')}: bấm vào gốc toạ độ được A; bấm lên trục tung được B; bấm lên trục hoành được C. B, C dính vào trục.`,`Chọn ${T('Polygon')} (nhóm đa giác), bấm A, B, C rồi bấm lại A.`],

     gsp:[`Vẽ một đường thẳng qua A, chọn A và đường đó → ${M('Construct')} → ${M('Perpendicular Line')}.`,`Trên mỗi đường lấy một điểm bằng ${M('Point On Object')}: B và C.`,`Nối AB, BC, CA.`]},
    {ti:'Điểm O chia AC theo tỉ số t', why:'Đề gốc là t = 0,5 (trung điểm). Dùng thanh trượt để thử các tỉ số khác. Có thể kéo O ngay trên đoạn AC.',
     ggm:[`Chọn ${T('Point')}, bấm lên cạnh AC: được điểm dính vào AC, đổi tên O. Kéo được O trên AC.`,`Chọn ${T('Distance or Length')} (nhóm góc), bấm A rồi O, bấm A rồi C: hiện độ dài AO, AC.`,`Muốn GeoGebra tính sẵn tỉ số, gõ một dòng: t = Distance(A, O) / Distance(A, C).`],
     gg:['t = Slider(0.05, 0.95, 0.01)','O = A + t*(C - A)'],
     gsp:[`Chọn đoạn AC → ${M('Construct')} → ${M('Point On Object')}, đổi tên O.`,`Chọn đoạn AO rồi đoạn AC → ${M('Measure')} → ${M('Ratio')} để có t.`]},
    {ti:'AD ⊥ BC và đường thẳng d vuông góc với AC tại C', why:'D là chân đường cao từ A (ở đề gốc, D nằm trên đường tròn đường kính AC). d chính là tiếp tuyến tại C.',
     ggm:[`${T('Perpendicular Line')}: bấm A rồi BC. ${T('Intersect')} với BC được D.`,`${T('Perpendicular Line')}: bấm C rồi AC: được đường thẳng d.`],
     gg:['D = ClosestPoint(Line(B, C), A)','d = PerpendicularLine(C, Line(A, C))'],
     gsp:[`Chọn A và BC → ${M('Perpendicular Line')} → lấy giao điểm D.`,`Chọn C và AC → ${M('Perpendicular Line')}, đây là d.`]},
    {ti:'AE ⊥ OB, rồi lấy H và K trên d', why:'H là giao của AD với d, K là giao của AE với d.',
     ggm:[`${T('Segment')} nối O với B. ${T('Perpendicular Line')}: bấm A rồi OB; ${T('Intersect')} với OB được E.`,`Chọn ${T('Ray')}: bấm A rồi D; bấm A rồi E.`,`${T('Intersect')}: tia AD với d được H; tia AE với d được K.`],
     gg:['E = ClosestPoint(Line(O, B), A)','H = Intersect(Line(A, D), d)','K = Intersect(Line(A, E), d)'],
     gsp:[`Nối OB; chọn A và OB → ${M('Perpendicular Line')} → giao điểm E.`,`Vẽ tia AD, tia AE; lấy giao điểm với d được H và K.`]},
    {ti:'Đo CK/CH và kéo thanh trượt', why:'So sánh tỉ số CK/CH với t ở từng vị trí.',
     ggm:[`${T('Distance or Length')}: bấm C rồi K, bấm C rồi H.`,`Chọn ${T('Move')}, kéo O trên AC. Lấy CK chia CH rồi so với AO chia AC.`,`Gõ thêm r = Distance(C, K) / Distance(C, H) nếu muốn GeoGebra tính sẵn tỉ số.`],
     gg:['r = Distance(C, K) / Distance(C, H)'],
     gsp:[`Nối CK, CH. Chọn đoạn CK rồi CH → ${M('Measure')} → ${M('Ratio')}.`,`Kéo O trên AC, kéo B, C, và ghi lại hai tỉ số.`],
     note:'Kéo thanh trượt bên dưới hình: r luôn bằng t. Đó là phát biểu khái quát của bài.'},
  ],
  read(q,step,p){const r=[];
    if(step>=2) r.push({k:'t = AO/AC',v:fmt(p.t)});

  obs:[['Kéo thanh trượt t. So sánh r = CK/CH với t.','Luôn bằng nhau. Khái quát: nếu AO/AC = t thì CK/CH = t. Trung điểm chỉ là trường hợp t = 1/2.'],
       ['Kéo B và C. Quy luật có thay đổi không?','Không: r vẫn bằng t với mọi tam giác vuông.'],
       ['Bài toán phụ nào giải thích quy luật này?','Bài toán phụ 6 mở rộng: hai điểm chia hai cạnh tương ứng của ∆BAC ∽ ∆ACH theo cùng một tỉ số.']]},

{ id:'3.3', ten:'Cầu Diễn → Đại Áng', sk:'Nhìn tương tự: đổi vai B, C', view:[-4.4,4.6,-4,4.2],

    {t:'pt',id:'O',s:1,off:[12,-8]},{t:'pt',id:'A',s:1,off:[0,-16]},{t:'pt',id:'B',s:1,off:[-14,10]},{t:'pt',id:'C',s:1,off:[14,10]},
    {t:'seg',a:'A',b:'D',s:2},{t:'seg',a:'B',b:'E',s:2},{t:'ra',v:'D',p:'A',q:'C',s:2},{t:'ra',v:'E',p:'B',q:'C',s:2},{t:'pt',id:'D',s:2,off:[-8,16]},{t:'pt',id:'E',s:2,off:[14,-6]},
    {t:'seg',a:'A',b:'K',s:3},{t:'seg',a:'B',b:'F',s:3},{t:'ra',v:'F',p:'B',q:'K',s:3},{t:'pt',id:'K',s:3,off:[6,16]},{t:'pt',id:'F',s:3,off:[-14,-6]},
    {t:'segx',a:'E',b:'M',s:4,st:'acc'},{t:'pt',id:'M',s:4,off:[8,16]},

  ],
  steps:[
    {ti:'Đường tròn (O), tam giác ABC nội tiếp', why:'A là điểm tự do trên cung lớn BC. B, C cũng có thể là điểm tự do trên đường tròn.',
     ggm:[`Chọn ${T('Circle with Center and Radius')} (nhóm đường tròn), bấm một chỗ làm tâm, gõ bán kính 3 → OK. Đổi tên tâm thành O.`,`Chọn ${T('Point')}, bấm ba lần lên đường tròn: A, B, C.`,`${T('Polygon')}: bấm A, B, C rồi bấm lại A.`],
     gg:['O = (0, 0)','c = Circle(O, 3)','B = Point(c)','C = Point(c)','A = Point(c)','Polygon(A, B, C)'],
     gsp:[`Dùng công cụ Compa vẽ đường tròn tâm O.`,`Chọn đường tròn → ${M('Point On Object')} ba lần, đổi tên A, B, C.`,`Nối ba cạnh.`]},
    {ti:'Hai đường cao AD, BE', why:'Chân đường cao dựng bằng đường vuông góc và giao điểm.',

     gg:['D = ClosestPoint(Line(B, C), A)','E = ClosestPoint(Line(A, C), B)','Segment(A, D)','Segment(B, E)'],
     gsp:[`Chọn A và BC → ${M('Perpendicular Line')} → giao điểm D.`,`Chọn B và AC → ${M('Perpendicular Line')} → giao điểm E.`]},
    {ti:'Đường kính AK và hình chiếu F', why:'K đối xứng với A qua O. F là chân đường vuông góc từ B xuống AK.',
     ggm:[`Chọn ${T('Reflect about Point')} (nhóm biến hình), bấm A rồi bấm O: được K.`,`${T('Segment')} nối AK.`,`${T('Perpendicular Line')}: bấm B rồi AK; ${T('Intersect')} được F.`],

    {ti:'Trung điểm M và kiểm tra E, F, M', why:'Kéo A: ba điểm luôn thẳng hàng. Đo thêm MD và MF.',

     gg:['M = Midpoint(B, C)','AreCollinear(E, F, M)','Distance(M, D)','Distance(M, F)'],
     gsp:[`Chọn BC → ${M('Midpoint')}, đổi tên M.`,`Chọn E, F, M → ${M('Construct')} → ${M('Triangle Interior')} → ${M('Measure')} → ${M('Area')}: diện tích bằng 0.`]},
    {ti:'Đổi vai B và C: được Bài 3.7', why:'Làm lại bước 2 – 4 với C thay cho B: F′ là chân đường cao từ C, I là hình chiếu của C trên AK. Ba điểm F′, I, M thẳng hàng (đường màu cam).',
     ggm:[`${T('Perpendicular Line')}: bấm C rồi AB; ${T('Intersect')} được F′.`,`${T('Perpendicular Line')}: bấm C rồi AK; ${T('Intersect')} được I.`,`${T('Line')} qua F′ và M, rồi ${T('Relation')}: bấm I và đường thẳng đó.`],
     gg:["F' = ClosestPoint(Line(A, B), C)",'I = ClosestPoint(Line(A, K), C)',"AreCollinear(F', I, M)"],

{ id:'4.6', ten:'Đức Giang', sk:'Bật vết và quỹ tích', view:[-5.4,3.4,-3,5.6],

    {t:'circle',c:'Lc',thr:'O',s:5,st:'amb'},{t:'poly',pts:['O','I','K'],s:5},

     ggm:[`Hiện trục toạ độ. ${T('Circle with Center and Radius')}: bấm gốc toạ độ, bán kính 2. ${T('Intersect')} đường tròn với trục hoành được A, B.`,`${T('Point')}: bấm lên trục hoành, bên trái A: điểm H.`,`${T('Perpendicular Line')}: bấm H rồi trục hoành: được d. ${T('Point')}: bấm lên d được E.`],

     ggm:[`Chọn ${T('Tangents')} (nhóm đường vuông góc), bấm E rồi bấm đường tròn: được hai tiếp tuyến.`,`${T('Intersect')}: bấm từng tiếp tuyến với đường tròn để có tiếp điểm M, N.`,`Ẩn hai tiếp tuyến, dùng ${T('Segment')} nối EM, EN.`],

     gsp:[`Dựng trung điểm của OE, đường tròn tâm đó qua O.`,`Chọn hai đường tròn → ${M('Construct')} → ${M('Intersection')} được M, N; nối EM, EN.`],

    {ti:'Dây MN, điểm K và I', why:'K là giao của MN với đường thẳng AB, I là giao của MN với OE.',

    {ti:'Bật vết dây MN rồi kéo E', why:'Bấm “Bật vết” bên dưới hình rồi kéo E (hoặc cho E tự chạy). Mọi vị trí của MN đi qua cùng một điểm.',
     ggm:[`Chuột phải vào đường thẳng MN → Show Trace (Bật vết).`,`Kéo E bằng ${T('Move')}, hoặc chuột phải vào E → Animation (Hoạt hình) để E tự chạy.`,`${T('Distance or Length')}: đo OK và OH.`],

     note:'Đo OK và OH: tích OK.OH luôn bằng R² = 4, nên K là điểm cố định.'},
    {ti:'Quỹ tích của I và diện tích ∆OIK', why:'I chạy trên đường tròn đường kính OK (màu cam). Diện tích ∆OIK lớn nhất khi IO = IK.',
     ggm:[`Chọn ${T('Locus')} (nhóm đường vuông góc), bấm I rồi bấm E: hiện quỹ tích của I.`,`${T('Polygon')}: bấm O, I, K rồi bấm lại O. Chọn ${T('Area')} (nhóm góc) rồi bấm vào tam giác.`],
     gg:['Locus(I, E)','Area(Polygon(O, I, K))'],
     gsp:[`Chọn I và E → ${M('Construct')} → ${M('Locus')}.`,`Dựng miền tam giác OIK → ${M('Measure')} → ${M('Area')}; kéo E tìm lúc lớn nhất.`]},

      inner += k === 0 ? `<path d="M74 34 q6 -10 14 -6 q-4 8 -14 6 Z" fill="#7ee08a" stroke="${OL}" stroke-width="1.8"/>`

          : k === 2 ? `<path d="M40 84 Q60 92 80 84 L78 90 Q60 98 42 90 Z" fill="${P.a}" stroke="${OL}" stroke-width="1.8"/>`
            : `<path d="M60 22 l4 8 l-4 6 l-4 -6 Z" fill="#9be7ff" stroke="${OL}" stroke-width="1.8"/>`;
    }
    // dạng tiến hoá: vương miện + hào quang
    let back = '', front = '';
    if (!sil && st === 3) {
      back = `<circle cx="60" cy="66" r="52" fill="url(#pg-${id})" opacity=".45"/>`;
      if (I.g !== 'B') front = `<path d="M50 ${I.g === 'V' ? 44 : 24} l3 -9 l7 6 l7 -6 l3 9 Z" fill="#ffd27a" stroke="${OL}" stroke-width="1.8" stroke-linejoin="round" transform="${I.g === 'V' ? 'translate(-34 0)' : ''}"/>`;
      front += sparkle(16, 24, 6, '#fff3a0') + sparkle(104, 100, 5, '#fff');
    }

    return `<svg viewBox="0 0 120 120" class="petsvg st${st}" aria-hidden="true"><defs><radialGradient id="pg-${id}"><stop offset="0" stop-color="${I.c}"/><stop offset="1" stop-color="${I.c}" stop-opacity="0"/></radialGradient></defs>
      ${back}<ellipse cx="60" cy="110" rx="${30 * sc}" ry="5" fill="#000" opacity=".25"/><g class="petbody" transform="translate(${60 - 60 * sc} ${110 - 110 * sc}) scale(${sc})">${inner}</g>${front}</svg>`;
  }
  const stageOf = (id, xp) => id[0] === 'B' ? 3 : xp >= XP[3] ? 3 : xp >= XP[2] ? 2 : 1;
  return { info, svg, stageOf, STAGE, XP, SP };
})();

function dNew(i){ const pb=TK.PROB[i]; DZ={ i, pb, p:{...pb.init}, step:0, mist:0, phase:'build', cov:{}, tr:[], traceOn:false, anim:null, fb:'', open:0 }; dChoices(); }
function dChoices(){ const pb=DZ.pb, n=DZ.step; if(n>=pb.steps.length) { DZ.ch=[]; return; }

  const pts=pb.objs.filter(o=>o.t==='pt'&&o.s===n+1&&!pb.drag[o.id]).map(o=>o.lab||o.id);

  <div class="gvnote">${'Chuỗi chứng minh trong máy chỉ là <b>một trong các hướng làm gợi ý</b>. Em có cách khác thì ưu tiên <b>lưu lại cách của em</b> vào Sổ cách giải.'}</div>
  ${ids.length?ids.map(id=>{ const m=MIS[id]; return `<section class="sobai"><div class="eyebrow">Bài ${id} · ${esc(m.truong)}</div><h3 style="margin:2px 0 8px">${esc(m.kl)}</h3>
    ${S.so[id].map((e,k)=>`<div class="soe"><div class="row"><b>Cách ${k+1}</b><span class="muted" style="font-size:12.5px">${new Date(e.t).toLocaleDateString('vi-VN')}${e.self==='dung'?' · em tự kiểm tra: đúng':e.self==='sua'?' · cần sửa lại':''}</span><span class="sp"></span><button class="btn sm" data-cp="${id}:${k}">Chép</button><button class="btn sm" data-rm="${id}:${k}">Xoá</button></div>
      <ol>${e.lines.map(x=>`<li><span class="math">${esc(x.cm)}</span><br><span class="muted">Lý do: ${esc(x.ld)}</span> ${x.cards.map(badge).join('')}</li>`).join('')}</ol></div>`).join('')}
    <div class="row"><span class="sp"></span><button class="btn sm" data-go="${id}">Mở bài ${id}</button></div></section>`; }).join('')
   :`<div class="sobai">${say('Sổ còn trống. Khi lắp ráp, chọn <b>Cách của em</b> ở bước 3, gõ chuỗi chứng minh của mình rồi bấm <b>Lưu vào Sổ cách giải</b>. Mỗi bài lưu được nhiều cách.')}</div>`}
  <textarea id="cptxt" hidden readonly rows="5" style="width:100%"></textarea>`;
  $('#back').onclick=()=>go({v:'map'});
  a.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{ const [id,k]=b.dataset.cp.split(':'); const t=soText(id,S.so[id][+k],+k); const done=()=>toast('Đã chép – dán gửi giáo viên'); try{ navigator.clipboard.writeText(t).then(done,()=>{ $('#cptxt').hidden=false; $('#cptxt').value=t; $('#cptxt').select(); }); }catch(e){ $('#cptxt').hidden=false; $('#cptxt').value=t; } });
  a.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const [id,k]=b.dataset.rm.split(':'); if(!confirmRm(b)) return; S.so[id].splice(+k,1); if(!S.so[id].length) delete S.so[id]; save(); render(); });
  a.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ if(misOpen(b.dataset.go)) startMission(b.dataset.go); else toast('Bài này chưa mở'); });
}
function confirmRm(b){ if(b.dataset.sure) return true; b.dataset.sure=1; b.textContent='Bấm lần nữa để xoá'; b.classList.add('amb'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.textContent='Xoá'; b.classList.remove('amb'); } },2500); return false; }
function mStep3Em(el, modeBar){
  altInit(); const A=M.alt, m=M.m;
  el.innerHTML=`${heatHTML()}<h3>Bước 3 · Cách của em</h3>${modeBar}
    ${say('Gõ chuỗi chứng minh của em, mỗi dòng một khẳng định. Cột lý do: gõ ngắn hoặc chạm thẻ trong khay để gắn vào dòng đang chọn. Dòng cuối là kết luận <span class="math">'+esc(m.kl)+'</span>.')}
    <div class="kb" aria-label="Bảng gõ công thức">${KEYS.map(([k,t])=>`<button class="key" data-k="${esc(k)}" title="${esc(t)}">${esc(k)}</button>`).join('')}</div>
    <div class="alt">${A.lines.map((L,i)=>`<div class="aline ${A.focus.i===i?'sel':''} ${A.err&&A.err.includes(i)?'err':''}" data-l="${i}">
        <span class="n">${i+1}</span>
        <input id="cm${i}" class="math" data-i="${i}" data-f="cm" value="${esc(L.cm)}" placeholder="Khẳng định, ví dụ ∠IMB = ∠ABM" ${A.sent?'readonly':''} aria-label="Chứng minh dòng ${i+1}">
        <div class="ldbox"><div class="row" style="gap:4px">${L.cards.map((c,j)=>`<button class="badge rm" style="${cvar(CARD[c])}" data-rm="${i}:${j}" title="Bỏ thẻ" ${A.sent?'disabled':''}>${c} ×</button>`).join('')}</div>
          <input id="ld${i}" data-i="${i}" data-f="ld" value="${esc(L.ld)}" placeholder="Lý do (gõ hoặc gắn thẻ)" ${A.sent?'readonly':''} aria-label="Lý do dòng ${i+1}"></div>
        ${A.sent?'':`<button class="btn sm" data-del="${i}" title="Xoá dòng" aria-label="Xoá dòng ${i+1}">×</button>`}</div>`).join('')}</div>
    ${A.sent?'':`<div class="row"><button class="btn sm" id="add">+ Thêm dòng</button><span class="sp"></span><button class="btn pri" id="send">Nộp chuỗi của em</button></div>`}
    ${A.sent?altReview():trayHTML('Khay thẻ – chạm để gắn vào dòng '+(A.focus.i+1))}`;
  bind3(el);
  const keep=()=>{ const t=el.querySelector('#'+A.focus.f+A.focus.i); if(t&&!A.sent){ t.focus(); const p=A.caret??t.value.length; try{ t.setSelectionRange(p,p);}catch(e){} } };
  el.querySelectorAll('input[data-i]').forEach(inp=>{
    inp.addEventListener('focus',()=>{ A.focus={i:+inp.dataset.i,f:inp.dataset.f}; el.querySelectorAll('.aline').forEach(x=>x.classList.toggle('sel',+x.dataset.l===A.focus.i)); const t=el.querySelector('.tray b'); if(t) t.textContent='Khay thẻ – chạm để gắn vào dòng '+(A.focus.i+1); });
    inp.addEventListener('input',()=>{ A.lines[+inp.dataset.i][inp.dataset.f]=inp.value; A.caret=inp.selectionStart; altSave(); });
    inp.addEventListener('keyup',()=>{ A.caret=inp.selectionStart; });
    inp.addEventListener('click',()=>{ A.caret=inp.selectionStart; });
  });
  el.querySelectorAll('.key').forEach(k=>{ k.addEventListener('mousedown',e=>e.preventDefault()); k.onclick=()=>{
    if(A.sent) return; const t=el.querySelector('#'+A.focus.f+A.focus.i); if(!t) return;
    const ins=k.dataset.k, a=t.selectionStart??t.value.length, b=t.selectionEnd??a;
    t.value=t.value.slice(0,a)+ins+t.value.slice(b); const p=a+ins.length; t.focus(); t.setSelectionRange(p,p);
    A.lines[A.focus.i][A.focus.f]=t.value; A.caret=p; altSave(); beep(700,.02); }; });
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ if(A.sent) return; const L=A.lines[A.focus.i]; if(!L.cards.includes(b.dataset.c)) L.cards.push(b.dataset.c); A.err=null; altSave(); beep(600,.04); render(); keep(); });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.rm.split(':').map(Number); A.lines[i].cards.splice(j,1); altSave(); render(); });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.del; if(A.lines.length<=1) return; A.lines.splice(i,1); A.focus={i:Math.max(0,Math.min(i,A.lines.length-1)),f:'cm'}; altSave(); render(); });
  const add=$('#add'); if(add) add.onclick=()=>{ const i=Math.max(0,A.lines.length-1); A.lines.splice(i,0,{cm:'',ld:'',cards:[]}); A.focus={i,f:'cm'}; A.caret=0; altSave(); render(); keep(); };
  const send=$('#send'); if(send) send.onclick=()=>{
    const L=A.lines.filter(x=>x.cm.trim());
    const err=A.lines.map((x,i)=>x.cm.trim()&&!x.ld.trim()&&!x.cards.length?i:-1).filter(i=>i>=0);
    if(L.length<2){ toast('Chuỗi cần ít nhất 2 dòng'); sBad(); return; }
    if(err.length){ A.err=err; toast('Dòng '+err.map(i=>i+1).join(', ')+' chưa có lý do'); sBad(); render(); return; }
    A.lines=L; A.sent=true; A.err=null; altSave(); sOk(); render(); };
  el.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{ A.self=b.dataset.self; altSave();
    if(A.self==='sua'){ A.sent=false; altSave(); toast('Mở lại để sửa'); } else { M.altDone=true; sOk(); } render(); });
  const sv=$('#sosave'); if(sv) sv.onclick=()=>{ soAdd(M.id, A); A.saved=true; altSave(); sOk(); toast('Đã lưu vào Sổ cách giải'); render(); };
  const ag=$('#again'); if(ag) ag.onclick=()=>{ M.alt=null; if(S.alt) delete S.alt[M.id]; save(); altInit(); render(); };
  const cp=$('#copy'); if(cp) cp.onclick=()=>{ const txt='Bài '+M.id+' – cách của em\n'+A.lines.map((x,i)=>(i+1)+'. '+x.cm+'  |  '+[x.cards.join(', '),x.ld].filter(Boolean).join('; ')).join('\n');
    const done=()=>toast('Đã chép – dán gửi giáo viên'); try{ navigator.clipboard.writeText(txt).then(done,()=>{ $('#cptxt').hidden=false; $('#cptxt').select(); }); }catch(e){ $('#cptxt').hidden=false; } $('#cptxt').value=txt; };
  keep();
}
function altReview(){
  const m=M.m, A=M.alt;
  const used=new Set(A.lines.flatMap(x=>x.cards)), mau=new Set(m.steps.flatMap(s=>s.codes));
  const chung=[...used].filter(c=>mau.has(c));
  return `${say('Máy không tự chấm được cách làm khác. Em hãy <b>đối chiếu</b> với chuỗi gợi ý bên dưới và tự kiểm tra theo ba câu hỏi, rồi chọn kết quả. Có thể chép chuỗi của em để gửi giáo viên.')}
    <div class="qa"><div class="r"><span class="lab">TỰ KIỂM TRA</span><span>• Mỗi dòng chỉ dùng giả thiết và các dòng trước?<br>• Mỗi lý do là một định nghĩa, tính chất có thật (không dùng dấu hiệu chỉ đọc thêm như thẻ N2)?<br>• Dòng cuối đúng là kết luận, không dùng chính điều phải chứng minh?</span></div>
    <div class="r"><span class="lab">SO VỚI MẪU</span><span>Em dùng ${used.size} thẻ, trong đó ${chung.length} thẻ trùng chuỗi gợi ý${chung.length?': '+chung.map(badge).join(''):''}.</span></div></div>
    <details class="mau"><summary>Xem chuỗi gợi ý (${m.steps.length} dòng)</summary><ol>${m.steps.map(s=>`<li><span class="math">${esc(s.cm)}</span> <span class="muted">— ${esc(s.ld)}</span> ${s.codes.map(badge).join('')}</li>`).join('')}</ol></details>
    <textarea id="cptxt" hidden readonly rows="4" style="width:100%"></textarea>
    <div class="row"><button class="btn sm" id="copy">Chép chuỗi của em</button><span class="sp"></span>
      ${A.saved?'<span class="tag done">✓ Đã lưu vào Sổ cách giải</span><button class="btn sm" id="again">+ Làm thêm cách khác</button>':'<button class="btn sm amb" id="sosave">Lưu vào Sổ cách giải</button>'}
      ${M.altDone?`<button class="btn pri" id="nx">Kiểm định →</button>`:`<button class="btn sm" data-self="sua">Cần sửa lại</button><button class="btn amb" data-self="dung">Cách của em đúng</button>`}</div>`;
}
function plug(id, btn){
  const s=M.m.steps[M.cur];
  if(s.codes.includes(id) && !M.filled[M.cur].includes(id)){
    M.filled[M.cur].push(id); sOk(); petGain(id, btn);
    if(s.codes.every(c=>M.filled[M.cur].includes(c))){ M.cur++; autoAdvance(); }
    render();
  } else { heatUp(); btn.classList.add('wrong'); toast(id+' không khớp khâu này – thử thẻ khác'); setTimeout(render,350); }
}
function mStep4(el){
  const m=M.m, d=m.deep;
  const hasTac=d&&d.huong.some(h=>h.kq==='tac');
  const target=d?(hasTac?'tac':'duoc'):null;
  el.innerHTML=`${heatHTML()}<h3>Bước 4 · Kiểm định</h3>
    ${d?say(hasTac?'Các kỹ sư trước đã thử nhiều hướng. <b>Hướng nào dẫn tới bế tắc?</b> Đoán đúng được thưởng thêm 10 tinh thể.':'Có nhiều hướng giải. <b>Chọn một hướng đi được</b> để mở báo cáo kiểm định (thưởng 10 tinh thể).'):''}
    <div class="deep">${d?d.huong.map((h,i)=>{ const rv=M.deepPick!==null; return `<button class="opt ${rv?'rv':''}" data-h="${i}">
      <b>${esc(h.ten)}</b>${rv?`<span class="kq ${h.kq}">${{tac:'BẾ TẮC',dai:'DÀI',duoc:'ĐI ĐƯỢC'}[h.kq]}</span><span class="math" style="font-size:13.5px">${h.y.map(esc).join('<br>')}</span>`:''}</button>`; }).join(''):''}</div>
    ${M.deepPick!==null||!d?`<div class="qa"><div class="r"><span class="lab">NHÌN LẠI</span><span><span class="q">${esc(m.nhin)}</span><br><span class="a">${esc(m.nhinDap)}</span></span></div></div>
      <div class="row"><span class="sp"></span><button class="btn amb" id="fin">Xuất linh kiện</button></div>`:''}`;
  if(d&&M.deepPick===null) el.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ const h=d.huong[+b.dataset.h]; M.deepPick=+b.dataset.h; M.deepOk=h.kq===target; if(M.deepOk) sOk(); else sBad(); render(); });
  const f=$('#fin'); if(f) f.onclick=finish;
}
function finish(){
  const m=M.m; const st=starsNow(); const prev=S.done[m.id];
  let gain=30+st*10+(M.deepOk?10:0);
  if(prev) gain=Math.round(gain/3);
  S.gems+=gain;
  S.done[m.id]={ stars: Math.max(st, prev?prev.stars:0) };
  const newB=[];
  if(m.loai==='lab'&&!prev) (m.btp||[]).forEach(n=>{ const id='B'+n; if(!own(id)){ newB.push(id);} S.cards[id]=(S.cards[id]||0)+1; });
  save(); sWin();
  const boostOwned=(m.boost||[]).filter(own);
  const parts=Array.from({length:18},(_,i)=>{ const an=i/18*6.283, r=90+Math.random()*60; return `<i style="--dx:${Math.cos(an)*r}px;--dy:${Math.sin(an)*r}px;background:${['#ffb547','#6fe3f5','#ffd27a','#5fe0a0'][i%4]}"></i>`; }).join('');
  overlay(`<div class="burst">${parts}</div><div class="eyebrow">Mô-đun ${m.id} hoạt động trở lại</div>
    <div class="product"><div class="eyebrow">Linh kiện đã chế tạo</div><div class="kl">${esc(m.kl)}</div><div style="margin-top:6px">${stars(st)}</div></div>
    <div class="row"><span class="gem"></span><b>+${gain}</b> tinh thể${prev?' (chơi lại)':''}${M.deepOk?' · thưởng kiểm định':''}</div>
    ${m.layer?`<div class="eyebrow">Máy quét tách lớp</div><div class="scan"><img src="${m.layer.fig}" alt="Tách lớp hình bài ${m.id}"></div><p class="muted" style="margin:0;font-size:13px">${esc(m.layer.cap)}</p>${say(esc(m.layer.rut))}`:''}
    ${newB.length?`<div class="eyebrow">Bản thiết kế huyền thoại</div><div class="pack">${newB.map(id=>cardHTML(CARD[id],{noCount:true})).join('')}</div>`:''}
    ${!m.layer&&boostOwned.length?say('Linh kiện này dùng cấu trúc của '+boostOwned.map(badge).join(' ')+' – bản thiết kế bạn đã có.'):''}
    ${(S.so&&S.so[m.id]&&S.so[m.id].length)?say('Em đã lưu '+S.so[m.id].length+' cách của mình cho bài này trong Sổ cách giải.'):`<div class="gvnote">Đây chỉ là một trong các hướng làm gợi ý. Em còn cách khác? <button class="btn sm amb" id="myway">Ghi cách của em</button></div>`}
    ${Object.keys(S.done).length===G.missions.length?say('Cả 42 mô-đun đã chạy. Lõi Suy Luận khởi động lại – ORTHOS tiếp tục hành trình. Cảm ơn kỹ sư!'):''}
    <div class="row"><span class="sp"></span><button class="btn pri" id="ok">Về khoang</button></div>`, !!m.layer);
  $('#ok').onclick=()=>{ closeOv(); const z=m.loai==='lab'?'lab':m.loai==='train'?'train':'ch'+m.ch; M=null; go({v:'zone', z}); };
  const mw=$('#myway'); if(mw) mw.onclick=()=>{ closeOv(); M.step=3; M.mode='em'; M.altDone=false; render(); };
}

// ---------- khởi động
function start(data){
  try{ sky(); }catch(e){}
  load(); if(data&&data.S) S=data.S;
  if(data&&data.VIEW) VIEW=data.VIEW;
  if(data&&data.M && MIS[data.M.id]) { M=data.M; M.m=MIS[data.M.id]; }
  $('#home').onclick=()=>{ M=null; go({v:'map'}); };
  $('#home').onkeydown=e=>{ if(e.key==='Enter') $('#home').onclick(); };
  $('#bCards').onclick=()=>{ M=null; go({v:'cards'}); };
  $('#bShop').onclick=shop;
  $('#bGV').onclick=gvPanel;
  $('#bSnd').onclick=()=>{ S.snd=!S.snd; save(); hud(); if(S.snd) sOk(); };
  const actx=()=>{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; };
  $('#bMus').onclick=()=>{ S.music=!S.music; save(); hud(); try{ if(S.music) musicStart(actx()); else musicStop(); }catch(e){} };
  if(S.music){ const once=()=>{ try{ musicStart(actx()); }catch(e){} removeEventListener('pointerdown',once); }; addEventListener('pointerdown',once); }
  if(VIEW.v==='mis'&&!M) VIEW={v:'map'};
  render();
  if(!S.intro) story(0);
}
window.claude?.hot?.snapshot?.(() => ({ S, VIEW, M: M?Object.assign({}, M, { m: undefined }):null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
