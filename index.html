điểm của đoạn đó.","mau":"#134E4A","rar":4},{"id":"B4","nhom":"B","nhomTen":"BÀI TOÁN PHỤ","ten":"Ba tiếp tuyến","khi":"Đường kính AB, tiếp tuyến tại A, B, M; MH ⊥ AB.","ra":"C là trung điểm AE; BC, AD đi qua trung điểm của MH.","mau":"#134E4A","rar":4},{"id":"B5","nhom":"B","nhomTen":"BÀI TOÁN PHỤ","ten":"Hai tiếp tuyến và đường kính","khi":"Hai tiếp tuyến AB, AC và đường kính BD.","ra":"DC cắt BA tại P thì A là trung điểm của BP.","mau":"#134E4A","rar":4},{"id":"B6","nhom":"B","nhomTen":"BÀI TOÁN PHỤ","ten":"Hai trung tuyến tương ứng","khi":"Cặp tam giác đồng dạng có trung điểm trên một cạnh.","ra":"Hai trung tuyến tương ứng tạo ra cặp tam giác đồng dạng mới (và chiều đảo; nhân đôi – chia đôi).","mau":"#134E4A","rar":4},{"id":"B7","nhom":"B","nhomTen":"BÀI TOÁN PHỤ","ten":"Hai tam giác đồng dạng chung đỉnh","khi":"Hai tam giác đồng dạng có chung một đỉnh.","ra":"Ghép “theo cột” được cặp tam giác đồng dạng mới.","mau":"#134E4A","rar":4}],"missions":[{"boost":[],"id":"2.4","ch":2,"truong":"Bát Tràng","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A (AB < AC).","a) Khi AB = 6 cm, ∠ABC = 53°. Giải tam giác vuông ABC (làm tròn kết quả độ dài đến chữ số thập phân thứ hai; số đo góc làm tròn đến độ).","b) Kẻ đường cao AH (H ∈ BC) của tam giác ABC. Chứng minh: BC = AB.cos∠ABC + AC.cos∠ACB.","c) Kẻ phân giác BD của ∠ABC (D ∈ AC). Gọi K là giao điểm của BD và AH. Chứng minh: KH = AK.sin∠ACB.","d) Gọi M là hình chiếu của C trên đường thẳng BD. Qua M kẻ đường thẳng vuông góc với AC, đường thẳng này cắt BC tại I. Chứng minh: I là trung điểm của BC."],"yl":"d","yc":"Gọi M là hình chiếu của C trên đường thẳng BD. Qua M kẻ đường thẳng vuông góc với AC, đường thẳng này cắt BC tại I. Chứng minh: I là trung điểm của BC.","kl":"I là trung điểm BC","hinh":"img/b2.4.png","huong":"IB = IM và IM = IC.","giu":"Ý b, c không cần dùng; giữ lại giả thiết BD là tia phân giác và AB ⊥ AC.","noi":"∆IBM cân tại I (∠IMB = ∠ABM = ∠IBM) và ∆IMC cân tại I (∠IMC = ∠ICM).","nhin":"Nếu BD không phải tia phân giác thì I còn là trung điểm của BC không? Giả thiết đó dùng ở bước nào?","nhinDap":"Không: cần ∠IMB = ∠IBM, có được nhờ BD là tia phân giác (cùng với góc so le trong khi MI // AB).","deep":{"huong":[{"ten":"Hai tam giác cân","kq":"duoc","y":["MI // AB ⇒ ∠IMB = ∠ABM = ∠IBM ⇒ IB = IM.","∆BMC vuông tại M ⇒ ∠IMC = ∠ICM ⇒ IM = IC."]},{"ten":"Điểm trùng","kq":"duoc","y":["Gọi I' là trung điểm BC ⇒ I'M = I'B ⇒ ∠I'MB = ∠I'BM = ∠ABM ⇒ MI' // AB ⇒ MI' ⊥ AC ⇒ I' trùng I."]},{"ten":"Kéo dài CM, đường trung bình","kq":"duoc","y":["Kéo dài CM cắt BA tại P. BM vừa là phân giác vừa là đường cao của ∆BCP ⇒ ∆BCP cân tại B ⇒ M là trung điểm CP.","MI // PB (cùng vuông góc với AC) ⇒ I là trung điểm BC."]}],"binh":["Cả ba hướng đều ngắn. Hướng 3 rèn một phản xạ quan trọng: thấy “phân giác + vuông góc với phân giác” thì kéo dài để có tam giác cân."]},"loai":"train","gt":["∆ABC vuông tại A","BD là tia phân giác của ∠ABC (D ∈ AC)","CM ⊥ BD tại M","MI ⊥ AC (I ∈ BC)"],"inputs":[{"code":"P3","text":"MI ⊥ AC và AB ⊥ AC → MI // AB","keep":1},{"code":"G5","text":"MI // AB → ∠IMB = ∠ABM (so le trong)","keep":1},{"code":"G8","text":"BD là tia phân giác → ∠ABM = ∠MBI","keep":1},{"code":"P5","text":"BD là phân giác, K = BD ∩ AH → KH/KA = BH/BA","keep":0,"why":"Đó là ý c; ý d không có điểm K."},{"code":"G7","text":"∆BMC vuông tại M → ∠IMB + ∠IMC = 90°, ∠IBM + ∠ICM = 90°","keep":1},{"code":"V2","text":"∆BMC vuông, I ∈ BC → nếu I là trung điểm thì IM = IB = IC","keep":0,"why":"Dùng chính điều phải chứng minh."},{"code":"","text":"Ý b: BC = AB.cos∠ABC + AC.cos∠ACB","keep":0,"why":"Không nói gì về điểm I."},{"code":"K2","text":"Kết luận “I là trung điểm BC” → đổi thành IB = IM và IM = IC","keep":1}],"steps":[{"cm":"MI // AB","ld":"MI ⊥ AC, AB ⊥ AC","codes":["P3"]},{"cm":"∠IMB = ∠ABM","ld":"So le trong, MI // AB","codes":["G5"]},{"cm":"∠ABM = ∠IBM","ld":"BD là tia phân giác của ∠ABC","codes":["G8"]},{"cm":"∠IMB = ∠IBM ⇒ ∆IBM cân tại I ⇒ IB = IM","ld":"Từ 2 và 3; tam giác có hai góc bằng nhau","codes":["G6"]},{"cm":"∠IMC = 90° − ∠IMB; ∠ICM = 90° − ∠IBM","ld":"∆BMC vuông tại M (CM ⊥ BD)","codes":["G7"]},{"cm":"∠IMC = ∠ICM ⇒ ∆IMC cân tại I ⇒ IM = IC","ld":"Từ 4 và 5: phụ với hai góc bằng nhau","codes":["G4","G6"]},{"cm":"IB = IC, mà I ∈ BC ⇒ I là trung điểm của BC","ld":"Từ 4 và 6","codes":["K2"]}]},{"boost":["B1"],"id":"4.9","ch":4,"truong":"Xuân Đỉnh","ky":"cuối HKII","de":["Cho đường tròn (O; R) và một điểm A nằm ngoài đường tròn (O; R) và OA > 2R. Từ A vẽ hai tiếp tuyến AB và AC của đường tròn (O; R) với (B, C là tiếp điểm). Gọi H là giao điểm của OA và BC. Tia AO cắt đường tròn (O; R) tại M và N (M nằm giữa A và N).","a) Chứng minh tứ giác ABOC nội tiếp.","b) Chứng minh AO vuông góc với BC và AM.AN = AB².","c) Kẻ đường kính BD. Đường thẳng qua C và vuông góc với BD cắt tia AO tại K. Gọi T là giao điểm của AC và KD. Chứng minh HT song song với BD."],"yl":"c","yc":"Kẻ đường kính BD. Đường thẳng qua C và vuông góc với BD cắt tia AO tại K. Gọi T là giao điểm của AC và KD. Chứng minh HT song song với BD.","kl":"HT // BD","hinh":"img/b4.9.png","huong":"TH đi qua trung điểm P của CD, và HP là đường trung bình của ∆BCD.","giu":"AO ⊥ BC tại trung điểm H của BC.","noi":"ABKC là hình thoi (CK // AB, CK = CA = AB) nên H là trung điểm AK. T là giao điểm hai cạnh bên của hình thang ACDK.","nhin":"Viết lại phát biểu bổ đề hình thang với tên điểm của bài này.","nhinDap":"“Hình thang ACDK (AK // CD) có hai cạnh bên AC, KD cắt nhau tại T thì T, trung điểm H của AK và trung điểm P của CD thẳng hàng.”","deep":{"huong":[{"ten":"Góc so le","kq":"tac","y":["Cần ∠THC = ∠DBC; T chỉ là giao điểm, không có góc nào tại T."]},{"ten":"Hệ quả bổ đề hình thang","kq":"duoc","y":["ABKC là hình thoi ⇒ H là trung điểm AK.","Hình thang ACDK (AK // CD), T = AC ∩ KD ⇒ T, H, P thẳng hàng (P trung điểm CD) ⇒ HT // BD."]}],"binh":["Song song được đổi thành “đường trung bình”, rồi thành “thẳng hàng với trung điểm”, rồi nhận ra hình thang ẩn ACDK. Bổ đề hình thang là công cụ duy nhất nối giao điểm hai cạnh bên với trung điểm hai đáy."]},"loai":"lab","so":1,"gt":["(O; R), A nằm ngoài (O), OA > 2R","AB, AC là tiếp tuyến; H = OA ∩ BC","Tia AO cắt (O) tại M, N","BD là đường kính; CK ⊥ BD, K ∈ tia AO","T = AC ∩ KD"],"dg":"chứng minh đường thẳng HT song song với BD.","inputs":[{"code":"T2","text":"AB, AC là tiếp tuyến → AB = AC; AO là tia phân giác của ∠BAC; AO ⊥ BC tại trung điểm H của BC","keep":1,"why":""},{"code":"T1, P3","text":"AB ⊥ BD (tiếp tuyến), CK ⊥ BD → CK // AB","keep":1,"why":""},{"code":"G5, G6","text":"CK // AB, AO là phân giác → ∠CKA = ∠KAB = ∠KAC ⇒ ∆ACK cân tại C ⇒ CK = CA = AB","keep":1,"why":""},{"code":"P4","text":"CK // AB, CK = AB, AB = AC → ABKC là hình thoi ⇒ H là trung điểm của AK","keep":1,"why":""},{"code":"G2","text":"BD là đường kính → ∠BCD = 90° ⇒ CD ⊥ BC ⇒ CD // AK","keep":1,"why":""},{"code":"P2","text":"H, P là trung điểm của BC, CD → HP // BD","keep":1,"why":""},{"code":"S2","text":"Ý b: AM.AN = AB² → một hệ thức độ dài trên AO","keep":0,"why":"không cho góc hay trung điểm nào trên KD."},{"code":"N3","text":"Ý a: ABOC nội tiếp → các cặp góc nội tiếp đường tròn đường kính AO","keep":0,"why":"đường tròn này không chứa T, D."},{"code":"K4","text":"Kết luận HT // BD → Đổi thành: T, H, P thẳng hàng (vì HP // BD)","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"Có sẵn đường nào qua H song song với BD không?","a":"H là trung điểm BC; lấy P là trung điểm CD thì HP // BD (đường trung bình). Chỉ cần T, H, P thẳng hàng."},{"lab":"GIỮ LẠI","q":"T là giao điểm của AC và KD. Hai đường này là gì của một hình quen?","a":"CD // AK (cùng vuông góc với BC): ACDK là hình thang, AC và KD là hai cạnh bên. Ý a, b không cần: bỏ."},{"lab":"CẦU NỐI","q":"Đường thẳng qua giao điểm hai cạnh bên của hình thang có tính chất gì?","a":"Nó đi qua trung điểm của hai đáy. P là trung điểm CD; còn cần H là trung điểm AK: chứng minh ABKC là hình thoi."}],"steps":[{"cm":"CK // AB","ld":"AB ⊥ BD (tiếp tuyến), CK ⊥ BD","codes":["T1","P3"]},{"cm":"∠CKA = ∠KAB = ∠KAC","ld":"So le trong (CK // AB); AO là tia phân giác của ∠BAC","codes":["G5","T2"]},{"cm":"∆ACK cân tại C ⇒ CK = CA = AB","ld":"Từ 2; AB = AC","codes":["G6","T2"]},{"cm":"ABKC là hình thoi ⇒ H là trung điểm của AK","ld":"CK // AB, CK = AB, AB = AC; hai đường chéo cắt nhau tại trung điểm mỗi đường","codes":["P4"]},{"cm":"CD ⊥ BC ⇒ CD // AK","ld":"∠BCD = 90° (chắn nửa đường tròn); AK ⊥ BC","codes":["G2","P3"]},{"cm":"Gọi P là trung điểm CD. Ba điểm T, H, P thẳng hàng","ld":"Hình thang ACDK có hai cạnh bên cắt nhau tại T; H, P là trung điểm hai đáy (chứng minh ở mục Rút ra)","codes":[]},{"cm":"HP // BD","ld":"H, P là trung điểm của BC, CD","codes":["P2"]},{"cm":"HT // BD","ld":"Từ 6 và 7","codes":["K4"]}],"btp":[1],"layer":{"fig":"img/L49.png","cap":"Che đường tròn và các tiếp tuyến, chỉ giữ hình thang ACDK và giao điểm T của hai cạnh bên.","rut":"Lớp tách ra là một hình thang có hai cạnh bên cắt nhau. Đường thẳng nối giao điểm đó với trung điểm một đáy đi qua trung điểm đáy kia. Ghi thành bài toán phụ 1."}},{"boost":["B6","B1","B2"],"id":"1.2","ch":1,"truong":"Văn Yên","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A, đường cao AH (H thuộc BC).","a) Giả sử AB = 9 cm, tan C = 3/4. Giải tam giác ABC (số đo góc làm tròn đến độ).","b) Gọi M và N lần lượt là chân các đường vuông góc kẻ từ điểm H đến các đường thẳng AB và AC. Chứng minh rằng HN.AC = HA.HC và HN = AB.sin²B.","c) Đường thẳng đi qua điểm A và song song với đường thẳng MN cắt đường thẳng đi qua điểm C và song song với đường thẳng AH tại điểm K. Gọi I là giao điểm của AH và BK. Chứng minh ba điểm M, I, N thẳng hàng."],"yl":"c","yc":"Đường thẳng đi qua điểm A và song song với đường thẳng MN cắt đường thẳng đi qua điểm C và song song với đường thẳng AH tại điểm K. Gọi I là giao điểm của AH và BK. Chứng minh ba điểm M, I, N thẳng hàng.","kl":"M, I, N thẳng hàng","hinh":"img/b1.2.png","huong":"I là trung điểm của AH.","giu":"Từ các hệ thức ở ý b: AM.AB = AN.AC = AH², nên ∆ANM ∽ ∆ABC và ∠ANM = ∠ABC.","noi":"MN đi qua trung điểm của AH (hai đường chéo của hình chữ nhật AMHN). Đổi kết luận thành: I là trung điểm của AH.","nhin":"So sánh với Bài 1: điểm I ở đây và điểm O ở Bài 1 có gì giống nhau?","nhinDap":"Ở cả hai bài, điểm cần tìm là giao điểm của AH với BK và chính là trung điểm của AH, nằm trên MN – cùng một ý “điểm trùng”.","deep":{"huong":[{"ten":"Góc bẹt tại I","kq":"tac","y":["Thử chứng minh ∠MIA + ∠AIN = 180°. Góc tại I phụ thuộc đường BK, mà về BK ta chưa biết góc nào."]},{"ten":"Đổi sang trung điểm, dùng bài toán phụ 2","kq":"duoc","y":["MN đi qua trung điểm AH ⇒ chỉ cần I là trung điểm AH.","∠KAC = ∠ANM = ∠ABC = ∠KCA ⇒ KA = KC; ∆APC vuông tại A ⇒ KA = KP ⇒ K là trung điểm PC.","Trong ∆BPC, BK là trung tuyến, AH // PC ⇒ I là trung điểm AH (bài toán phụ 2)."]}],"binh":["“MN đi qua trung điểm của AH” là bước đổi kết luận từ thẳng hàng sang trung điểm (Chương 0, §6). Sau bước đổi đó, bài toán phụ 2 chỉ đường cho bước tiếp theo: phải dựng P để có tam giác BPC nhận BK làm trung tuyến.","Nếu không biết bài toán phụ 2, học sinh vẫn có thể dùng hai lần hệ quả Thales, nhưng sẽ khó nghĩ ra việc dựng P."]},"loai":"lab","so":2,"gt":["∆ABC vuông tại A, đường cao AH","HM ⊥ AB, HN ⊥ AC","AK // MN, CK // AH","I = AH ∩ BK"],"dg":"chứng minh BK đi qua trung điểm của AH.","inputs":[{"code":"V5","text":"HM ⊥ AB, HN ⊥ AC, ∠BAC = 90° → AMHN là hình chữ nhật ⇒ MN đi qua trung điểm của AH","keep":1,"why":""},{"code":"V1","text":"∆AHB, ∆AHC vuông có đường cao HM, HN → AM.AB = AH² = AN.AC","keep":1,"why":""},{"code":"S2, S1","text":"AM.AB = AN.AC → ∆ANM ∽ ∆ABC ⇒ ∠ANM = ∠ABC","keep":1,"why":""},{"code":"G5","text":"AK // MN → ∠KAC = ∠ANM (so le trong)","keep":1,"why":""},{"code":"P3, G7","text":"CK // AH, AH ⊥ BC → CK ⊥ BC ⇒ ∠KCA = 90° − ∠ACB = ∠ABC","keep":1,"why":""},{"code":"G6","text":"∠KAC = ∠KCA → ∆KAC cân tại K ⇒ KA = KC","keep":1,"why":""},{"code":"G7, G6","text":"P = BA ∩ CK; ∆APC vuông tại A → ∠KAP = ∠KPA ⇒ KA = KP ⇒ K là trung điểm PC","keep":1,"why":""},{"code":"P1","text":"AH // PC → AI/PK = BI/BK = IH/KC","keep":1,"why":""},{"code":"V3","text":"Ý b: HN = AB.sin²B → một độ dài","keep":0,"why":"cần góc, không cần độ dài."},{"code":"K1","text":"Kết luận M, I, N thẳng hàng → Điểm trùng: chứng minh I là trung điểm của AH","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"MN đã đi qua điểm đặc biệt nào?","a":"Trung điểm của AH (tâm hình chữ nhật AMHN). Đổi kết luận thành: I là trung điểm của AH."},{"lab":"GIỮ LẠI","q":"Cần loại thông tin gì? Ý b cho hệ thức nào có ích?","a":"Cần một góc để dùng AK // MN. Giữ AM.AB = AN.AC ⇒ ∠ANM = ∠ABC; bỏ HN = AB.sin²B."},{"lab":"CẦU NỐI","q":"I nằm trên BK, còn AH // CK. Tam giác nào nhận BK làm trung tuyến?","a":"Kéo dài BA cắt CK tại P. Nếu K là trung điểm PC thì trung tuyến BK chia đôi đoạn AH song song với PC."}],"steps":[{"cm":"AMHN là hình chữ nhật ⇒ AH, MN cắt nhau tại trung điểm mỗi đường","ld":"Tứ giác có ba góc vuông","codes":["V5"]},{"cm":"AM.AB = AH² = AN.AC ⇒ AN/AB = AM/AC","ld":"Hệ thức lượng trong ∆AHB, ∆AHC vuông tại H","codes":["V1"]},{"cm":"∆ANM ∽ ∆ABC ⇒ ∠ANM = ∠ABC","ld":"∠BAC chung; từ 2 (c.g.c)","codes":["S1"]},{"cm":"∠KAC = ∠ANM = ∠ABC","ld":"So le trong, AK // MN; từ 3","codes":["G5"]},{"cm":"∠KCA = 90° − ∠ACB = ∠ABC","ld":"CK // AH, AH ⊥ BC ⇒ CK ⊥ BC","codes":["P3","G7"]},{"cm":"KA = KC","ld":"Từ 4 và 5: ∆KAC cân tại K","codes":["G6"]},{"cm":"Gọi P = BA ∩ CK: ∠KAP = 90° − ∠KAC = 90° − ∠KCA = ∠KPA ⇒ KA = KP","ld":"∆APC vuông tại A","codes":["G7","G6"]},{"cm":"KP = KC: K là trung điểm của PC","ld":"Từ 6 và 7","codes":[]},{"cm":"AI/PK = BI/BK = IH/KC ⇒ AI = IH","ld":"AH // PC, hệ quả định lí Thales; từ 8","codes":["P1"]},{"cm":"I là trung điểm AH nên I ∈ MN: M, I, N thẳng hàng","ld":"Từ 1 và 9","codes":["K1"]}],"btp":[2,3],"layer":{"fig":"img/L12.png","cap":"Che hình chữ nhật AMHN, chỉ giữ ∆BPC, đoạn AH song song với PC và đường BK.","rut":"Lớp tách ra: một tam giác, một đoạn song song với cạnh đáy và trung tuyến ứng với cạnh đáy. Trung tuyến chia đôi đoạn song song. Ghi thành bài toán phụ 2; hệ quả là bài toán phụ 3."}},{"boost":["B5","B2"],"id":"4.5","ch":4,"truong":"Ngọc Thụy","ky":"cuối HKI","de":["Cho đường tròn (O; R) và một điểm A nằm ngoài đường tròn (O; R). Từ A vẽ tiếp tuyến AB, tiếp tuyến AC của đường tròn (O; R) (B, C là tiếp điểm). Gọi H là giao điểm của OA và BC. Tia AO cắt đường tròn (O; R) tại M và N (M nằm giữa A và N).","a) Chứng minh rằng bốn điểm A, B, O, C cùng nằm trên một đường tròn.","b) Chứng minh: AO vuông góc với BC và AM.AN = AH.AO.","c) Kẻ đường kính BD, gọi E là chân đường vuông góc kẻ từ C đến BD, K là giao điểm của AD và CE. Chứng minh rằng: K là trung điểm của CE."],"yl":"c","yc":"Kẻ đường kính BD, gọi E là chân đường vuông góc kẻ từ C đến BD, K là giao điểm của AD và CE. Chứng minh rằng: K là trung điểm của CE.","kl":"K là trung điểm CE","hinh":"img/b4.5.png","huong":"Trung tuyến DA của ∆DBP chia đôi CE (bài toán phụ 2).","giu":"AO ⊥ BC; AB = AC.","noi":"CE // BA (cùng vuông góc với BD). Kéo dài DC cắt BA tại P thì A là trung điểm BP (bài toán phụ 5).","nhin":"Hai bài toán phụ nối tiếp nhau thế nào? Bài toán phụ nào cho kết quả để bài kia dùng?","nhinDap":"Bài toán phụ 5 cho A là trung điểm BP; bài toán phụ 2 dùng trung điểm đó để chia đôi CE.","deep":{"huong":[{"ten":"Hai tam giác bằng nhau chứa KE, KC","kq":"tac","y":["∆KED và ∆KC? – không có cặp nào có yếu tố bằng nhau."]},{"ten":"Bài toán phụ 5 rồi bài toán phụ 2","kq":"duoc","y":["P = DC ∩ BA ⇒ A là trung điểm BP (∆BCP vuông tại C, AB = AC).","CE // BP ⇒ EK/BA = DK/DA = KC/AP ⇒ EK = KC."]}],"binh":["Đây là bài có “hai bài toán phụ nối tiếp”. Không biết bài toán phụ 5, học sinh khó nghĩ ra việc kéo dài DC; không biết bài toán phụ 2, khó thấy cần một trung điểm trên BA."]},"loai":"lab","so":3,"gt":["(O; R), A nằm ngoài (O)","AB, AC là tiếp tuyến; H = OA ∩ BC","Tia AO cắt (O) tại M, N","BD là đường kính; CE ⊥ BD tại E","K = AD ∩ CE"],"dg":"chứng minh AD chia đôi đoạn CE.","inputs":[{"code":"T2","text":"AB, AC là tiếp tuyến → AB = AC ⇒ ∠ABC = ∠ACB","keep":1,"why":""},{"code":"G2","text":"BD là đường kính, C ∈ (O) → ∠BCD = 90°","keep":1,"why":""},{"code":"G7, G6","text":"P = DC ∩ BA; ∆BCP vuông tại C → ∠APC = 90° − ∠ABC = 90° − ∠ACB = ∠ACP ⇒ AP = AC = AB","keep":1,"why":""},{"code":"T1, P3","text":"CE ⊥ BD, AB ⊥ BD → CE // BP","keep":1,"why":""},{"code":"P1","text":"CE // BP → EK/BA = DK/DA = KC/AP","keep":1,"why":""},{"code":"V1","text":"Ý b: AM.AN = AH.AO → hệ thức độ dài trên AO","keep":0,"why":"K, E không nằm trên AO."},{"code":"T2","text":"Ý b: AO ⊥ BC → AO ⊥ BC tại H","keep":0,"why":"ý c không cần tới H."},{"code":"K2","text":"Kết luận K là trung điểm CE → Hai tỉ số Thales bằng nhau: EK/BA = KC/AP với BA = AP","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"CE song song với đường nào để dùng Thales?","a":"CE // AB (cùng vuông góc với BD). Thales cho EK/BA = DK/DA. Cần thêm một đoạn trên đường thẳng AB để so với KC."},{"lab":"GIỮ LẠI","q":"KC song song với AB. Đường thẳng DC cắt AB ở đâu?","a":"Gọi P = DC ∩ BA thì KC/AP = DK/DA. Chỉ cần A là trung điểm BP. Ý b không giúp: bỏ."},{"lab":"CẦU NỐI","q":"Vì sao A là trung điểm BP?","a":"∠BCP = 90° và AB = AC ⇒ ∆ACP cân tại A ⇒ AP = AC = AB."}],"steps":[{"cm":"AB = AC ⇒ ∠ABC = ∠ACB","ld":"Hai tiếp tuyến cắt nhau","codes":["T2","G6"]},{"cm":"∠BCD = 90°. Gọi P = DC ∩ BA thì ∆BCP vuông tại C","ld":"Góc nội tiếp chắn nửa đường tròn","codes":["G2"]},{"cm":"∠APC = 90° − ∠ABC = 90° − ∠ACB = ∠ACP ⇒ AP = AC","ld":"Từ 1 và 2","codes":["G7","G6"]},{"cm":"AB = AP: A là trung điểm của BP","ld":"Từ 1 và 3","codes":[]},{"cm":"CE // BP","ld":"CE ⊥ BD, AB ⊥ BD","codes":["T1","P3"]},{"cm":"EK/BA = DK/DA; KC/AP = DK/DA","ld":"Hệ quả định lí Thales trong ∆DBA, ∆DAP","codes":["P1"]},{"cm":"EK = KC: K là trung điểm của CE","ld":"Từ 4 và 6","codes":["K2"]}],"btp":[5],"layer":{"fig":"img/L45.png","cap":"Lớp 1: hai tiếp tuyến AB, AC và đường kính BD. Lớp 2: ∆DBP với đoạn CE song song với BP và trung tuyến DA.","rut":"Lớp 1 lặp lại ở rất nhiều bài: hai tiếp tuyến AB, AC và đường kính BD thì DC cắt BA tại P với A là trung điểm BP. Ghi thành bài toán phụ 5. Lớp 2 chính là bài toán phụ 2 đã có."}},{"boost":["B4","B2","B6"],"id":"5.5","ch":5,"truong":"Dịch Vọng","ky":"cuối HKI","de":["Cho nửa đường tròn (O; R), đường kính AB. Lấy điểm M bất kì thuộc nửa (O; R), tiếp tuyến tại A và M của nửa đường tròn (O; R) cắt nhau tại C (M, A là 2 tiếp điểm). Đoạn thẳng CB cắt nửa đường tròn tại K (K ≠ B).","a) Chứng minh: 4 điểm A, C, O, M cùng thuộc một đường tròn.","b) Chứng minh: ∆AKB vuông và BK.BC = 4R².","c) Gọi H là chân đường vuông góc hạ từ M xuống AB, I là trung điểm của MH. Chứng minh: ba điểm K, C, I thẳng hàng."],"yl":"c","yc":"Gọi H là chân đường vuông góc hạ từ M xuống AB, I là trung điểm của MH. Chứng minh: ba điểm K, C, I thẳng hàng.","kl":"K, C, I thẳng hàng","hinh":"img/b5.5.png","huong":"BC đi qua trung điểm I của MH.","giu":"∆AKB vuông tại K; BK.BC = 4R²; K nằm trên BC.","noi":"Kéo dài BM cắt AC tại E thì C là trung điểm của AE (bài toán phụ 4).","nhin":"So sánh với Nguyễn Bỉnh Khiêm (Bài 5.6): đâu là “tam giác có trung tuyến” trong mỗi bài?","nhinDap":"Dịch Vọng: ∆BAE với trung tuyến BC. Nguyễn Bỉnh Khiêm: ∆CBE với trung tuyến CD.","deep":{"huong":[{"ten":"Góc bẹt tại C","kq":"tac","y":["Cần ∠KCM + ∠MCI = 180°; I là trung điểm MH, không có góc nào tại C liên hệ với I."]},{"ten":"Bài toán phụ 4","kq":"duoc","y":["E = BM ∩ AC ⇒ CA = CE; MH // AE ⇒ BC đi qua trung điểm của MH ⇒ I nằm trên BC."]}],"binh":["Câu “K nằm trên BC” khiến kết luận trông như về K, nhưng thực chất là về đường BC. Đổi kết luận đúng chỗ là thấy ngay bài toán phụ."]},"loai":"lab","so":4,"gt":["Nửa (O; R), đường kính AB; M thuộc nửa đường tròn","Tiếp tuyến tại A và M cắt nhau tại C","CB cắt nửa đường tròn tại K","MH ⊥ AB; I là trung điểm MH"],"dg":"chứng minh BC đi qua trung điểm I của MH.","inputs":[{"code":"T2","text":"CA, CM là tiếp tuyến → CA = CM ⇒ ∠CAM = ∠CMA","keep":1,"why":""},{"code":"G2","text":"AB là đường kính, M ∈ (O) → ∠AMB = 90° ⇒ ∠AME = 90° (E = BM ∩ AC)","keep":1,"why":""},{"code":"G7, G6","text":"∆AME vuông tại M → ∠CEM = 90° − ∠CAM = 90° − ∠CMA = ∠CME ⇒ CE = CM","keep":1,"why":""},{"code":"T1, P3","text":"MH ⊥ AB, AE ⊥ AB → MH // AE","keep":1,"why":""},{"code":"P1","text":"MH // AE → HI'/AC = BI'/BC = I'M/CE (I' = BC ∩ MH)","keep":1,"why":""},{"code":"","text":"K ∈ CB → K, C, B thẳng hàng","keep":1,"why":""},{"code":"V1","text":"Ý b: BK.BC = 4R²; ∆AKB vuông → hệ thức độ dài","keep":0,"why":"chỉ cần biết K nằm trên BC."},{"code":"K1","text":"Kết luận K, C, I thẳng hàng → Đổi thành: I nằm trên BC (điểm trùng)","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"K, C đều nằm trên BC. Vậy kết luận nói gì về I?","a":"I nằm trên BC: BC đi qua trung điểm của MH."},{"lab":"GIỮ LẠI","q":"MH song song với đường nào đi qua C?","a":"MH // AC (cùng vuông góc với AB). Muốn đường từ B qua C chia đôi MH, cần C là trung điểm một đoạn trên AC: kéo dài BM cắt AC tại E. Ý b bỏ."},{"lab":"CẦU NỐI","q":"Vì sao C là trung điểm AE?","a":"CA = CM (tiếp tuyến) và ∆AME vuông tại M ⇒ CM = CE."}],"steps":[{"cm":"Gọi E = BM ∩ AC: ∠AME = 90°","ld":"∠AMB = 90° (góc nội tiếp chắn nửa đường tròn)","codes":["G2"]},{"cm":"CA = CM ⇒ ∠CAM = ∠CMA","ld":"Hai tiếp tuyến cắt nhau","codes":["T2","G6"]},{"cm":"∠CEM = 90° − ∠CAM = 90° − ∠CMA = ∠CME ⇒ CE = CM","ld":"∆AME vuông tại M; từ 2","codes":["G7","G6"]},{"cm":"CA = CE: C là trung điểm của AE","ld":"Từ 2 và 3","codes":[]},{"cm":"MH // AE","ld":"MH ⊥ AB, AE ⊥ AB","codes":["T1","P3"]},{"cm":"Gọi I' = BC ∩ MH: HI'/AC = BI'/BC = I'M/CE","ld":"Hệ quả định lí Thales trong ∆BAC, ∆BCE","codes":["P1"]},{"cm":"HI' = I'M ⇒ I' trùng I","ld":"Từ 4 và 6: I' là trung điểm của MH","codes":[]},{"cm":"I ∈ BC, K ∈ BC ⇒ K, C, I thẳng hàng","ld":"Từ 7","codes":["K1"]}],"btp":[4],"layer":{"fig":"img/L55.png","cap":"Lớp 1: tiếp tuyến tại A và M; BM cắt tiếp tuyến tại A ở E. Lớp 2: ∆BAE với MH song song với AE và đường BC.","rut":"Lớp 1: đường kính AB, tiếp tuyến tại A, tại M (và tại B) – gọi là “ba tiếp tuyến” – cho C là trung điểm AE; kết hợp lớp 2 (bài toán phụ 2) được BC, AD đi qua trung điểm MH. Ghi thành bài toán phụ 4."}},{"boost":["B6"],"id":"4.4","ch":4,"truong":"Ngọc Lâm","ky":"cuối HKI","de":["Cho đường tròn tâm O và điểm A nằm ngoài đường tròn, vẽ hai tiếp tuyến AB, AC (B, C là hai tiếp điểm). AO cắt BC tại H, vẽ đường kính BD.","a) Chứng minh bốn điểm A, B, O, C cùng thuộc một đường tròn.","b) Chứng minh AO vuông góc với BC tại H và CD // AO.","c) Gọi M là trung điểm của AH, BM cắt (O) tại N. Chứng minh D, H, N thẳng hàng."],"yl":"c","yc":"Gọi M là trung điểm của AH, BM cắt (O) tại N. Chứng minh D, H, N thẳng hàng.","kl":"D, H, N thẳng hàng","hinh":"img/b4.4.png","huong":"BM ⊥ DH (∠BN'D = 90° với N' = BM ∩ DH).","giu":"AO ⊥ BC tại H; CD // AO.","noi":"N là chân đường vuông góc hạ từ B xuống DH (∠BND = 90°). M, H là trung điểm của HA, CB – hai cạnh tương ứng của ∆BHA ∽ ∆DCB.","nhin":"Trong bài, điểm H có những vai nào? Kể đủ.","nhinDap":"H là giao điểm của OA và BC, trung điểm BC, chân đường cao của ∆ABO, và là đỉnh của cặp góc đối đỉnh trong lời giải.","deep":{"huong":[{"ten":"Góc bẹt tại H","kq":"tac","y":["Cần ∠DHC + ∠CHN = 180°; N là giao điểm với đường tròn, chưa có góc nào tại H liên hệ với N."]},{"ten":"Điểm trùng + bài toán phụ 6","kq":"duoc","y":["MH/HC = HB/CD (từ HB² = AH.OH) ⇒ ∆MHB ∽ ∆HCD ⇒ ∠HBM = ∠CDH ⇒ ∠BN'D = 90° ⇒ N' thuộc (O) ⇒ N' trùng N."]}],"binh":["Hai kỹ thuật kết hợp: “điểm trùng” để đổi kết luận, và bài toán phụ 6 để tìm cặp tam giác. Dấu hiệu bài toán phụ 6: M và H là trung điểm của hai cạnh HA, CB của cặp ∆BHA ∽ ∆DCB."]},"loai":"lab","so":5,"gt":["(O), A nằm ngoài (O)","AB, AC là tiếp tuyến; H = AO ∩ BC","BD là đường kính","M là trung điểm AH; BM cắt (O) tại N"],"dg":"chứng minh BM vuông góc với DH.","inputs":[{"code":"T2","text":"AB, AC là tiếp tuyến → AO ⊥ BC tại trung điểm H của BC","keep":1,"why":""},{"code":"V1","text":"∆ABO vuông tại B, đường cao BH → HB² = AH.OH","keep":1,"why":""},{"code":"G2","text":"BD là đường kính → ∠BCD = 90°; điểm nhìn BD dưới góc vuông thì nằm trên (O)","keep":1,"why":""},{"code":"P2","text":"H, O là trung điểm của BC, BD → CD // OH; CD = 2OH","keep":1,"why":""},{"code":"K6","text":"MH = AH/2, HC = HB, CD = 2OH → MH/HC = AH/(2HB) = HB/(2OH) = HB/CD","keep":1,"why":""},{"code":"S1","text":"∠MHB = ∠HCD = 90° → ∆MHB ∽ ∆HCD (c.g.c) ⇒ ∠HBM = ∠CDH","keep":1,"why":""},{"code":"N1","text":"Ý a: A, B, O, C cùng thuộc một đường tròn → đường tròn đường kính AO","keep":0,"why":"không chứa M, N, D."},{"code":"K1","text":"Kết luận D, H, N thẳng hàng → Điểm trùng: gọi N' = BM ∩ DH, chứng minh ∠BN'D = 90°","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"N nằm trên (O), BD là đường kính. Đổi “D, H, N thẳng hàng” thành gì?","a":"Gọi N' = BM ∩ DH. Nếu ∠BN'D = 90° thì N' nằm trên (O), nên N' trùng N. Cần: BM ⊥ DH."},{"lab":"GIỮ LẠI","q":"Muốn BM ⊥ DH cần góc nào? Ý b cho gì?","a":"Cần ∠HBM = ∠CDH (∠BHN' = ∠CHD đối đỉnh). Ý b cho CD // AO ⇒ CD = 2OH: giữ."},{"lab":"CẦU NỐI","q":"Hai góc ∠HBM, ∠CDH nằm trong hai tam giác nào?","a":"∆MHB và ∆HCD: vuông tại H và C; cần MH/HC = HB/CD, có từ HB² = AH.OH."}],"steps":[{"cm":"AO ⊥ BC tại H, H là trung điểm của BC","ld":"AB = AC, OB = OC: AO là trung trực của BC","codes":["T2"]},{"cm":"HB² = AH.OH","ld":"Hệ thức lượng trong ∆ABO vuông tại B, đường cao BH","codes":["V1"]},{"cm":"CD = 2OH","ld":"OH là đường trung bình của ∆BCD","codes":["P2"]},{"cm":"MH/HC = AH/(2HB) = HB/(2OH) = HB/CD","ld":"MH = AH/2, HC = HB; từ 2 và 3","codes":[]},{"cm":"∆MHB ∽ ∆HCD ⇒ ∠HBM = ∠CDH","ld":"∠MHB = ∠HCD = 90°; từ 4 (c.g.c)","codes":["G2","S1"]},{"cm":"Gọi N' = BM ∩ DH: ∠HBN' + ∠BHN' = ∠CDH + ∠CHD = 90° ⇒ ∠BN'D = 90°","ld":"∠BHN' = ∠CHD (đối đỉnh); ∆HCD vuông tại C","codes":["G7"]},{"cm":"N' thuộc (O) và N' ∈ BM nên N' trùng N. Vậy D, H, N thẳng hàng","ld":"N' nhìn đường kính BD dưới góc vuông","codes":["N1","K1"]}],"btp":[6],"layer":{"fig":"img/L44.png","cap":"Che các tiếp tuyến và đường tròn, chỉ giữ ∆BHA và ∆DCB cùng hai đường BM, DH.","rut":"Hai tam giác vuông ∆BHA ∽ ∆DCB. M, H là trung điểm của hai cạnh tương ứng HA, CB. Hai trung tuyến tương ứng BM, DH tạo ra cặp đồng dạng mới ∆BHM ∽ ∆DCH – đúng điều dòng 5 đã chứng minh bằng tỉ số. Ghi thành bài toán phụ 6."}},{"boost":["B6"],"id":"3.10","ch":3,"truong":"Vào 10 Hà Nội 2025","ky":"vào 10","de":["Cho tam giác ABC có ba góc nhọn (AB < AC), nội tiếp đường tròn (O). Đường cao AD của tam giác ABC cắt đường tròn (O) tại điểm E (E khác A). Gọi K là chân đường vuông góc kẻ từ điểm E đến đường thẳng AB.","a) Chứng minh bốn điểm E, D, B, K cùng thuộc một đường tròn.","b) Đường thẳng AO cắt đường thẳng BC tại điểm S. Chứng minh EA là tia phân giác của góc CEK và AB.AC = AE.AS.","c) Gọi H là trực tâm của tam giác ABC và I là trung điểm của đoạn thẳng AB. Chứng minh đường thẳng SI vuông góc với đường thẳng HK."],"yl":"c","yc":"Gọi H là trực tâm của tam giác ABC và I là trung điểm của đoạn thẳng AB. Chứng minh đường thẳng SI vuông góc với đường thẳng HK.","kl":"SI ⊥ HK","hinh":"img/b3.10.png","huong":"∠HKE = ∠SIB, rồi tính góc tại giao điểm của HK và SI.","giu":"EA là tia phân giác của ∠CEK; ∠EAB = ∠CAS; ∠AEK = ∠ABC.","noi":"D là trung điểm của HE. Từ ∆DKE ∽ ∆SAB, nhân đôi DE thành HE và chia đôi AB thành BI được ∆HEK ∽ ∆SBI.","nhin":"So sánh với Trưng Vương (Bài 3.9): hai bài có chung ý tưởng nào?","nhinDap":"Cùng ý “nhân đôi – chia đôi” (bài toán phụ 6) để được cặp tam giác có hai cạnh tương ứng vuông góc.","deep":{"huong":[{"ten":"Tính trực tiếp góc tại giao điểm","kq":"tac","y":["S và I nằm xa H, K; không có tứ giác nội tiếp nào chứa cả bốn điểm."]},{"ten":"Nhân đôi DE thành HE, chia đôi AB thành BI","kq":"duoc","y":["D là trung điểm HE; ∆DKE ∽ ∆SAB ⇒ HE/SB = KE/BI ⇒ ∆HEK ∽ ∆SBI ⇒ ∠HKE = ∠SIB ⇒ SI ⊥ HK."]}],"binh":["Bài vào 10 năm 2025 và Bài 3.9 (Trưng Vương) có chung ý tưởng. Việc phát hiện D là trung điểm HE (điểm nhiều vai) là chìa khóa để thấy cặp “nhân đôi – chia đôi”."]},"loai":"lab","so":6,"gt":["∆ABC nhọn (AB < AC) nội tiếp (O)","Đường cao AD cắt (O) tại E","EK ⊥ AB; S = AO ∩ BC","H là trực tâm; I là trung điểm AB"],"dg":"chứng minh góc giữa SI và HK bằng 90°.","inputs":[{"code":"Q1, G1","text":"H trực tâm; ∠BAE = ∠BCE (cùng chắn cung BE) → ∠HCD = ∠ECD ⇒ ∆CHE cân tại C ⇒ D là trung điểm HE","keep":1,"why":""},{"code":"N3","text":"Ý a: BDEK nội tiếp → ∠DKE = ∠DBE","keep":1,"why":""},{"code":"G1","text":"∠DBE = ∠CBE = ∠CAE → ∠DKE = ∠CAD = ∠SAB (vì ∠EAB = ∠CAS, ý b)","keep":1,"why":""},{"code":"","text":"Ý b: ∠AEK = ∠ABC → ∠DEK = ∠SBA","keep":1,"why":""},{"code":"S1","text":"Hai góc bằng nhau → ∆DKE ∽ ∆SAB ⇒ DE/SB = KE/AB","keep":1,"why":""},{"code":"K6","text":"HE = 2DE, AB = 2BI → HE/SB = KE/BI","keep":1,"why":""},{"code":"S2","text":"Ý b: AB.AC = AE.AS → hệ thức tích","keep":0,"why":"chỉ cần dạng góc ∠EAB = ∠CAS."},{"code":"K3","text":"Kết luận SI ⊥ HK → Đổi thành: ∠XKI + ∠XIK = 90° (X = HK ∩ SI)","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"SI và HK tạo góc với đường nào đã biết vuông góc?","a":"EK ⊥ AB. Nếu ∠HKE = ∠SIB thì tại X = HK ∩ SI có ∠XKI + ∠XIK = 90°. Cần: ∆HEK ∽ ∆SBI."},{"lab":"GIỮ LẠI","q":"Ý b cho góc nào để ghép các cạnh EK, ED với AB, SB?","a":"∠AEK = ∠ABC và ∠EAB = ∠CAS: đủ để có ∆DKE ∽ ∆SAB. Bỏ hệ thức tích."},{"lab":"CẦU NỐI","q":"Từ ∆DKE ∽ ∆SAB đến ∆HEK ∽ ∆SBI, cạnh nào thay đổi?","a":"D là trung điểm HE (nhân đôi DE); I là trung điểm AB (chia đôi AB). Đó là dạng nhân đôi – chia đôi."}],"steps":[{"cm":"∠HCD = ∠HAB = ∠BCE ⇒ ∆CHE cân tại C ⇒ D là trung điểm của HE","ld":"H là trực tâm (cùng phụ ∠ABC); cùng chắn cung BE; CD vừa là đường cao vừa là phân giác","codes":["Q1","G4","G1","G6"]},{"cm":"∠DKE = ∠DBE = ∠CAE = ∠CAD","ld":"BDEK nội tiếp (ý a); cùng chắn cung CE","codes":["N3","G1"]},{"cm":"∠SAB = ∠CAD ⇒ ∠DKE = ∠SAB","ld":"Ý b: ∠EAB = ∠CAS","codes":[]},{"cm":"∠DEK = ∠AEK = ∠ABC = ∠SBA","ld":"D nằm giữa A và E; ý b","codes":[]},{"cm":"∆DKE ∽ ∆SAB ⇒ DE/SB = KE/AB","ld":"Từ 3 và 4 (g.g)","codes":["S1"]},{"cm":"HE/SB = 2DE/SB = KE/(AB/2) = KE/BI","ld":"Từ 1 và 5; I là trung điểm AB","codes":[]},{"cm":"∆HEK ∽ ∆SBI ⇒ ∠HKE = ∠SIB","ld":"∠HEK = ∠SBI (dòng 4); từ 6 (c.g.c)","codes":["S1"]},{"cm":"Gọi X = HK ∩ SI: ∠XKI + ∠XIK = (90° − ∠HKE) + ∠SIB = 90° ⇒ SI ⊥ HK","ld":"EK ⊥ AB; từ 7","codes":["G7","K3"]}],"btp":[],"layer":{"fig":"img/L310.png","cap":"Lớp 1: cặp ∆DKE ∽ ∆SAB lấy từ ý b. Lớp 2: nhân đôi cạnh DE thành HE, chia đôi cạnh AB thành BI.","rut":"Từ một cặp tam giác đồng dạng, nhân đôi một cạnh ở tam giác này và chia đôi cạnh tương ứng kề cùng góc ở tam giác kia, được cặp đồng dạng mới. Đây là dạng “nhân đôi – chia đôi” của bài toán phụ 6."}},{"boost":["B7"],"id":"1.7","ch":1,"truong":"Vào 10 Hà Nội 2026","ky":"vào 10","de":["Cho tam giác ABC vuông tại A (AB < AC) nội tiếp đường tròn tâm O, đường kính BC. Lấy điểm H thuộc đoạn thẳng AB sao cho HB > HA (H khác A). Kẻ đường thẳng qua H vuông góc với đường thẳng BC tại điểm D và cắt đường thẳng AC tại điểm E.","a) Chứng minh bốn điểm A, H, D, C cùng thuộc một đường tròn.","b) Đường thẳng CH cắt đường tròn (O) tại điểm thứ hai F. Đường thẳng qua A vuông góc với đường thẳng ED cắt đường thẳng DF tại điểm M. Chứng minh AE.BC = EH.AB và ∠EMH = 90°.","c) Đường thẳng BM cắt đường tròn (O) tại điểm thứ hai K. Chứng minh tam giác HKM là tam giác cân."],"yl":"c","yc":"Đường thẳng BM cắt đường tròn (O) tại điểm thứ hai K. Chứng minh tam giác HKM là tam giác cân.","kl":"∆HKM cân","hinh":"img/b1.7.png","huong":"HK = HA, tức OH là đường trung trực của AK.","giu":"Ý b: HA = HM; AM ⊥ DE nên AM // BC.","noi":"Ý b cho HM = HA. Hai tam giác cân HAM (đỉnh H) và OAB (đỉnh O) đồng dạng, chung đỉnh A.","nhin":"Viết lại bài toán phụ 7 với tên điểm của bài này: cặp nào ghép “theo hàng”, cặp nào ghép “theo cột”?","nhinDap":"“Theo hàng”: ∆AHM ∽ ∆AOB. “Theo cột”: ∆AHO ∽ ∆AMB.","deep":{"huong":[{"ten":"Tính trực tiếp góc của ∆HKM","kq":"tac","y":["K là giao điểm của BM với (O). ∠HMK = ∠HMB tính được, nhưng ∠HKM phụ thuộc vị trí của H so với đường tròn, không có cung nào chắn."]},{"ten":"Bài toán phụ 7","kq":"duoc","y":["∆AHM ∽ ∆AOB (hai tam giác cân có góc đáy bằng nhau) ⇒ theo bài toán phụ 7: ∆AHO ∽ ∆AMB ⇒ ∠AOH = ∠ABM = ½∠AOK.","OH là phân giác của ∠AOK ⇒ OH là trung trực AK ⇒ HK = HA = HM."]}],"binh":["Đây là bài điển hình cho thấy cái lợi của bài toán phụ: từ một cặp tam giác cân “theo hàng” (A, H, M) – (A, O, B), bài toán phụ 7 cho ngay cặp “theo cột” (A, H, O) – (A, M, B) mà không cần tìm thêm góc nào."]},"loai":"lab","so":7,"gt":["∆ABC vuông tại A nội tiếp (O), đường kính BC","H ∈ AB, HB > HA; HD ⊥ BC, HD cắt AC tại E","CH cắt (O) tại F; AM ⊥ ED, M ∈ DF","BM cắt (O) tại K"],"dg":"chứng minh HK = HM.","inputs":[{"code":"N5","text":"Ý b: HA = HM (DE là trung trực của AM) → ∆HAM cân tại H","keep":1,"why":""},{"code":"Q2","text":"OA = OB (bán kính) → ∆OAB cân tại O","keep":1,"why":""},{"code":"P3, G5","text":"AM ⊥ DE, BC ⊥ DE → AM // BC ⇒ ∠MAB = ∠ABO = ∠OAB","keep":1,"why":""},{"code":"S1","text":"Hai tam giác cân có góc ở đáy bằng nhau → ∆AHM ∽ ∆AOB (chung đỉnh A)","keep":1,"why":""},{"code":"S1","text":"H ∈ AB nên ∠HAO = ∠BAO = ∠MAB → ∆AHO ∽ ∆AMB ⇒ ∠AOH = ∠ABM","keep":1,"why":""},{"code":"G1","text":"∠ABK là góc nội tiếp chắn cung AK → ∠AOH = ½∠AOK: OH là phân giác của ∠AOK","keep":1,"why":""},{"code":"G6","text":"∆OAK cân, OH là phân giác → OH là trung trực của AK ⇒ HK = HA","keep":1,"why":""},{"code":"S2","text":"Ý b: AE.BC = EH.AB → hệ thức độ dài","keep":0,"why":"không có điểm K."},{"code":"N3","text":"Ý a: AHDC nội tiếp → ∠HDA = ∠HCA","keep":0,"why":"đã dùng để có HA = HM ở ý b."},{"code":"K6","text":"Kết luận ∆HKM cân → HK = HM; mà HM = HA nên cần HK = HA","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"∆HKM cân tại đâu? Đổi thành hai đoạn nào bằng nhau?","a":"Ý b cho HM = HA. Cần HK = HA: H nằm trên trung trực của AK, tức OH là phân giác của ∠AOK."},{"lab":"GIỮ LẠI","q":"Ý b cho gì để có góc tại O?","a":"HA = HM: ∆HAM cân tại H. Cùng ∆OAB cân tại O và AM // BC, hai tam giác cân này đồng dạng, chung đỉnh A."},{"lab":"CẦU NỐI","q":"Hai tam giác đồng dạng chung đỉnh A cho thêm cặp nào?","a":"Ghép “theo cột”: ∆AHO ∽ ∆AMB ⇒ ∠AOH = ∠ABM = ∠ABK = ½∠AOK."}],"steps":[{"cm":"AM // BC ⇒ ∠MAB = ∠ABO","ld":"AM ⊥ DE, BC ⊥ DE; so le trong","codes":["P3","G5"]},{"cm":"∠ABO = ∠OAB ⇒ ∠MAB = ∠OAB","ld":"∆OAB cân tại O (OA = OB)","codes":["G6"]},{"cm":"∆AHM ∽ ∆AOB","ld":"∆HAM cân tại H (HA = HM, ý b) và ∆OAB cân tại O có góc ở đáy ∠HAM = ∠OAB (dòng 2)","codes":["S1"]},{"cm":"AH/AO = AM/AB và ∠HAO = ∠MAB","ld":"Từ 3; H ∈ AB nên ∠HAO = ∠BAO = ∠MAB","codes":[]},{"cm":"∆AHO ∽ ∆AMB ⇒ ∠AOH = ∠ABM","ld":"Từ 4 (c.g.c)","codes":["S1"]},{"cm":"∠ABM = ∠ABK = ½∠AOK ⇒ ∠AOH = ½∠AOK","ld":"Góc nội tiếp và góc ở tâm cùng chắn cung AK","codes":["G1"]},{"cm":"OH là trung trực của AK ⇒ HK = HA","ld":"∆OAK cân tại O có OH là phân giác","codes":["G6"]},{"cm":"HK = HM: ∆HKM cân tại H","ld":"HA = HM (ý b)","codes":["K6"]}],"btp":[7],"layer":{"fig":"img/L17.png","cap":"Lớp 1: hai tam giác cân ∆AHM, ∆AOB đồng dạng, chung đỉnh A. Lớp 2: ghép theo cột, được ∆AHO ∽ ∆AMB.","rut":"Hai tam giác đồng dạng có chung một đỉnh: ghép các đỉnh tương ứng “theo cột” luôn được một cặp đồng dạng mới. Ghi thành bài toán phụ 7."}},{"boost":["B7"],"id":"3.2","ch":3,"truong":"Lê Hồng Phong","ky":"giữa HKII","de":["Cho ∆ABC có ba góc nhọn, nội tiếp đường tròn (O), kẻ đường cao BE của ∆ABC. Gọi H và K lần lượt là chân các đường vuông góc kẻ từ E đến AB và BC.","a) Chứng minh tứ giác BHEK là tứ giác nội tiếp.","b) Chứng minh BH.BA = BE² và ∆BAC ∽ ∆BKH.","c) Kẻ đường cao CF của ∆ABC (F ∈ AB) và I là trung điểm của EF. Chứng minh ba điểm H, I, K thẳng hàng."],"yl":"c","yc":"Kẻ đường cao CF của ∆ABC (F ∈ AB) và I là trung điểm của EF. Chứng minh ba điểm H, I, K thẳng hàng.","kl":"H, I, K thẳng hàng","hinh":"img/b3.2.png","huong":"∠EHK = ∠EHI (hai tia HK, HI trùng nhau).","giu":"∆BAC ∽ ∆BKH; tứ giác BHEK nội tiếp.","noi":"Cùng vuông (∠EHF = ∠EKC = 90°) và ∠EFH = ∠ECK = ∠ACB nên đồng dạng; theo bài toán phụ 7 được ∆EHK ∽ ∆EFC.","nhin":"Đặt bài này cạnh Phúc Đồng (Bài 3.5). Hai đề khác nhau đúng một chỗ nào?","nhinDap":"Hình và ý c giống hệt Phúc Đồng (Bài 3.5); chỉ khác ý b: Lê Hồng Phong hỏi BH.BA = BE² và ∆BAC ∽ ∆BKH, Phúc Đồng hỏi BH.BA = BK.BC.","deep":{"huong":[{"ten":"Gọi I' là giao điểm của HK và EF, chứng minh I'E = I'F","kq":"tac","y":["Cần tỉ số trên EF; không có đường song song nào cắt EF."]},{"ten":"Hai tia trùng nhau, dùng ý a","kq":"duoc","y":["∠BHK = ∠BEK = ∠ACB; ∠FHI = ∠HFI = ∠ACB.","F nằm giữa H và B nên ∠BHK = ∠BHI ⇒ tia HK trùng tia HI."]},{"ten":"Bài toán phụ 7","kq":"duoc","y":["∆EHF ∽ ∆EKC (vuông, ∠EFH = ∠ECK) ⇒ theo bài toán phụ 7: ∆EHK ∽ ∆EFC ⇒ ∠EHK = ∠EFC = 90° − ∠ACB = ∠EHI."]}],"binh":["Đi ngược tới “cần một góc bằng ∠ACB” rồi mới rà kết quả. Ở bài này ý a cho góc đó nhanh hơn ý b. Bài học: đừng mặc định phải dùng kết quả cuối cùng của ý trước; hãy chọn kết quả phục vụ đúng cái cần."]},"loai":"lab","so":8,"gt":["∆ABC nhọn nội tiếp (O); BE ⊥ AC","EH ⊥ AB, EK ⊥ BC","CF ⊥ AB; I là trung điểm EF"],"dg":"chứng minh HK đi qua trung điểm của EF.","inputs":[{"code":"N1","text":"BE ⊥ AC, CF ⊥ AB → BCEF nội tiếp đường tròn đường kính BC","keep":1,"why":""},{"code":"N3","text":"BCEF nội tiếp → ∠AFE = ∠ACB ⇒ ∠EFH = ∠ACB","keep":1,"why":""},{"code":"S3","text":"∠EHF = ∠EKC = 90°, ∠EFH = ∠ECK → ∆EHF ∽ ∆EKC ⇒ ∠HEF = ∠KEC","keep":1,"why":""},{"code":"S1","text":"Hai tam giác đồng dạng chung đỉnh E → ∆EHK ∽ ∆EFC ⇒ ∠EHK = ∠EFC = 90° − ∠ACB","keep":1,"why":""},{"code":"V2","text":"∆EHF vuông tại H, I là trung điểm EF → IH = IE ⇒ ∠EHI = ∠HEF = 90° − ∠ACB","keep":1,"why":""},{"code":"N3","text":"Ý a: BHEK nội tiếp → ∠BHK = ∠BEK = ∠ACB","keep":0,"why":"cũng đi được – xem cách ngắn ở Bước 4."},{"code":"V1","text":"Ý b: BH.BA = BE² → hệ thức độ dài","keep":0,"why":"không cho góc tại H."},{"code":"K1","text":"Kết luận H, I, K thẳng hàng → Hai tia trùng nhau: ∠EHK = ∠EHI","keep":1,"why":""}],"hoi":[{"lab":"HƯỚNG TỚI","q":"Tại H có những tia nào? Đổi kết luận thành gì?","a":"Tia HE, HI, HK. Cần ∠EHK = ∠EHI (hai tia HK, HI trùng nhau)."},{"lab":"GIỮ LẠI","q":"∠EHI tính được không? ∠EHK nằm trong tam giác nào?","a":"IH = IE nên ∠EHI = ∠HEF = 90° − ∠ACB. ∠EHK nằm trong ∆EHK: cần một tam giác đồng dạng với nó."},{"lab":"CẦU NỐI","q":"Hai tam giác đồng dạng nào chung đỉnh E, chứa EH và EK?","a":"∆EHF ∽ ∆EKC (cùng vuông, ∠EFH = ∠ECK). Ghép theo cột: ∆EHK ∽ ∆EFC."}],"steps":[{"cm":"BCEF nội tiếp ⇒ ∠AFE = ∠ACB","ld":"∠BEC = ∠BFC = 90°; góc ngoài bằng góc trong ở đỉnh đối","codes":["N1","N3"]},{"cm":"∠EFH = ∠AFE = ∠ACB","ld":"H nằm giữa A và F (AH = AE.cos A < AC.cos A = AF)","codes":[]},{"cm":"∆EHF ∽ ∆EKC ⇒ ∠HEF = ∠KEC; EH/EK = EF/EC","ld":"∠EHF = ∠EKC = 90°; ∠EFH = ∠ECK (g.g)","codes":["S3"]},{"cm":"∠HEK = ∠HEF + ∠FEK = ∠KEC + ∠FEK = ∠FEC","ld":"Từ 3","codes":[]},{"cm":"∆EHK ∽ ∆EFC ⇒ ∠EHK = ∠EFC","ld":"Từ 3 và 4 (c.g.c)","codes":["S1"]},{"cm":"∠EFC = 90° − ∠AFE = 90° − ∠ACB","ld":"CF ⊥ AB; từ 1","codes":[]},{"cm":"IH = IE ⇒ ∠EHI = ∠HEF = 90° − ∠EFH = 90° − ∠ACB","ld":"Trung tuyến ứng với cạnh huyền của ∆EHF","codes":["V2","G6","G7"]},{"cm":"∠EHK = ∠EHI ⇒ tia HK trùng tia HI ⇒ H, I, K thẳng hàng","ld":"Từ 5, 6, 7; K, I cùng phía đối với HE","codes":["K1"]}],"btp":[],"layer":{"fig":"img/L32.png","cap":"Lớp 1: ∆EHF ∽ ∆EKC chung đỉnh E. Lớp 2: ghép theo cột, được ∆EHK ∽ ∆EFC.","rut":"Lại là hai tam giác đồng dạng chung một đỉnh – bài toán phụ 7 xuất hiện lần thứ hai."}},{"boost":[],"id":"1.1","ch":1,"truong":"Trưng Vương","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A (AB < AC), đường cao AH (H ∈ BC). Gọi M, N lần lượt là chân đường vuông góc hạ từ H xuống hai đường thẳng AB, AC.","1) Chứng minh 4 điểm A, M, H, N cùng thuộc một đường tròn.","2) Chứng minh tam giác AMN đồng dạng với tam giác ACB và HN = AB.sin²B.","3) Hai đường thẳng MN và BC cắt nhau tại I. Trên tia đối của tia NH lấy điểm K sao cho NK = BM. Chứng minh đường thẳng AI vuông góc với đường thẳng CK."],"yl":"3","yc":"Hai đường thẳng MN và BC cắt nhau tại I. Trên tia đối của tia NH lấy điểm K sao cho NK = BM. Chứng minh đường thẳng AI vuông góc với đường thẳng CK.","kl":"AI ⊥ CK","hinh":"img/b1.1.png","huong":"AI ⊥ OE và OE // CK (E là trung điểm BC).","giu":"∆AMN ∽ ∆ACB nên ∠AMN = ∠ACB.","noi":"HK = AB và HK // AB nên ABHK là hình bình hành; BK đi qua trung điểm O của AH, cũng là trung điểm của MN.","nhin":"Trung điểm O của AH đóng mấy vai trong lời giải? Kể ra.","nhinDap":"O là trung điểm của AH, của MN (tâm hình chữ nhật AMHN), của BK (tâm hình bình hành ABHK) và là trực tâm của ∆AIE.","deep":{"huong":[{"ten":"Tính góc trực tiếp","kq":"tac","y":["Thử chứng minh góc giữa AI và CK bằng 90° bằng cách tính các góc tại I và tại C. ∠AIB tính được qua ∠AMN = ∠ACB, nhưng ∠KCB phụ thuộc vị trí của K, mà K chỉ được cho bằng một độ dài."]},{"ten":"Giải mã K, đường trung bình, trực tâm","kq":"duoc","y":["HK = AB, HK // AB ⇒ ABHK là hình bình hành ⇒ O (trung điểm AH) là trung điểm BK và của MN.","E là trung điểm BC ⇒ OE // CK.","∠AMN = ∠ACB (ý b), ∠EAB = ∠ABC ⇒ MN ⊥ AE ⇒ O là trực tâm ∆AIE ⇒ EO ⊥ AI ⇒ AI ⊥ CK."]}],"binh":["Bài không cần bài toán phụ, nhưng cho thấy rõ cách chọn kết quả của ý b: đi ngược tới “cần MN ⊥ AE” thì mới biết phải lấy góc chứ không lấy tỉ số.","Điểm then chốt là K. Câu hỏi “HK là gì?” biến một điểm cho bằng độ dài thành một điểm có vai rõ ràng (đỉnh hình bình hành). O là điểm nhiều vai nhất: trung điểm AH, MN, BK và là trực tâm của ∆AIE."]},"loai":"sector","gt":["∆ABC vuông tại A (AB < AC), đường cao AH","HM ⊥ AB, HN ⊥ AC; I = MN ∩ BC","K thuộc tia đối của tia NH, NK = BM"],"inputs":[{"code":"V5","text":"AMHN là hình chữ nhật: HN = AM; O là trung điểm AH, MN","keep":1,"why":""},{"code":"P3, P4","text":"ABHK là hình bình hành: O là trung điểm BK","keep":1,"why":""},{"code":"P2","text":"OE // CK (E là trung điểm BC)","keep":1,"why":""},{"code":"V2, G6","text":"∠EAB = ∠ABC","keep":1,"why":""},{"code":"S1","text":"ý b: ∠AMN = ∠ACB ⇒ MN ⊥ AE","keep":1,"why":""},{"code":"Q1","text":"O là trực tâm ∆AIE","keep":1,"why":""},{"code":"V3","text":"ý b: HN = AB.sin²B","keep":0,"why":"Không phục vụ điều đang cần ở ý 3."}],"steps":[{"cm":"HK = HN + NK = AM + BM = AB","ld":"N nằm giữa H và K; HN = AM (AMHN là hình chữ nhật); NK = BM (gt)","codes":["V5"]},{"cm":"ABHK là hình bình hành","ld":"HK // AB (cùng ⊥ AC), HK = AB","codes":["P3","P4"]},{"cm":"O = AH ∩ BK là trung điểm của AH, của BK và của MN (O ∈ MN)","ld":"Đường chéo của hình bình hành ABHK và hình chữ nhật AMHN","codes":["P4","V5"]},{"cm":"Gọi E là trung điểm BC: OE // CK","ld":"OE là đường trung bình của ∆BKC","codes":["P2"]},{"cm":"∠EAB = ∠ABC","ld":"EA = EB (trung tuyến ứng với cạnh huyền)","codes":["V2","G6"]},{"cm":"Gọi J = MN ∩ AE: ∠AMJ + ∠MAJ = ∠ACB + ∠ABC = 90° ⇒ MN ⊥ AE","ld":"Ý b: ∠AMN = ∠ACB; từ 5","codes":["S1","G7"]},{"cm":"O là trực tâm của ∆AIE ⇒ EO ⊥ AI","ld":"Hai đường cao AH, IJ cắt nhau tại O","codes":["Q1"]},{"cm":"AI ⊥ CK","ld":"Từ 4 và 7","codes":["K3"]}]},{"boost":[],"id":"1.3","ch":1,"truong":"Dịch Vọng Hậu","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A có AB < AC, đường cao AH.","a) Giải tam giác ABC biết AB = 9 cm và ∠ABC = 60°.","b) Gọi E là hình chiếu của H trên AB, F là hình chiếu của H trên AC. Chứng minh AE.AB = AH². Từ đó chứng minh tam giác ABC đồng dạng với tam giác AFE.","c) Từ A kẻ đường thẳng vuông góc với EF tại I và AI kéo dài cắt BC tại K. Chứng minh K là trung điểm của BC và cos³B.sin B = IF/BC."],"yl":"c","yc":"Từ A kẻ đường thẳng vuông góc với EF tại I và AI kéo dài cắt BC tại K. Chứng minh K là trung điểm của BC và cos³B.sin B = IF/BC.","kl":"cos³B.sin B = IF/BC","hinh":"img/b1.3.png","huong":"IF = BC.cos³B.sin B: tính IF lần lượt qua AF, AH, AB, BC.","giu":"∆ABC ∽ ∆AFE nên ∠AFE = ∠ABC.","noi":"Dùng ∠AFE = ∠ABC trong tam giác vuông AIF (IF = AF.cos B), và để chứng minh K là trung điểm BC.","nhin":"Nếu ∆ABC vuông cân tại A thì hệ thức ở ý c trở thành gì? Kiểm tra lại bằng số.","nhinDap":"Khi ∆ABC vuông cân, ∠B = 45°: cos³B.sin B = 1/4, nên IF = BC/4.","deep":{"huong":[{"ten":"Tính độ dài bằng hệ thức lượng","kq":"dai","y":["∆AEF vuông tại A có đường cao AI ⇒ IF = AF²/EF; AEHF là hình chữ nhật nên EF = AH; AF = AH²/AC. Do đó IF = AH³/AC².","AH = AB.AC/BC ⇒ IF = AB³.AC/BC³ ⇒ IF/BC = (AB/BC)³.(AC/BC) = cos³B.sin B."]},{"ten":"Giữ nguyên góc B qua bốn tam giác vuông","kq":"duoc","y":["IF = AF.cos B (vì ∠AFI = ∠ABC); AF = AH.cos B (∠HAF = ∠ABC); AH = AB.sin B; AB = BC.cos B.","Nhân lại: IF = BC.cos³B.sin B."]}],"binh":["Cả hai hướng đều đúng. Hướng 2 ngắn vì mọi bước đều dùng một góc bằng góc B – đó là lí do chọn kết quả “góc” ở ý b.","Mẹo đếm thừa số trong kết luận (cos³B.sin B có bốn thừa số) cho biết trước số tam giác vuông phải đi qua."]},"loai":"sector","gt":["∆ABC vuông tại A (AB < AC), đường cao AH","HE ⊥ AB, HF ⊥ AC","AI ⊥ EF tại I; AI cắt BC tại K"],"inputs":[{"code":"S1","text":"ý b: ∠AFE = ∠ABC","keep":1,"why":""},{"code":"G7, G6","text":"KA = KB = KC","keep":1,"why":""},{"code":"V3","text":"IF = AF.cos B","keep":1,"why":""},{"code":"G4, V3","text":"AF = AH.cos B","keep":1,"why":""},{"code":"V3","text":"AH = AB.sin B; AB = BC.cos B","keep":1,"why":""},{"code":"V1","text":"ý b: AE.AB = AH²","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠AFE = ∠ABC","ld":"Ý b: ∆ABC ∽ ∆AFE","codes":["S1"]},{"cm":"∠IAF = 90° − ∠AFI = 90° − ∠ABC = ∠ACB ⇒ KA = KC","ld":"∆AIF vuông tại I; ∆KAC cân tại K","codes":["G7","G6"]},{"cm":"∠KAB = 90° − ∠KAC = 90° − ∠ACB = ∠ABC ⇒ KA = KB","ld":"∠BAC = 90°; ∆KAB cân tại K","codes":["G7","G6"]},{"cm":"KB = KC, K ∈ BC ⇒ K là trung điểm BC","ld":"Từ 2 và 3","codes":["K2"]},{"cm":"IF = AF.cos∠AFI = AF.cos B","ld":"∆AIF vuông tại I; dòng 1","codes":["V3"]},{"cm":"AF = AH.cos∠HAF = AH.cos B","ld":"∆AHF vuông tại F; ∠HAF = ∠ABC (cùng phụ ∠ACB)","codes":["V3","G4"]},{"cm":"AH = AB.sin B; AB = BC.cos B","ld":"∆AHB vuông tại H; ∆ABC vuông tại A","codes":["V3"]},{"cm":"IF = BC.cos³B.sin B ⇒ cos³B.sin B = IF/BC","ld":"Từ 5, 6, 7","codes":["K6"]}]},{"boost":[],"id":"1.4","ch":1,"truong":"Ái Mộ – đề 1","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A (AB > AC) có AB = 5 cm và đường cao AH = 3 cm.","a) Tính số đo góc B (làm tròn kết quả đến phút) và độ dài cạnh BC (làm tròn đến hàng đơn vị).","b) Gọi D là trung điểm của cạnh BC. Kẻ DE vuông góc với AB (E ∈ AB). Chứng minh 4 điểm A, E, D, H cùng nằm trên một đường tròn, tính bán kính của đường tròn đó.","c) Chứng minh AH² = BH.HC."],"yl":"c","yc":"Chứng minh AH² = BH.HC.","kl":"AH² = BH.HC","hinh":"img/b1.4.png","huong":"AH/CH = BH/AH, tức ∆AHB ∽ ∆CHA.","giu":"Góc vuông tại H (AH ⊥ BC).","noi":"∆AHB và ∆CHA: chung đỉnh H, cùng vuông tại H, ∠BAH = ∠ACH.","nhin":"Hệ thức AH² = BH.HC còn chứng minh được bằng những cách nào khác?","nhinDap":"Dùng hệ thức lượng trong tam giác vuông; hoặc định lí Pythagore: AB² + AC² = BC² với AB² = AH² + BH², AC² = AH² + HC² cho 2AH² = 2BH.HC.","deep":{"huong":[{"ten":"Định lí Pythagore","kq":"duoc","y":["AB² = AH² + BH², AC² = AH² + HC², AB² + AC² = BC² = (BH + HC)².","Cộng hai đẳng thức đầu và so sánh: 2AH² + BH² + HC² = BH² + 2BH.HC + HC² ⇒ AH² = BH.HC."]},{"ten":"Tam giác đồng dạng","kq":"duoc","y":["∠BAH = ∠ACH (cùng phụ với ∠ABC) ⇒ ∆AHB ∽ ∆CHA (g.g) ⇒ AH/CH = BH/AH."]},{"ten":"Dùng hệ thức lượng có sẵn","kq":"dai","y":["Hệ thức h² = b'.c' trong sách giáo khoa chính là kết luận. Nếu đề yêu cầu chứng minh thì không được dùng trực tiếp."]}],"binh":["Bài nền giúp luyện thói quen “đẳng thức tích → đọc tên tam giác” (Chương 0, §3). Hướng Pythagore cũng tốt, nhưng không mở rộng được cho các bài khó hơn."]},"loai":"sector","gt":["∆ABC vuông tại A (AB > AC), AB = 5 cm, đường cao AH = 3 cm","D là trung điểm BC; DE ⊥ AB"],"inputs":[{"code":"G4","text":"∠BAH = ∠ACH","keep":1,"why":""},{"code":"S3","text":"∆AHB ∽ ∆CHA","keep":1,"why":""},{"code":"S2","text":"AH/CH = BH/AH","keep":1,"why":""},{"code":"N1","text":"ý b: A, E, D, H cùng thuộc đường tròn","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠AHB = ∠CHA = 90°","ld":"AH ⊥ BC (gt)","codes":[]},{"cm":"∠BAH = ∠ACH","ld":"Cùng phụ với ∠ABC","codes":["G4"]},{"cm":"∆AHB ∽ ∆CHA","ld":"Từ 1 và 2 (g.g)","codes":["S3"]},{"cm":"AH/CH = BH/AH ⇒ AH² = BH.HC","ld":"Cạnh tương ứng tỉ lệ","codes":["S1","K6"]}]},{"boost":[],"id":"1.5","ch":1,"truong":"Hà Đông","ky":"cuối HKI","de":["Cho ∆ABC vuông tại A (AB < AC), đường cao AH. Vẽ đường tròn tâm A, bán kính AH. Từ điểm C kẻ tiếp tuyến CM với đường tròn (A; AH) (M là tiếp điểm, M không nằm trên đường thẳng BC).","a) Chứng minh bốn điểm A, M, C và H cùng thuộc một đường tròn.","b) Gọi I là giao điểm của AC và MH. Kẻ đường kính MD của đường tròn (A). Chứng minh BD là tiếp tuyến của đường tròn (A) và BH.HC = AI.AC.","c) Vẽ đường tròn tâm O, đường kính BC cắt đường tròn (A) tại P và Q. Chứng minh PQ // DM."],"yl":"c","yc":"Vẽ đường tròn tâm O, đường kính BC cắt đường tròn (A) tại P và Q. Chứng minh PQ // DM.","kl":"PQ // DM","hinh":"img/b1.5.png","huong":"MD ⊥ AO (vì PQ ⊥ AO).","giu":"CA là đường trung trực của HM nên ∠MAC = ∠HAC; MD là đường kính của (A).","noi":"A nằm trên (O) đường kính BC. Dây chung PQ vuông góc với đường nối tâm AO.","nhin":"Bài này dùng tính chất “dây chung vuông góc với đường nối tâm”. Còn bài nào trong sách dùng tính chất này?","nhinDap":"Tính chất “đường thẳng qua tâm vuông góc với dây” còn gặp ở Bài 3.3, 3.6, 3.7 (trục đối xứng chung của hai dây).","deep":{"huong":[{"ten":"Tìm cặp góc so le","kq":"dai","y":["Thử lấy AO làm cát tuyến chung của PQ và DM. Muốn so sánh góc tạo bởi PQ với AO thì lại phải biết PQ ⊥ AO."]},{"ten":"Cùng vuông góc với AO","kq":"duoc","y":["A thuộc (O) (đường tròn đường kính BC); AP = AQ, OP = OQ ⇒ AO là trung trực của PQ ⇒ PQ ⊥ AO.","∠OAC = ∠ACB (∆OAC cân), ∠MAC = 90° − ∠ACB ⇒ ∠MAO = 90° ⇒ DM ⊥ AO."]}],"binh":["Dây chung của hai đường tròn là dấu hiệu rất mạnh: nó vuông góc với đường nối tâm. Song song khi đó được đổi thành “cùng vuông góc với AO”."]},"loai":"sector","gt":["∆ABC vuông tại A, đường cao AH; đường tròn (A; AH)","CM tiếp xúc (A) tại M; MD là đường kính của (A)","(O) đường kính BC cắt (A) tại P, Q"],"inputs":[{"code":"V2","text":"OA = OB = OC: A ∈ (O)","keep":1,"why":""},{"code":"N5","text":"AO là trung trực của PQ ⇒ PQ ⊥ AO","keep":1,"why":""},{"code":"G6","text":"∠OAC = ∠ACB","keep":1,"why":""},{"code":"T2","text":"∠MAC = ∠HAC = 90° − ∠ACB","keep":1,"why":""},{"code":"K4","text":"PQ // DM ⇐ cùng ⊥ AO","keep":1,"why":""},{"code":"V1","text":"ý b: BH.HC = AI.AC","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"OA = OB = OC ⇒ A thuộc (O)","ld":"∆ABC vuông tại A, O là trung điểm BC","codes":["V2"]},{"cm":"AO là trung trực của PQ ⇒ PQ ⊥ AO","ld":"AP = AQ (bán kính (A)), OP = OQ (bán kính (O))","codes":["N5"]},{"cm":"∠OAC = ∠ACB","ld":"∆OAC cân tại O","codes":["G6"]},{"cm":"∠MAC = ∠HAC = 90° − ∠ACB","ld":"CH, CM là hai tiếp tuyến của (A); ∆AHC vuông tại H","codes":["T2","G7"]},{"cm":"∠MAO = ∠MAC + ∠CAO = 90° ⇒ MD ⊥ AO","ld":"Từ 3 và 4","codes":[]},{"cm":"PQ // DM","ld":"Cùng vuông góc với AO","codes":["P3","K4"]}]},{"boost":[],"id":"1.6","ch":1,"truong":"Hát Môn","ky":"cuối HKII","de":["Cho tam giác ABC vuông tại A. Lấy điểm M bất kì trên đoạn AC, đường tròn đường kính CM cắt hai đường thẳng BM, BC lần lượt tại D, N. Chứng minh rằng:","a) Tứ giác ABCD nội tiếp.","b) BM.BD = BN.BC.","c) Các đường thẳng AB, MN, CD cùng đi qua một điểm."],"yl":"c","yc":"Các đường thẳng AB, MN, CD cùng đi qua một điểm.","kl":"AB, MN, CD đồng quy","hinh":"img/b1.6.png","huong":"S, M, N thẳng hàng (S = AB ∩ CD), tức SM ⊥ BC và MN ⊥ BC.","giu":"Từ ý a: ∠BDC = 90°, tức BD ⊥ CD.","noi":"CA ⊥ SB và BD ⊥ SC nên M là giao điểm của hai đường cao: M là trực tâm của ∆SBC.","nhin":"M “hoá ra” là trực tâm. Tìm ở Chương 4 một bài có điểm cũng hoá ra là trực tâm.","nhinDap":"Bài 4.7 (Nghĩa Tân): I là giao điểm của EB và SO, hoá ra là trực tâm của ∆SJB.","deep":{"huong":[{"ten":"Chứng minh MN đi qua S bằng góc","kq":"tac","y":["Thử tính góc tại N hoặc tại M để có S, M, N thẳng hàng. S nằm ngoài hình, góc tại S không liên hệ trực tiếp với N."]},{"ten":"Trực tâm","kq":"duoc","y":["Trong ∆SBC: CA ⊥ SB, BD ⊥ SC ⇒ M là trực tâm ⇒ SM ⊥ BC.","MN ⊥ BC ⇒ S, M, N thẳng hàng ⇒ ba đường đồng quy tại S."]}],"binh":["Hỏi “M là gì của tam giác SBC?” – M là điểm nhiều vai (vừa nằm trên AC, vừa nằm trên BD). Khi một điểm là giao của hai đường vuông góc với hai cạnh, hãy nghĩ tới trực tâm."]},"loai":"sector","gt":["∆ABC vuông tại A; M ∈ AC","Đường tròn đường kính CM cắt BM tại D, cắt BC tại N"],"inputs":[{"code":"G2","text":"∠MDC = ∠MNC = 90°","keep":1,"why":""},{"code":"K5","text":"gọi S = AB ∩ CD","keep":1,"why":""},{"code":"Q1","text":"M là trực tâm ∆SBC ⇒ SM ⊥ BC","keep":1,"why":""},{"code":"K1","text":"SM ⊥ BC, MN ⊥ BC","keep":1,"why":""},{"code":"S2","text":"ý b: BM.BD = BN.BC","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"CD cắt AB tại S","ld":"Nếu CD // AB thì BD // AC, vô lí vì BD cắt AC tại M","codes":[]},{"cm":"BD ⊥ SC","ld":"∠BDC = ∠MDC = 90° (D thuộc đường tròn đường kính CM)","codes":["G2"]},{"cm":"CA ⊥ SB","ld":"∠BAC = 90° (gt)","codes":[]},{"cm":"M là trực tâm của ∆SBC ⇒ SM ⊥ BC","ld":"Hai đường cao CA, BD cắt nhau tại M","codes":["Q1"]},{"cm":"MN ⊥ BC","ld":"∠MNC = 90°","codes":["G2"]},{"cm":"S, M, N thẳng hàng ⇒ AB, MN, CD cùng đi qua S","ld":"Qua M chỉ có một đường thẳng vuông góc với BC","codes":["K1","K5"]}]},{"boost":[],"id":"2.1","ch":2,"truong":"Ái Mộ – đề 2","ky":"giữa HKI","de":["Cho ∆ABC vuông tại A (AB < AC), đường cao AH.","a) Cho biết AB = 4, 5 cm; AC = 6 cm. Tính BC, ∠B, Ĉ (kết quả góc làm tròn đến phút).","b) Gọi M là trung điểm của BC. Kẻ BE ⊥ AM tại E, BE cắt AH tại D. Chứng minh bốn điểm D, H, M, E cùng thuộc một đường tròn.","c) BE cắt AC tại F. Chứng minh BE.BF = AB² và BE.BF = BH.BC."],"yl":"c","yc":"BE cắt AC tại F. Chứng minh BE.BF = AB² và BE.BF = BH.BC.","kl":"BE.BF = BH.BC","hinh":"img/b2.1.png","huong":"BE.BF = AB² và BH.BC = AB².","giu":"BE ⊥ AM tại E và ∠BAC = 90°.","noi":"∆ABF vuông tại A có đường cao AE; ∆ABC vuông tại A có đường cao AH.","nhin":"Từ BE.BF = BH.BC, em có thể viết ra cặp tam giác đồng dạng nào?","nhinDap":"BE/BC = BH/BF và ∠B chung nên ∆BEH ∽ ∆BCF.","deep":{"huong":[{"ten":"Đọc tên tam giác từ tỉ lệ thức","kq":"duoc","y":["BE/AB = AB/BF ⇒ ∆BEA ∽ ∆BAF (chung ∠B, cùng có góc vuông).","BH/AB = AB/BC ⇒ ∆BHA ∽ ∆BAC."]},{"ten":"Hệ thức lượng","kq":"duoc","y":["Trong ∆ABF vuông tại A, đường cao AE: AB² = BE.BF. Trong ∆ABC: AB² = BH.BC."]}],"binh":["Bài nền của mô hình “tam giác vuông có đường cao”. Điều cần luyện: nhìn ra tam giác vuông ABF có đường cao AE dù đề không nói thẳng."]},"loai":"sector","gt":["∆ABC vuông tại A, đường cao AH","M là trung điểm BC; BE ⊥ AM tại E","BE cắt AH tại D, cắt AC tại F"],"inputs":[{"code":"V1","text":"∆ABF vuông tại A, đường cao AE: AB² = BE.BF","keep":1,"why":""},{"code":"V1","text":"∆ABC vuông tại A, đường cao AH: AB² = BH.BC","keep":1,"why":""},{"code":"N1","text":"ý b: D, H, M, E cùng thuộc đường tròn","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∆ABF ∽ ∆EBA ⇒ AB/EB = BF/BA ⇒ AB² = BE.BF","ld":"∠BAF = ∠BEA = 90°; ∠ABF chung (g.g)","codes":["S3","V1"]},{"cm":"∆HBA ∽ ∆ABC ⇒ HB/AB = AB/BC ⇒ AB² = BH.BC","ld":"∠BHA = ∠BAC = 90°; ∠ABC chung (g.g)","codes":["S3","V1"]},{"cm":"BE.BF = BH.BC","ld":"Từ 1 và 2","codes":["K6"]}]},{"boost":["B6"],"id":"2.2","ch":2,"truong":"Ngô Gia Tự","ky":"giữa HKI","de":["Cho ∆ABC vuông tại A (AB < AC).","a) Cho AB = 6 cm, AC = 8 cm. Tính độ dài BC và số đo ∠B, Ĉ (kết quả số đo góc làm tròn đến độ).","b) Gọi M là trung điểm của AC, I là hình chiếu của A trên BM. Chứng minh ∆AMB đồng dạng ∆IMA. Từ đó suy ra sin²∠ABM = IM/BM.","c) Gọi K là hình chiếu của M trên BC. Tia AI cắt đường thẳng qua C vuông góc với AC tại N. Chứng minh rằng: ba điểm M, K, N thẳng hàng."],"yl":"c","yc":"Gọi K là hình chiếu của M trên BC. Tia AI cắt đường thẳng qua C vuông góc với AC tại N. Chứng minh rằng: ba điểm M, K, N thẳng hàng.","kl":"M, K, N thẳng hàng","hinh":"img/b2.2.png","huong":"MN ⊥ BC (vì MK ⊥ BC và qua M chỉ có một đường vuông góc với BC).","giu":"∆AMB ∽ ∆IMA nên ∠ABM = ∠IAM = ∠CAN.","noi":"Từ ∆ACN ∽ ∆BAM có CN/AM = AC/AB; thay AM = MC được CN/CM = AC/AB, nên ∆NCM ∽ ∆CAB.","nhin":"Đặt bài này cạnh Bài 2.3 (Nguyễn Du). Hai hình giống nhau ở điểm nào?","nhinDap":"Hai bài cùng có M là trung điểm AC, một đường thẳng qua C vuông góc với AC, và cùng “đổi AM thành MC” để được cặp tam giác mới.","deep":{"huong":[{"ten":"Góc bẹt tại K","kq":"tac","y":["Thử chứng minh ∠MKC + ∠CKN = 180°. ∠MKC = 90°, nhưng ∠CKN chưa có gì để tính vì chưa biết N nằm đâu so với K."]},{"ten":"Đổi sang vuông góc, đổi AM thành MC","kq":"duoc","y":["∠CAN = ∠ABM ⇒ ∆ACN ∽ ∆BAM ⇒ CN/AM = AC/AB.","AM = MC ⇒ CN/CM = AC/AB ⇒ ∆NCM ∽ ∆CAB ⇒ ∠CMN = ∠ABC ⇒ MN ⊥ BC."]}],"binh":["Bước “thay AM bằng MC” là dạng đơn giản nhất của bài toán phụ 6: trung điểm cho phép đổi một cạnh của cặp tam giác cũ để được cặp mới. Dấu hiệu: có trung điểm M nằm trên cạnh AC của cặp tam giác vừa có."]},"loai":"sector","gt":["∆ABC vuông tại A (AB < AC)","M là trung điểm AC; AI ⊥ BM","MK ⊥ BC; CN ⊥ AC, N ∈ tia AI"],"inputs":[{"code":"S1","text":"ý b: ∠ABM = ∠CAN","keep":1,"why":""},{"code":"S3","text":"∆ACN ∽ ∆BAM","keep":1,"why":""},{"code":"K6","text":"AM = MC ⇒ CN/CM = AC/AB","keep":1,"why":""},{"code":"S1","text":"∆NCM ∽ ∆CAB","keep":1,"why":""},{"code":"G7","text":"MN ⊥ BC","keep":1,"why":""},{"code":"V3","text":"ý b: sin²∠ABM","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠ABM = ∠IAM = ∠CAN","ld":"Ý b: ∆AMB ∽ ∆IMA; I ∈ AN, M ∈ AC","codes":[]},{"cm":"∆ACN ∽ ∆BAM ⇒ CN/AM = AC/AB","ld":"∠ACN = ∠BAM = 90°; từ 1 (g.g)","codes":["S3"]},{"cm":"CN/CM = AC/AB ⇒ CN/AC = CM/AB","ld":"AM = CM (M là trung điểm AC)","codes":[]},{"cm":"∆NCM ∽ ∆CAB ⇒ ∠CMN = ∠ABC","ld":"∠NCM = ∠CAB = 90°; từ 3 (c.g.c)","codes":["S1"]},{"cm":"Gọi K' = MN ∩ BC: ∠CMK' + ∠MCK' = ∠ABC + ∠ACB = 90° ⇒ MN ⊥ BC","ld":"Từ 4","codes":["G7"]},{"cm":"M, K, N thẳng hàng","ld":"MK ⊥ BC; qua M chỉ có một đường vuông góc với BC","codes":["K1"]}]},{"boost":["B6"],"id":"2.3","ch":2,"truong":"Nguyễn Du","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A (AB < AC).","a) Giả sử AB = 6 cm; BC = 10 cm. Tính AC và số đo ∠ACB (góc làm tròn đến độ).","b) Gọi M là trung điểm của đoạn thẳng AC, kẻ AH ⊥ BM tại H. Chứng minh: AM/BM = HM/AM và cos²∠AMB = HM/BM.","c) Kẻ MI ⊥ BC tại I. Qua C kẻ đường thẳng vuông góc với AC, đường thẳng này cắt đường thẳng MI tại K. Chứng minh ba điểm A, H, K thẳng hàng."],"yl":"c","yc":"Kẻ MI ⊥ BC tại I. Qua C kẻ đường thẳng vuông góc với AC, đường thẳng này cắt đường thẳng MI tại K. Chứng minh ba điểm A, H, K thẳng hàng.","kl":"A, H, K thẳng hàng","hinh":"img/b2.3.png","huong":"∠MAH = ∠CAK (hai tia AH, AK trùng nhau).","giu":"∆AMH ∽ ∆BMA nên ∠MAH = ∠MBA.","noi":"∆ABC ∽ ∆CMK; thay CM = AM được ∆ABM ∽ ∆CAK nên ∠CAK = ∠ABM.","nhin":"Đổi “M là trung điểm của AC” thành “AM = 2MC”, kết luận còn đúng không? Vì sao?","nhinDap":"Không còn đúng nói chung: bước ∆ABM ∽ ∆CAK cần AM = CM. Thử trên phần mềm với AM = 2MC sẽ thấy A, H, K không thẳng hàng.","deep":{"huong":[{"ten":"Góc bẹt tại H","kq":"tac","y":["Cần ∠AHM + ∠MHK = 180°. K liên hệ với H qua đâu? Chưa có gì, vì K được xác định từ C và I."]},{"ten":"Hai tia trùng nhau","kq":"duoc","y":["∆ABC ∽ ∆CMK (hai tam giác vuông, ∠ACB = ∠CKM) ⇒ AB/CM = AC/CK; thay CM = AM ⇒ ∆ABM ∽ ∆CAK ⇒ ∠CAK = ∠ABM = ∠MAH."]}],"binh":["Bài 2.2 và 2.3 là cặp “thuận – đảo” trên cùng một hình: một bài đổi thẳng hàng thành vuông góc, một bài đổi thành hai tia trùng nhau. Cả hai đều dùng “thay AM bằng MC”."]},"loai":"sector","gt":["∆ABC vuông tại A (AB < AC)","M là trung điểm AC; AH ⊥ BM","MI ⊥ BC; CK ⊥ AC, K ∈ MI"],"inputs":[{"code":"S1","text":"ý b: ∠MAH = ∠MBA","keep":1,"why":""},{"code":"G4","text":"∠CKM = ∠ACB","keep":1,"why":""},{"code":"S3","text":"∆ABC ∽ ∆CMK","keep":1,"why":""},{"code":"K6","text":"CM = AM ⇒ AB/CA = AM/CK","keep":1,"why":""},{"code":"S1","text":"∆ABM ∽ ∆CAK","keep":1,"why":""},{"code":"V3","text":"ý b: cos²∠AMB","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠MAH = ∠MBA","ld":"Ý b: ∆AMH ∽ ∆BMA","codes":["S1"]},{"cm":"∠CKM = 90° − ∠CMK = 90° − ∠CMI = ∠ACB","ld":"∆MCK vuông tại C, ∆MIC vuông tại I","codes":["G7","G4"]},{"cm":"∆ABC ∽ ∆CMK ⇒ AB/CM = AC/CK","ld":"∠BAC = ∠MCK = 90°; từ 2 (g.g)","codes":["S3"]},{"cm":"AB/CA = AM/CK","ld":"CM = AM (M là trung điểm AC)","codes":[]},{"cm":"∆ABM ∽ ∆CAK ⇒ ∠ABM = ∠CAK","ld":"∠BAM = ∠ACK = 90°; từ 4 (c.g.c)","codes":["S1"]},{"cm":"∠MAH = ∠CAK ⇒ tia AH trùng tia AK ⇒ A, H, K thẳng hàng","ld":"Từ 1 và 5; H, K cùng phía đối với AC","codes":["K1"]}]},{"boost":[],"id":"2.5","ch":2,"truong":"Ngọc Lâm","ky":"giữa HKI","de":["Cho tam giác ABC vuông tại A, đường cao AH.","a) Biết BC = 5 cm, AC = 4 cm. Tính độ dài cạnh AB và số đo ∠ABC (làm tròn đến độ).","b) Chứng minh rằng các điểm A, B, C cùng thuộc một đường tròn.","c) Chứng minh BC = AB.cos B + AC.cos C.","d) Gọi E là hình chiếu của H trên AB. Gọi I là trung điểm BE. Trên tia HC lấy K sao cho HK = BI. Chứng minh tam giác AIK là tam giác cân."],"yl":"d","yc":"Gọi E là hình chiếu của H trên AB. Gọi I là trung điểm BE. Trên tia HC lấy K sao cho HK = BI. Chứng minh tam giác AIK là tam giác cân.","kl":"∆AIK cân","hinh":"img/b2.5.png","huong":"AI² = AK².","giu":"AE.AB = AH² (∆AEH ∽ ∆AHB).","noi":"AI nằm trên AB, AK nằm trong ∆AHK vuông tại H. AI² = AE.AB + BI² = AH² + BI² = AK².","nhin":"Em đã tính AI², AK² qua những đoạn nào? Cách “so sánh bình phương” còn dùng được ở bài nào khác?","nhinDap":"AI², AK² cùng được viết thành AH² cộng một bình phương bằng nhau (BI² = HK²). Cách “so sánh bình phương” hợp khi hai đoạn nằm trong hai tam giác vuông khác nhau.","deep":{"huong":[{"ten":"Tìm hai tam giác bằng nhau","kq":"tac","y":["Thử ∆AHI và ∆AHK, ∆ABI và ∆A?K… không có cặp nào có đủ yếu tố bằng nhau."]},{"ten":"So sánh bình phương","kq":"duoc","y":["AK² = AH² + BI².","AI² = (AE + BI)² = AE² + AE.BE + BI² = AE.AB + BI² = AH² + BI² ⇒ AI = AK."]}],"binh":["Khi hai đoạn cần bằng nhau nằm trên hai đường khác nhau và không có cặp tam giác bằng nhau, hãy so sánh bình phương qua Pythagore và hệ thức lượng."]},"loai":"sector","gt":["∆ABC vuông tại A, đường cao AH","HE ⊥ AB; I là trung điểm BE","K ∈ tia HC, HK = BI"],"inputs":[{"code":"S3, V1","text":"AE.AB = AH²","keep":1,"why":""},{"code":"V4","text":"AK² = AH² + BI²","keep":1,"why":""},{"code":"K6","text":"AI² = AE.AB + BI²","keep":1,"why":""},{"code":"S4","text":"hai tam giác bằng nhau chứa AI, AK – không có","keep":0,"why":""},{"code":"V3","text":"ý c","keep":0,"why":"Không phục vụ điều đang cần ở ý d."}],"steps":[{"cm":"AE.AB = AH²","ld":"∆AEH ∽ ∆AHB (g.g)","codes":["S3","V1"]},{"cm":"AK² = AH² + HK² = AH² + BI²","ld":"∆AHK vuông tại H; HK = BI (gt)","codes":["V4"]},{"cm":"AI = AE + BI; BE = 2BI","ld":"E nằm giữa A và B; I là trung điểm BE","codes":[]},{"cm":"AI² = AE² + AE.BE + BI² = AE.AB + BI²","ld":"Từ 3","codes":[]},{"cm":"AI² = AH² + BI²","ld":"Từ 1 và 4","codes":[]},{"cm":"AI = AK: ∆AIK cân tại A","ld":"Từ 2 và 5","codes":["K6"]}]},{"boost":["B6"],"id":"2.6","ch":2,"truong":"Mỹ Đình 2","ky":"giữa HKII","de":["Cho ∆ABC vuông tại A. Gọi O là trung điểm của cạnh AC. Đường tròn tâm O đường kính AC cắt cạnh BC tại D (D khác C). Kẻ AE vuông góc với OB tại E.","a) Chứng minh bốn điểm A, B, D, E cùng thuộc một đường tròn.","b) Tiếp tuyến tại C của đường tròn (O) cắt tia AD và tia AE lần lượt ở H và K. Chứng minh ∠EAD = ∠EBD và ∆AHK ∽ ∆BCO.","c) Chứng minh K là trung điểm của đoạn thẳng HC."],"yl":"c","yc":"Chứng minh K là trung điểm của đoạn thẳng HC.","kl":"K là trung điểm HC","hinh":"img/b2.6.png","huong":"∠CAK = ∠CAK' với K' là trung điểm CH (điểm trùng).","giu":"AD ⊥ BC (D thuộc đường tròn đường kính AC) nên ∠CAH = ∠ABC.","noi":"∆BAC ∽ ∆ACH có O là trung điểm cạnh AC; ∠CAK = ∠OAE = ∠ABO.","nhin":"Đổi O thành điểm chia AC theo tỉ số 1 : 2. Khi đó K chia HC theo tỉ số nào?","nhinDap":"CK/CH = 1/3, vì CK/CH = AO/AC.","deep":{"huong":[{"ten":"Tỉ số lượng giác","kq":"duoc","y":["CK = AC.tan∠CAK = AC.tan∠ABO = AC.AO/AB = AC²/(2AB).","CH = AC.tan∠CAH = AC.tan∠ABC = AC²/AB ⇒ CK = CH/2."]},{"ten":"Bài toán phụ 6, chiều đảo dạng 2","kq":"duoc","y":["∆BAC ∽ ∆ACH, O là trung điểm AC; gọi K' là trung điểm CH ⇒ ∆BAO ∽ ∆ACK' ⇒ ∠CAK' = ∠ABO = ∠CAK ⇒ K trùng K'."]}],"binh":["Hướng lượng giác ngắn, nhưng nó dùng đúng hai cặp góc ∠CAK = ∠ABO và ∠CAH = ∠ABC mà bài toán phụ 6 chỉ ra. Bài toán phụ giải thích vì sao các góc ấy “khớp” nhau và giúp nghĩ ra lời giải khi các góc không đặc biệt."]},"loai":"sector","gt":["∆ABC vuông tại A; O là trung điểm AC","(O) đường kính AC cắt BC tại D; AE ⊥ OB tại E","Tiếp tuyến tại C của (O) cắt tia AD, AE tại H, K"],"inputs":[{"code":"G2, G4","text":"∠CAH = ∠ABC","keep":1,"why":""},{"code":"S3","text":"∆BAC ∽ ∆ACH","keep":1,"why":""},{"code":"B6","text":"K' trung điểm CH ⇒ ∠ABO = ∠CAK'","keep":1,"why":""},{"code":"G4","text":"∠CAK = ∠ABO","keep":1,"why":""},{"code":"K2","text":"điểm trùng K ≡ K'","keep":1,"why":""},{"code":"S1","text":"ý b: ∆AHK ∽ ∆BCO","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠CAH = ∠CAD = 90° − ∠ACB = ∠ABC","ld":"∠ADC = 90° (chắn nửa đường tròn)","codes":["G2","G4"]},{"cm":"∆BAC ∽ ∆ACH (B ↔ A, A ↔ C, C ↔ H)","ld":"∠BAC = ∠ACH = 90° (CH ⊥ AC); từ 1 (g.g)","codes":["S3"]},{"cm":"Gọi K' là trung điểm CH: ∆BAO ∽ ∆ACK' ⇒ ∠ABO = ∠CAK'","ld":"O, K' là trung điểm hai cạnh tương ứng AC, CH","codes":["B6"]},{"cm":"∠CAK = ∠OAE = 90° − ∠AOB = ∠ABO","ld":"∆ABO vuông tại A có đường cao AE","codes":["G7","G4"]},{"cm":"∠CAK = ∠CAK' ⇒ K trùng K' ⇒ K là trung điểm HC","ld":"K, K' cùng nằm trên đoạn CH","codes":["K2"]}]},{"boost":["B7"],"id":"3.1","ch":3,"truong":"Ái Mộ – đề 3","ky":"giữa HKI","de":["Cho ∆ABC có ba góc nhọn, AB > AC, hai đường cao BD và CE cắt nhau tại H.","a) Chứng minh rằng bốn điểm B, E, D, C cùng thuộc một đường tròn. Hãy chỉ rõ tâm O của đường tròn này.","b) Chứng minh: AB.AE = AC.AD.","c) Gọi R là bán kính của đường tròn tâm O. Giả sử ∠DBC = 30°, trên tia đối của tia CB lấy điểm M sao cho CM = R. Chứng minh: DM² = 3R²."],"yl":"c","yc":"Gọi R là bán kính của đường tròn tâm O. Giả sử ∠DBC = 30°, trên tia đối của tia CB lấy điểm M sao cho CM = R. Chứng minh: DM² = 3R².","kl":"DM² = 3R²","hinh":"img/b3.1.png","huong":"DM = DB và DB = R√3.","giu":"B, E, D, C cùng thuộc (O; R), O là trung điểm BC (ý a).","noi":"Ý bổ sung: từ ∆ABD ∽ ∆ACE (chung đỉnh A) suy ra ∆ABC ∽ ∆ADE. Ý c: CD = CM = R nên ∆CDM cân tại C.","nhin":"Giả thiết ∠DBC = 30° được dùng ở những bước nào? Bỏ nó đi thì ý c còn đúng không?","nhinDap":"Giả thiết dùng để có ∠DCB = 60°, CD = R, ∆CDM cân có góc ở đỉnh 120° và ∆DBM cân. Bỏ đi thì ý c không còn đúng nói chung.","deep":{"huong":[{"ten":"Pythagore với chân đường vuông góc","kq":"duoc","y":["Kẻ DK ⊥ BC. ∆DKC vuông tại K có ∠DCK = 60° ⇒ DK = R.sin 60° = R√3/2, KC = R/2.","KM = KC + CM = 3R/2 ⇒ DM² = DK² + KM² = 3R²/4 + 9R²/4 = 3R²."]},{"ten":"Đoán đoạn bằng nhau từ con số","kq":"duoc","y":["CD = R = CM ⇒ ∆CDM cân, ∠DCM = 120° ⇒ ∠CMD = 30° = ∠DBM ⇒ DM = DB = R√3."]}],"binh":["Hai hướng đều tốt. Hướng 2 rèn thói quen “nhìn con số trong kết luận để đoán đoạn bằng nhau”, rất hữu ích ở các ý tính toán."]},"loai":"sector","gt":["∆ABC nhọn (AB > AC), đường cao BD, CE cắt nhau tại H","O là trung điểm BC, R = BC/2; ∠DBC = 30°","M thuộc tia đối của tia CB, CM = R"],"inputs":[{"code":"V3","text":"CD = R; DB = R√3","keep":1,"why":""},{"code":"G7","text":"∠DCM = 120°","keep":1,"why":""},{"code":"G6","text":"∠CDM = ∠CMD = 30°","keep":1,"why":""},{"code":"G6","text":"∆DBM cân tại D","keep":1,"why":""},{"code":"S2","text":"ý b: AB.AE = AC.AD","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"CD = BC.sin∠DBC = 2R.sin 30° = R","ld":"∆BDC vuông tại D, BC = 2R","codes":["V3"]},{"cm":"∠DCB = 90° − 30° = 60° ⇒ ∠DCM = 120°","ld":"hai góc kề bù","codes":["G7"]},{"cm":"∠CDM = ∠CMD = (180° − 120°)/2 = 30°","ld":"CD = CM = R: ∆CDM cân tại C","codes":["G6"]},{"cm":"∠DBM = ∠DMB = 30° ⇒ DM = DB","ld":"∆DBM cân tại D","codes":["G6"]},{"cm":"DB = BC.cos 30° = R√3","ld":"∆BDC vuông tại D","codes":["V3"]},{"cm":"DM² = DB² = 3R²","ld":"Từ 4 và 5","codes":["K6"]}]},{"boost":["B7"],"id":"3.3","ch":3,"truong":"Cầu Diễn","ky":"giữa HKII","de":["Cho ∆ABC nội tiếp đường tròn (O; R). Cho hai đường cao AD, BE của ∆ABC cắt nhau tại H.","a) Chứng minh tứ giác AEDB nội tiếp.","b) Kẻ đường kính AK của đường tròn (O). Chứng minh ∆ADB ∽ ∆ACK và AB.AC = 2AD.R.","c) Gọi F là hình chiếu của điểm B trên AK, M là trung điểm của BC. Chứng minh DF // CK, từ đó suy ra ba điểm E, F, M thẳng hàng."],"yl":"c","yc":"Gọi F là hình chiếu của điểm B trên AK, M là trung điểm của BC. Chứng minh DF // CK, từ đó suy ra ba điểm E, F, M thẳng hàng.","kl":"DF // CK; E, F, M thẳng hàng","hinh":"img/b3.3.png","huong":"Tia MF trùng tia ME (NM là trục đối xứng chung của hai dây DF, BE).","giu":"∆ADB ∽ ∆ACK; ABDE nội tiếp đường tròn đường kính AB.","noi":"A, B, D, E, F cùng thuộc đường tròn đường kính AB (tâm N là trung điểm AB). NM // AC nên NM vuông góc với cả DF và BE.","nhin":"Đường thẳng nào là trục đối xứng chung? Tìm hai bài khác trong chương dùng cùng ý này.","nhinDap":"NM là trục đối xứng chung của hai dây DF, BE. Cùng ý này: Bài 3.6 (Thăng Long), Bài 3.7 (Đại Áng).","deep":{"huong":[{"ten":"Góc bẹt tại F","kq":"tac","y":["Cần ∠EFA + ∠AFM = 180° hoặc tương tự; ∠AFM không tính được vì M không nằm trên đường tròn nào đi qua F."]},{"ten":"Trục đối xứng chung của hai dây","kq":"duoc","y":["NM ⊥ DF và NM ⊥ BE, N là tâm ⇒ NM là trung trực của DF và của BE.","Do đó NM là tia phân giác của ∠DMF và ∠BME; tia MD trùng tia MB ⇒ ∠NMF = ∠NME ⇒ tia MF trùng tia ME."]}],"binh":["Dấu hiệu: nhiều điểm cùng nằm trên một đường tròn và có hai dây song song (cùng vuông góc với AC) ⇒ đường thẳng qua tâm vuông góc với hai dây là trục đối xứng chung. Đây là kỹ thuật dùng lại ở Bài 3.6, 3.7."]},"loai":"sector","gt":["∆ABC nội tiếp (O; R); đường cao AD, BE cắt nhau tại H","AK là đường kính; BF ⊥ AK","M là trung điểm BC"],"inputs":[{"code":"N1, N3","text":"∠DFK = ∠ABD","keep":1,"why":""},{"code":"G1, G5","text":"DF // CK","keep":1,"why":""},{"code":"G2","text":"DF ⊥ AC; BE ⊥ AC","keep":1,"why":""},{"code":"N1","text":"A, B, D, E, F thuộc đường tròn tâm N","keep":1,"why":""},{"code":"P2","text":"NM // AC","keep":1,"why":""},{"code":"N4","text":"NM là trung trực của DF, BE","keep":1,"why":""},{"code":"S1","text":"ý b: ∆ADB ∽ ∆ACK","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"ABDF nội tiếp ⇒ ∠DFK = ∠ABD","ld":"∠AFB = ∠ADB = 90°; góc ngoài bằng góc trong đối","codes":["N1","N3"]},{"cm":"∠ABD = ∠AKC = ∠FKC ⇒ ∠DFK = ∠FKC ⇒ DF // CK","ld":"Cùng chắn cung AC; so le trong","codes":["G1","G5"]},{"cm":"DF ⊥ AC; BE ⊥ AC","ld":"CK ⊥ AC (∠ACK chắn nửa đường tròn)","codes":["G2"]},{"cm":"A, B, D, E, F cùng thuộc đường tròn tâm N (N là trung điểm AB)","ld":"∠ADB = ∠AEB = ∠AFB = 90°","codes":["N1"]},{"cm":"NM // AC ⇒ NM ⊥ DF, NM ⊥ BE","ld":"NM là đường trung bình của ∆ABC; từ 3","codes":["P2"]},{"cm":"NM là phân giác của ∠DMF và của ∠BME","ld":"Đường qua tâm vuông góc với dây là trung trực của dây","codes":["N4"]},{"cm":"∠NMF = ∠NMD = ∠NMB = ∠NME","ld":"Từ 6; tia MD trùng tia MB (D nằm giữa B và M)","codes":[]},{"cm":"Tia MF trùng tia ME ⇒ E, F, M thẳng hàng","ld":"E, F cùng phía đối với NM","codes":["K1"]}]},{"boost":["B7"],"id":"3.4","ch":3,"truong":"Amsterdam","ky":"giữa HKII","de":["Cho tam giác nhọn ABC (AB < AC), nội tiếp đường tròn (O). Ba đường cao AD, BE, CF của tam giác ABC đồng quy tại H. Gọi M là trung điểm cạnh BC.","a) Chứng minh tứ giác AEHF là tứ giác nội tiếp.","b) Đường tròn ngoại tiếp tứ giác AEHF cắt đường tròn (O) tại điểm thứ hai là G khác A và cắt đường thẳng BG tại T khác G. Chứng minh AE.AC = AH.AD và tính số đo góc AGM.","c) Chứng minh ba điểm T, F, D là ba điểm thẳng hàng."],"yl":"c","yc":"Chứng minh ba điểm T, F, D là ba điểm thẳng hàng.","kl":"T, F, D thẳng hàng","hinh":"img/b3.4.png","huong":"∠BTF = ∠BTD (hai tia TF, TD trùng nhau).","giu":"G, T thuộc đường tròn đường kính AH (ý a, b).","noi":"∆BTF ∽ ∆BAG và ∆BTD ∽ ∆BCG (chung đỉnh B).","nhin":"Kể các cặp tam giác đồng dạng chung đỉnh B mà em đã dùng. Cặp nào ghép “theo cột”?","nhinDap":"∆BTF ∽ ∆BAG, ∆BFD ∽ ∆BCA, ∆BTD ∽ ∆BCG. Cặp ∆BTD ∽ ∆BCG suy ra từ BT.BG = BD.BC.","deep":{"huong":[{"ten":"Hai góc đối đỉnh t  Gọi F là chân đường vuông góc kẻ từ điểm C đến đường thẳng AB, I là trung điểm của đoạn thẳng EF. Chứng minh rằng H, I, K thẳng hàng."],"yl":"c","yc":"Gọi F là chân đường vuông góc kẻ từ điểm C đến đường thẳng AB, I là trung điểm của đoạn thẳng EF. Chứng minh rằng H, I, K thẳng hàng.","kl":"H, I, K thẳng hàng","hinh":"img/b3.5.png","huong":"∠BHK = ∠BHI (hai tia HK, HI trùng nhau).","giu":"BHEK nội tiếp nên ∠BHK = ∠BEK; BH.BA = BK.BC.","noi":"Giống Bài 3.2 (Lê Hồng Phong). Có thể đi ngắn: ∠BHK = ∠BEK = ∠ACB và ∠FHI = ∠HFI = ∠ACB.","nhin":"Ý b của hai bài Lê Hồng Phong và Phúc Đồng khác nhau. Ý b nào giúp ý c nhiều hơn?","nhinDap":"Cả hai ý b đều dẫn tới ∠BHK = ∠ACB; ý b của Lê Hồng Phong nói thẳng ∆BAC ∽ ∆BKH nên dùng nhanh hơn.","deep":{"huong":[{"ten":"Bài toán phụ 7 như Bài 3.2","kq":"duoc","y":["∆EHF ∽ ∆EKC ⇒ ∆EHK ∽ ∆EFC ⇒ ∠EHK = ∠EFC = ∠EHI."]},{"ten":"Góc tại H qua tứ giác nội tiếp","kq":"duoc","y":["∠BHK = ∠BEK = ∠ACB; ∠FHI = ∠ACB ⇒ ∠BHK = ∠BHI ⇒ tia HK trùng tia HI."]}],"binh":["Hai đề khác trường cho cùng một hình: nhận ra “bài này giống bài nào” là bước Nhìn lại có giá trị nhất. Khi đã có kinh nghiệm, hướng ngắn tự hiện ra."]},"loai":"sector","gt":["∆ABC nhọn, đường cao BE","EH ⊥ AB, EK ⊥ BC","CF ⊥ AB; I là trung điểm EF"],"inputs":[{"code":"N3, G4","text":"ý a: ∠BHK = ∠BEK = ∠ACB","keep":1,"why":""},{"code":"N1, N3","text":"∠AFE = ∠ACB","keep":1,"why":""},{"code":"V2, G6","text":"∠FHI = ∠HFI = ∠ACB","keep":1,"why":""},{"code":"K1","text":"hai tia HK, HI trùng nhau","keep":1,"why":""},{"code":"S2","text":"ý b: BH.BA = BK.BC","keep":0,"why":"Không phục vụ điều đang cần ở ý c."}],"steps":[{"cm":"∠BHK = ∠BEK = ∠ACB","ld":"BHEK nội tiếp (ý a); cùng phụ ∠EBC","codes":["N3","G4"]},{"cm":"∠AFE = ∠ACB","ld":"BFEC nội tiếp (∠BFC = ∠BEC = 90°)","codes":["N1","N3"]},{"cm":"∠HFE = ∠AFE; tia HF trùng tia HB","ld":"H nằm giữa A và F; F nằm giữa H và B","codes":[]},{"cm":"IH = IF ⇒ ∠FHI = ∠HFI = ∠HFE = ∠ACB","ld":"HI là trung tuyến ứng với cạnh huyền của ∆EHF","codes":["V2","G6"]},{"cm":"∠BHK = ∠BHI ⇒ H, I, K thẳng hàng","ld":"Từ 1, 3, 4; K, I cùng phía đối với AB","codes":["K1"]}]},{"boost":[],"id":"3.6","ch":3,"truong":"Thăng Long","ky":"cuối HKII","de":["Cho đường tròn (O; R) và dây BC cố định không đi qua tâm O. Gọi A là một điểm bất kì trên cung lớn BC (A khác B và C) sao cho tam giác ABC nhọn (AB < AC). Kẻ các đường cao AD, BE của tam giác ABC.","a) Chứng minh tứ giác AEDB nội tiếp đường tròn.","b) Kẻ đường kính AK của đường tròn tâm O. Gọi F là hình chiếu của điểm B trên AK. Chứng minh rằng AB.AC = AK.AD và DF vuông góc với AC.","c) Gọi M là trung điểm của BC. Chứng minh E, F, M thẳng hàng."],"yl":"c","yc":"Gọi M là trung điểm của BC. Chứng minh E, F, M thẳng hàng.","kl":"E, F, M thẳng hàng","hinh":"img/b3.6.png","huong":"Tia MF trùng tia ME.","giu":"DF ⊥ AC (ý b); tứ giác AEDB nội tiếp.","noi":"DF ⊥ AC và BE ⊥ AC nên DF // BE: hai dây của đường tròn đường kính AB. NM // AC là trục đối xứng chung của hai dây.","nhin":"Vẽ hình Cầu Diễn (Bài 3.3) bên cạnh. Hai bài khác nhau ở chỗ nào?","nhinDap":"Hai đề gần như trùng nhau: Thăng Long cho sẵn DF ⊥ AC ở ý b; Cầu Diễn yêu cầu chứng minh DF // CK ở ý c.","deep":{"huong":[{"ten":"Góc bẹt tại F","kq":"tac","y":["Như Bài 3.3: M không nằm trên đường tròn nào qua F nên góc tại F khó tính."]},{"ten":"Trục đối xứng chung","kq":"duoc","y":["NM ⊥ DF, NM ⊥ BE ⇒ NM là trung trực của hai dây ⇒ ∠NMF = ∠NMD = ∠NMB = ∠NME ⇒ tia MF trùng tia ME."]}],"binh":["Đề Thăng Long cho sẵn DF ⊥ AC ở ý b; đề Cầu Diễn (Bài 3.3) bắt chứng minh DF // CK trước. Cùng một ý c, mức hỗ trợ khác nhau."]},"loai":"sector","gt":["(O; R), dây BC; A thuộc cung lớn, ∆ABC nhọn (AB < AC)","Đường cao AD, BE; AK là đường kính; BF ⊥ AK","M là trung điểm BC"],"inputs":[{"code":"N1","text":"A, B, D, E, F thuộc đường tròn tâm N","keep":1,"why":""},{"code":"P3","text":"ý b: DF ⊥ AC ⇒ DF // BE","keep":1,"why":""},{"code":"P2","text":"NM // AC","keep":1,"why":""},{"code":"N4","text":"NM là trục đối xứng chung của DF, BE","keep":1,"w
