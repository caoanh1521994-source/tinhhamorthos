<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Tinh hạm Orthos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Lexend:wght@300;400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Bố cục: một màn hình trò chơi – thanh trạng thái trên, sân khấu giữa (bản đồ tàu / máy lắp ráp / bộ sưu tập), lớp phủ cho thoại và phần thưởng.
   Một thế giới duy nhất (khoang tàu ban đêm) nên chỉ có một bảng màu tối, đặt tường minh. */
:root{
  --void:#0a0f1f;        /* nền vũ trụ */
  --hull:#121a33;        /* vỏ tàu, bề mặt */
  --panel:#18223f;       /* bảng điều khiển */
  --line:#2a3863;        /* đường kẻ bản vẽ */
  --holo:#6fe3f5;        /* ánh sáng hologram */
  --amber:#ffb547;       /* đèn cảnh báo, tinh thể */
  --ink:#e8edfb;         /* chữ */
  --muted:#93a0c6;       /* chữ phụ */
  --ok:#5fe0a0; --bad:#ff6b7a;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-math:"Noto Serif", "Cambria", "Times New Roman", serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden;
  background-image:linear-gradient(rgba(111,227,245,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,245,.04) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
/* thanh trạng thái */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,15,31,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--void)}
.hud .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--holo);box-shadow:0 0 12px var(--holo)}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.gem{width:12px;height:12px;background:var(--amber);transform:rotate(45deg);box-shadow:0 0 8px var(--amber)}
.hud nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:4px;cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.04em;font-size:14px}
.btn:hover{border-color:var(--holo)}
.btn.pri{background:var(--holo);color:#06202a;border-color:var(--holo)}
.btn.amb{background:var(--amber);color:#2a1700;border-color:var(--amber)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.muted{color:var(--muted)}
.math{font-family:var(--f-math)}
/* bản đồ tàu */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:16px}
@media (max-width:820px){.mapgrid{grid-template-columns:1fr}}
.ship{background:var(--hull);border:1px solid var(--line);border-radius:6px;padding:12px;position:relative;overflow:hidden}
.ship svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone rect,.zone path{transition:fill .2s}
.zones{display:grid;gap:10px}
.zcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left}
.zcard:hover{border-color:var(--holo)}
.zcard .num{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--holo);width:34px;text-align:center}
.zcard.lock{opacity:.5;cursor:not-allowed}
.bar{height:6px;background:#0d1430;border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),var(--ok))}
/* danh sách nhiệm vụ */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;text-align:left;display:grid;gap:6px}
.mcard:hover{border-color:var(--holo)}
.mcard .id{font-family:var(--f-display);font-weight:700;font-size:18px}
.mcard .kl{font-family:var(--f-math);font-size:15px}
.stars{color:var(--amber);letter-spacing:2px;font-size:14px}
.stars .off{color:#3a4670}
.tag{display:inline-block;font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.done{border-color:var(--ok);color:var(--ok)}
.tag.lock{border-color:var(--bad);color:var(--bad)}
/* thẻ */
.cardsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.card{position:relative;border-radius:8px;padding:8px 8px 10px;background:linear-gradient(160deg,var(--c2),#0f1630 70%);border:2px solid var(--c);text-align:left;cursor:pointer;display:grid;gap:4px;min-height:200px;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset}
.card.r3{box-shadow:0 0 14px -4px var(--c)}
.card.r4{border-image:linear-gradient(135deg,#ffd27a,#6fe3f5,#c58bff) 1;box-shadow:0 0 20px -4px #ffd27a}
.card .code{font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--c);color:#0a0f1f;padding:1px 6px;border-radius:3px;justify-self:start}
.card .art{height:74px;display:grid;place-items:center;background:rgba(10,15,31,.55);border-radius:5px}
.card .art svg{width:86px;height:64px}
.card .nm{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.2}
.card .ra{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .cnt{position:absolute;top:6px;right:8px;font-family:var(--f-display);font-size:12px;color:var(--ink)}
.card.miss{filter:grayscale(1) brightness(.45)}
.card.miss .nm::after{content:" ?"}
.card .rar{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);font-family:var(--f-display)}
.card.doc .rar{color:var(--bad)}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c);background:linear-gradient(160deg,var(--c2),#0f1630);border-radius:5px;padding:4px 8px 4px 4px;cursor:pointer;font-size:13px;text-align:left}
.mini .code{font-family:var(--f-display);font-weight:700;font-size:12px;background:var(--c);color:#0a0f1f;padding:0 5px;border-radius:3px}
.mini.used{opacity:.35}
.mini.wrong{animation:shake .35s;border-color:var(--bad)}
.badge{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;background:var(--c);color:#0a0f1f;padding:0 5px;border-radius:3px;margin-right:3px}
/* máy lắp ráp */
.mission{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;margin-top:12px}
@media (max-width:900px){.mission{grid-template-columns:1fr}}
.holo{background:var(--hull);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;align-content:start}
.holo img{width:100%;border-radius:4px;filter:invert(1) hue-rotate(180deg) brightness(1.05) contrast(1.05);background:#fff;mix-blend-mode:screen}
.de{font-size:14px;display:grid;gap:4px}
.de p{margin:0}
.de .focus{border-left:3px solid var(--amber);padding-left:8px;background:rgba(255,181,71,.07)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;padding:4px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--holo);color:var(--holo);box-shadow:0 0 10px -4px var(--holo)}
.steps span.dn{border-color:var(--ok);color:var(--ok)}
.machine{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:12px;align-content:start;position:relative}
.heat{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.heat .cells{display:flex;gap:3px}
.heat .cells i{width:14px;height:10px;border-radius:2px;background:#1d2850}
.heat .cells i.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.gtkl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.gtkl .lb{font-family:var(--f-display);font-weight:700;padding:2px 8px;border-radius:3px;font-size:13px}
.gtkl .lb.gt{background:#1f5a3c;color:#c9ffe2}.gtkl .lb.kl{background:#6a1f2b;color:#ffd6dc}
.gtkl ul{margin:0;padding-left:18px;font-family:var(--f-math);font-size:15px}
.say{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:#101836;border:1px solid var(--line);border-radius:6px;padding:10px}
.say .bot{width:46px;height:56px}
.say p{margin:0;font-size:14px}
.say b{color:var(--holo);font-family:var(--f-display);letter-spacing:.06em}
.inputs{display:grid;gap:8px}
.inp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#111a37;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.inp .txt{font-family:var(--f-math);font-size:14.5px}
.inp .sw{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;padding:3px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);min-width:64px;text-align:center}
.inp.in .sw{border-color:var(--holo);color:var(--holo);background:rgba(111,227,245,.08)}
.inp.out .sw{border-color:var(--bad);color:var(--bad)}
.inp.wrong{animation:shake .35s;border-color:var(--bad)}
.inp .why{grid-column:2/4;font-size:12.5px;color:var(--amber)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qa{display:grid;gap:8px}
.qa .r{display:grid;grid-template-columns:110px 1fr;gap:10px;background:#111a37;border-radius:6px;padding:8px 10px;border:1px solid var(--line)}
@media (max-width:520px){.qa .r{grid-template-columns:1fr}}
.qa .lab{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--amber)}
.qa .q{font-style:italic;color:var(--muted);font-size:13.5px}
.qa .a{font-family:var(--f-math);font-size:14.5px}
.line{display:grid;gap:8px;counter-reset:st}
.st{display:grid;grid-template-columns:28px 1fr;gap:10px;background:#0f1734;border:1px solid var(--line);border-radius:6px;padding:8px 10px;opacity:.45}
.st.cur{opacity:1;border-color:var(--holo);box-shadow:0 0 16px -8px var(--holo)}
.st.ok{opacity:1;border-color:#245e48}
.st .n{font-family:var(--f-display);font-weight:700;color:var(--holo)}
.st .cm{font-family:var(--f-math);font-size:15px}
.st .ld{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.sockets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sock{min-width:54px;height:30px;border:1px dashed var(--holo);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;color:var(--holo);padding:0 6px}
.sock.f{border-style:solid;background:var(--c);color:#0a0f1f;font-weight:700;border-color:var(--c)}
.tray{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.tray .tabs{display:flex;gap:4px;flex-wrap:wrap}
.tray .tabs button{border:1px solid var(--line);background:#111a37;border-radius:3px;padding:2px 8px;font-family:var(--f-display);font-size:12px;cursor:pointer}
.tray .tabs button.on{border-color:var(--holo);color:var(--holo)}
.tray .hand{display:flex;gap:6px;flex-wrap:wrap;max-height:180px;overflow:auto}
.deep{display:grid;gap:8px}
.modes{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;justify-self:start}
.modes button{background:#111a37;border:0;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.modes button.on{background:var(--holo);color:#06202a;font-weight:700}
.say .note{display:inline-block;margin-top:6px;color:var(--amber);font-size:13px}
.kb{display:flex;flex-wrap:wrap;gap:4px;background:#0d1430;border:1px solid var(--line);border-radius:6px;padding:8px}
.key{min-width:34px;height:32px;border:1px solid var(--line);background:#18223f;border-radius:4px;cursor:pointer;font-family:var(--f-math);font-size:16px;padding:0 6px}
.key:hover{border-color:var(--holo);color:var(--holo)}
.alt{display:grid;gap:8px}
.aline{display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:start;background:#0f1734;border:1px solid var(--line);border-radius:6px;padding:8px}
.aline.sel{border-color:var(--holo)}
.aline.err{border-color:var(--bad)}
@media (max-width:620px){.aline{grid-template-columns:24px minmax(0,1fr) auto}.aline .ldbox{grid-column:2/3}}
.aline .n{font-family:var(--f-display);font-weight:700;color:var(--holo);padding-top:6px}
.aline input{width:100%;background:#0a0f1f;border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:6px 8px;font-size:15px}
.aline input:focus{border-color:var(--holo);outline:none}
.aline input.math{font-family:var(--f-math)}
.ldbox{display:grid;gap:4px}
.badge.rm{border:0;cursor:pointer}
details.mau{background:#111a37;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
details.mau summary{cursor:pointer;font-family:var(--f-display);color:var(--holo)}
details.mau ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px}
#cptxt{background:#0a0f1f;color:var(--ink);border:1px solid var(--line);border-radius:4px;font-family:var(--f-body)}
.opt{background:#111a37;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;display:grid;gap:4px}
.opt:hover{border-color:var(--holo)}
.opt.rv{cursor:default}
.kq{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;padding:1px 6px;border-radius:3px;justify-self:start}
.kq.tac{background:#5a1f2a;color:#ffc2cb}.kq.dai{background:#5a4314;color:#ffe2a6}.kq.duoc{background:#14503e;color:#b6f5dc}
/* lớp phủ */
.ov{position:fixed;inset:0;background:rgba(5,8,20,.82);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
.ov .box{background:var(--hull);border:1px solid var(--holo);border-radius:8px;max-width:620px;width:100%;padding:20px;display:grid;gap:14px;max-height:88vh;overflow:auto;box-shadow:0 0 40px -10px var(--holo)}
.ov .box.wide{max-width:900px}
.story{font-size:16px;line-height:1.65}
.story .big{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.06em}
.pack{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pack .card{width:160px;animation:flip .6s both}
.pack .card:nth-child(2){animation-delay:.15s}.pack .card:nth-child(3){animation-delay:.3s}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.product{border:1px solid var(--amber);border-radius:6px;padding:14px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(255,181,71,.18),transparent 70%)}
.product .kl{font-family:var(--f-math);font-size:20px}
.scan{position:relative;overflow:hidden;border-radius:6px;background:#fff}
.scan img{display:block;width:100%}
.scan::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(transparent,rgba(111,227,245,.55),transparent);animation:scan 2.2s ease-in-out 2}
@keyframes scan{to{top:100%}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--holo);padding:8px 14px;border-radius:4px;z-index:60;font-family:var(--f-display);font-size:14px}
.bigcard{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:560px){.bigcard{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
main.wrap{position:relative;z-index:1}
.ship{background:transparent!important;padding:0!important;border:0!important}
.ship svg{border-radius:12px;box-shadow:0 10px 40px -14px #b48cf2}
.zone.off .part{opacity:.78}
.zone{cursor:pointer}
.zone:hover .part,.zone:focus .part{filter:drop-shadow(0 0 7px #b48cf2)}
.shipbob{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -5px}}
.ship3d{position:relative;width:100%;aspect-ratio:980/440;min-height:340px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 18% 22%,rgba(122,79,214,.38),transparent 38%),radial-gradient(circle at 84% 70%,rgba(31,143,255,.3),transparent 40%),radial-gradient(circle at 60% 10%,rgba(255,61,154,.18),transparent 30%),radial-gradient(ellipse at 55% 45%,#151b40 0%,#080c1d 60%,#03050b 100%);box-shadow:inset 0 0 0 1px #2a3570,0 18px 50px -20px #7c5cff;touch-action:pan-y;user-select:none}
.ship3d .s3cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.ship3d svg.s3ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;box-shadow:none;border-radius:0}
.s3ln .ln{stroke:#9fb2ff;stroke-width:1.4;stroke-dasharray:3 4;opacity:.75}.s3ln .ln.bad{stroke:#ff5a75}.s3ln .ln.ok{stroke:#4dffb0}
.s3ln .dt{fill:#cfd8ff}.s3ln .dt.bad{fill:#ff3b5c}.s3ln .dt.ok{fill:#4dffb0}.s3ln .dt.off{fill:#6b7290}
.s3lay{position:absolute;inset:0;pointer-events:none}
.s3lab{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;border:1px solid #3a4785;background:rgba(10,14,34,.78);backdrop-filter:blur(6px);color:#e8edfb;font:700 12.5px var(--f-display),sans-serif;cursor:pointer;white-space:nowrap;transition:border-color .15s,box-shadow .15s}
.s3lab i{width:9px;height:9px;border-radius:50%;background:#6b7290;flex:none}
.s3lab.bad i{background:#ff3b5c;box-shadow:0 0 8px #ff3b5c;animation:warn 1.2s infinite}.s3lab.ok i{background:#4dffb0;box-shadow:0 0 8px #4dffb0}
.s3lab em{font-style:normal;font-size:12px;color:#8e98c4}.s3lab.bad em{color:#ff7a90}.s3lab.ok em{color:#4dffb0}
.s3lab .ns{display:none}
.s3lab:hover,.s3lab.hl,.s3lab:focus-visible{border-color:#6fe3f5;box-shadow:0 0 0 2px rgba(111,227,245,.35),0 0 18px rgba(111,227,245,.35);outline:none}
.s3lab.off{opacity:.8}
.s3hint{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#8e98c4;pointer-events:none}
@media (max-width:640px){.s3lab{padding:4px 9px 4px 7px;font-size:11px;gap:5px}.s3lab .nf{display:none}.s3lab .ns{display:inline}.s3lab em{font-size:11px}.ship3d{min-height:300px}}

:false},{"id":"N4","nhom":"N","nhomTen":"ĐƯỜNG TRÒN – NỘI TIẾP","ten":"Đường kính và dây","khi":"Đường thẳng qua tâm với một dây; hai đường tròn cắt nhau.","ra":"Đường kính ⊥ dây ⇔ đi qua trung điểm của dây; dây chung ⊥ đường nối tâm.","mau":"#1565C0","rar":3,"doc":false},{"id":"N5","nhom":"N","nhomTen":"ĐƯỜNG TRÒN – NỘI TIẾP","ten":"Đường trung trực","khi":"Một điểm cách đều hai đầu đoạn thẳng (bán kính, hai tiếp tuyến…).","ra":"Điểm đó nằm trên trung trực; hai điểm như vậy xác định trung trực.","mau":"#1565C0","rar":3,"doc":false},{"id":"T1","nhom":"T","nhomTen":"TIẾP TUYẾN","ten":"Tiếp tuyến và bán kính","khi":"Đường thẳng tiếp xúc với đường tròn tại một điểm.","ra":"Tiếp tuyến vuông góc với bán kính tại tiếp điểm.","mau":"#6A1B9A","rar":3,"doc":false},{"id":"T2","nhom":"T","nhomTen":"TIẾP TUYẾN","ten":"Hai tiếp tuyến cắt nhau","khi":"Từ một điểm A kẻ hai tiếp tuyến AB, AC.","ra":"AB = AC; AO là phân giác của ∠BAC, ∠BOC; AO là trung trực của BC.","mau":"#6A1B9A","rar":3,"doc":false},{"id":"T3","nhom":"T","nhomTen":"TIẾP TUYẾN","ten":"Tiếp tuyến tại hai đầu đường kính","khi":"Tiếp tuyến tại A và tại B, với AB là đường kính.","ra":"Hai tiếp tuyến song song (cùng vuông góc với AB).","mau":"#6A1B9A","rar":3,"doc":false},{"id":"S1","nhom":"S","nhomTen":"ĐỒNG DẠNG – BẰNG NHAU","ten":"Tam giác đồng dạng","khi":"Hai góc bằng nhau (g.g); một góc bằng nhau xen giữa hai cạnh tỉ lệ (c.g.c).","ra":"Các góc tương ứng bằng nhau; các cạnh tương ứng tỉ lệ.","mau":"#B8860B","rar":3,"doc":false},{"id":"S2","nhom":"S","nhomTen":"ĐỒNG DẠNG – BẰNG NHAU","ten":"Đẳng thức tích","khi":"Kết luận hoặc ý trước có dạng a.b = c.d.","ra":"Đổi thành tỉ lệ thức, đọc tên cặp tam giác đồng dạng.","mau":"#B8860B","rar":3,"doc":false},{"id":"S3","nhom":"S","nhomTen":"ĐỒNG DẠNG – BẰNG NHAU","ten":"Tam giác vuông đồng dạng","khi":"Hai tam giác vuông có chung (hoặc bằng) một góc nhọn.","ra":"Hai tam giác đồng dạng (g.g).","mau":"#B8860B","rar":3,"doc":false},{"id":"S4","nhom":"S","nhomTen":"ĐỒNG DẠNG –
